    return `<div class="ar">
      <div class="g"><strong>${esc(l.label)}</strong>
        <span class="sub2">${fmtD(l.dueDate)} · charged ${money2(l.amount)} · ${money2(room)} unpaid</span></div>

  :'<div class="empty">Nothing is charged for this tax yet. File a return first, and the liability it declares will appear here.</div>'}
  <div class="totrow" style="border-radius:0 0 9px 9px"><span id="a_sum"></span><span class="sp"></span>
    <button class="btn sm" id="a_auto">Oldest first</button>
    <button class="btn sm" id="a_clear">Clear</button></div>
  <div class="macts"><button class="btn" id="a_cancel">Cancel</button>
    <button class="btn pri" id="a_save">Save</button></div>`);
  const inputs=[...m.querySelectorAll('[data-al]')];
  const tot=()=>inputs.reduce((a,i)=>a+(+i.value||0),0);
  const sync=()=>{const t=r2(tot()),un=r2((+p.amount||0)-t);
    m.querySelector('#a_sum').innerHTML=`Allocated ${money2(t)} of ${money2(+p.amount)}`+
      (un>0.005?` · <span class="warn2">${money2(un)} left on account</span>`
       :un<-0.005?` · <span class="crit">over-allocated by ${money2(-un)}</span>`:' · fully allocated');};
  inputs.forEach(i=>i.oninput=sync); sync();
  m.querySelector('#a_clear').onclick=()=>{inputs.forEach(i=>i.value='');sync();};
  m.querySelector('#a_auto').onclick=()=>{
    inputs.forEach(i=>i.value='');
    const sug=autoAllocate(p.entityId,p.taxType,+p.amount,p.id);
    for(const s of sug){const i=inputs.find(x=>x.dataset.al===s.liabilityId);if(i)i.value=s.amount;}
    sync();
  };
  m.querySelector('#a_cancel').onclick=()=>m.remove();
  m.querySelector('#a_save').onclick=()=>{
    if(r2(tot())>r2(+p.amount)+0.005){alert('You cannot allocate more than the payment.');return;}
    p.allocs=inputs.filter(i=>+i.value).map(i=>({liabilityId:i.dataset.al,amount:r2(+i.value)}));
    m.remove(); save(); render();
  };
}

// --- A charge that no return declared: interest, penalty, amendment ---------
function liabilityModal(entityId,taxType,periodKey){
  const e=ent(entityId); if(!e)return;
  const taxes=e.type==='company'?[['CT','Corporation Tax'],['VAT','VAT'],['PAYE','PAYE & NIC']]
    :[['SA','Self Assessment'],['CGT','Capital Gains Tax']];
  // Newest first, and defaulted to the period being looked at. A charge filed
  // against a period three years back is invisible from the view you added it
  // in, which reads as the portal having lost it.
  const opts=t=>{const ss=slotsFor(e,t).slice().reverse();
    return ss.map(s=>`<option value="${s.periodKey}" ${s.periodKey===periodKey?'selected':''}>${esc(s.short)}</option>`).join('')
      ||'<option value="">—</option>';};
  const slots=slotsFor(e,taxType);
  const m=modal(`<h3>Add a charge</h3>
  <p class="mh-sub">${esc(e.name)} — interest, a penalty, or an HMRC amendment. Amounts a return declared are charged by filing it, not here.</p>
  <div class="row2">
    <div class="fg"><label>Tax</label><select id="k_tax">
      ${taxes.map(([v,l])=>`<option value="${v}" ${v===taxType?'selected':''}>${l}</option>`).join('')}</select></div>
    <div class="fg"><label>Type</label><select id="k_kind">
      <option value="interest">Interest</option><option value="penalty">Penalty</option>
      <option value="amendment">HMRC amendment</option><option value="other">Other</option></select></div>
  </div>
  <div class="row2">
    <div class="fg"><label>Amount</label><input type="number" step="0.01" id="k_amt" placeholder="0.00">
      <div class="hint">Negative for a credit HMRC has allowed.</div></div>
    <div class="fg"><label>Due</label><input type="date" id="k_due" value="${S.asAt}"></div>
  </div>
  <div class="fg"><label>Period it relates to</label><select id="k_pk">${opts(taxType||taxes[0][0])}</select></div>
  <div class="fg"><label>Description</label><input id="k_lab" placeholder="e.g. Late payment interest to 30 Sep 2026"></div>
  <div class="macts"><button class="btn" id="k_cancel">Cancel</button>
    <button class="btn pri" id="k_save">Add</button></div>`);
  m.querySelector('#k_tax').onchange=ev=>{m.querySelector('#k_pk').innerHTML=opts(ev.target.value);};
  m.querySelector('#k_cancel').onclick=()=>m.remove();
  m.querySelector('#k_save').onclick=()=>{
    const amt=+m.querySelector('#k_amt').value;
    if(!amt){alert('Enter an amount.');return;}
    const kind=m.querySelector('#k_kind').value;
    S.liabilities.push({id:NEW_ID(),entityId,taxType:m.querySelector('#k_tax').value,
      periodKey:m.querySelector('#k_pk').value||'',kind,
      label:m.querySelector('#k_lab').value||({interest:'Interest',penalty:'Penalty',
        amendment:'HMRC amendment',other:'Charge'})[kind],
      amount:amt,dueDate:m.querySelector('#k_due').value});
    m.remove(); save(); render();
  };
}

function personModal(entityId,personId,ty){
  const list=S.people[entityId]||[];
  const p=personId?list.find(x=>x.id===personId):null;
  const year=ty||tyOfDate(asAt());
  const cur=p?payFor(p.id,year):null;
  // Pay for OTHER years, so it is obvious this figure belongs to one year and
  // that the others exist separately.
  const others=p?TAX_YEARS.map(t=>({t,v:payFor(p.id,t)})).filter(x=>x.t!==year&&x.v!=null):[];
  const m=modal(`<h3>${p?'Edit person':'Add a person'}</h3>
  <p class="mh-sub">Pay is recorded for <strong>${tyLabel(year)}</strong>. Employment Allowance counts heads paid above the ${money(NIC.st)} annual secondary threshold, not directorships.</p>
  <div class="fg"><label>Name</label><input id="q_name" value="${esc(p?.name||'')}">
    <div class="hint">Held across every year.</div></div>
  <div class="row2">
    <div class="fg"><label>Director</label><select id="q_dir">
      <option value="yes" ${p?.director?'selected':''}>Yes</option>
      <option value="no" ${p&&!p.director?'selected':''}>No</option></select></div>
    <div class="fg"><label>Pay for ${tyLabel(year)}</label>
      <input type="number" id="q_pay" value="${cur==null?'':cur}" placeholder="Not entered">
      <div class="hint">Above ${money(NIC.st)} to count toward the allowance. Leave blank if they were not paid in this year.</div></div>
  </div>
  ${others.length?`<div class="fg"><label>Recorded in other years</label>
    <div class="mini">${others.map(o=>`${tyLabel(o.t)} ${money(o.v)}`).join(' · ')}</div>
    <div class="hint">Edit those from their own tax year.</div></div>`:''}
  <div class="macts">
    ${p?'<button class="btn danger" id="q_del">Remove from every year</button>':''}
    <button class="btn" id="q_cancel">Cancel</button>
    <button class="btn pri" id="q_save">Save</button></div>`);
  m.querySelector('#q_cancel').onclick=()=>m.remove();
  const d=m.querySelector('#q_del');
  if(d)d.onclick=()=>{
    if(!confirm(`Remove ${p.name} from the payroll in every year?\n\nTo record that they left, cancel and clear the pay for the later years instead.`))return;
    S.people[entityId]=list.filter(x=>x.id!==personId);
    for(const t of TAX_YEARS)delete S.pay[ykey(personId,t)];
    m.remove(); save(); render();
  };
  m.querySelector('#q_save').onclick=()=>{
    const name=m.querySelector('#q_name').value.trim();
    if(!name){alert('Enter a name.');return;}
    const id=p?p.id:NEW_ID();
    const rec={id,name,director:m.querySelector('#q_dir').value==='yes'};
    S.people[entityId]=p?list.map(x=>x.id===p.id?rec:x):[...list,rec];
    const raw=m.querySelector('#q_pay').value;
    if(raw==='')delete S.pay[ykey(id,year)]; else S.pay[ykey(id,year)]=+raw;
    m.remove(); save(); render();
  };
}

function propertyModal(entityId,ty){
  const year=ty||tyOfDate(asAt());
  const m=modal(`<h3>Add a property</h3>
  <p class="mh-sub">The property is held across years. The figures below are for <strong>${tyLabel(year)}</strong>.</p>
  <div class="fg"><label>Description</label><input id="r_name" placeholder="e.g. 12 High Street"></div>
  <div class="row3">
    <div class="fg"><label>Rent ${tyLabel(year)}</label><input type="number" id="r_rent" placeholder="0"></div>
    <div class="fg"><label>Expenses</label><input type="number" id="r_exp" placeholder="0"></div>
    <div class="fg"><label>Finance costs</label><input type="number" id="r_fin" placeholder="0"></div>
  </div>
  <div class="row2">
    <div class="fg"><label>Jointly held with spouse</label><select id="r_joint">
      <option value="no">No</option><option value="yes">Yes</option></select></div>
    <div class="fg"><label>Your share %</label><input type="number" id="r_share" value="100"></div>
  </div>
  <div class="macts"><button class="btn" id="r_cancel">Cancel</button>
    <button class="btn pri" id="r_save">Add</button></div>`);
  m.querySelector('#r_cancel').onclick=()=>m.remove();
  m.querySelector('#r_save').onclick=()=>{
    const id=NEW_ID();
    S.properties.push({id,entityId,
      name:m.querySelector('#r_name').value.trim()||'Property',
      joint:m.querySelector('#r_joint').value==='yes',

    S.propFigures[ykey(id,year)]={rent:m.querySelector('#r_rent').value,
      expenses:m.querySelector('#r_exp').value,finance:m.querySelector('#r_fin').value};
    m.remove(); save(); render();
  };
}

function dateModal(){
  const m=modal(`<h3>Working date</h3>
  <p class="mh-sub">Everything — deadlines, overdue flags, nudges — is computed as at this date.</p>
  <div class="fg"><label>Date</label><input type="date" id="d_val" value="${S.asAt}"></div>
  <div class="macts"><button class="btn" id="d_cancel">Cancel</button>
    <button class="btn pri" id="d_save">Set</button></div>`);
  m.querySelector('#d_cancel').onclick=()=>m.remove();
  m.querySelector('#d_save').onclick=()=>{
    S.asAt=m.querySelector('#d_val').value||S.asAt; m.remove(); save(); render();};
}

// ===========================================================================
// WIRING
// ===========================================================================
function wire(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;render();});
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>entityModal(null));
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>entityModal(b.dataset.edit));
  document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{
    const [id,k]=b.dataset.sub.split(':'); activeSub[id]=k; render();});
  document.querySelectorAll('[data-addpay]').forEach(b=>b.onclick=()=>{
    const [id,t,ty]=b.dataset.addpay.split(':'); paymentModal(id,t,ty);});
  document.querySelectorAll('[data-year]').forEach(b=>b.onclick=()=>{
    const [id,y]=b.dataset.year.split(':'); activeYear[id]=y; render();});
  document.querySelectorAll('[data-moreyears]').forEach(b=>b.onclick=()=>{
    S.yearsShown=Math.min((S.yearsShown||5)+1,TAX_YEARS.length); save(); render();});
  document.querySelectorAll('[data-hideclosed]').forEach(c=>c.onchange=()=>{
    S.hideClosed=S.hideClosed||{};
    S.hideClosed[c.dataset.hideclosed]=c.checked;
    delete activeYear[c.dataset.hideclosed];
    save(); render();});
  document.querySelectorAll('[data-close]').forEach(c=>c.onchange=()=>{
    const [id,ty]=c.dataset.close.split(':');
    S.yearClosed[ykey(id,ty)]=c.checked?{closed:true,closedOn:S.asAt}:{closed:false};
    if(c.checked&&hidesClosed(id))delete activeYear[id];
    save(); render();});
  el('btnIvor').onclick=()=>ivorToggle();
  ivorInit(); ivorCount();
  // Contextual questions: a handle next to a figure opens Ivor on that topic
  // with the live value in hand, so "what does this mean?" is answered about
  // YOUR number rather than in the abstract.
  document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{
    const [topic,entityId,periodKey]=b.dataset.q.split('|');
    const k=kbById(topic); if(!k)return;
    ivorToggle(true);
    ivorAsk(k.t,{topic,entityId,periodKey});
  });
  document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>{
    const [id,t,pk]=b.dataset.file.split(':'); returnModal(id,t,pk);});
  document.querySelectorAll('[data-alloc]').forEach(b=>b.onclick=()=>allocModal(b.dataset.alloc));
  document.querySelectorAll('[data-addliab]').forEach(b=>b.onclick=()=>{
    const [id,t,pk]=b.dataset.addliab.split(':'); liabilityModal(id,t,pk);});
  document.querySelectorAll('[data-delliab]').forEach(b=>b.onclick=()=>{
    S.liabilities=S.liabilities.filter(x=>x.id!==b.dataset.delliab);
    ledgerInvalidate(); save(); render();});
  document.querySelectorAll('[data-delpay]').forEach(b=>b.onclick=()=>{
    S.payments=S.payments.filter(p=>p.id!==b.dataset.delpay); save(); render();});
  document.querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>{
    const i=b.dataset.mark.lastIndexOf(':');
    const key=b.dataset.mark.slice(0,i), st=b.dataset.mark.slice(i+1);
    if(st==='open')delete S.filings[key]; else S.filings[key]=st;
    save(); render();});
  document.querySelectorAll('[data-addperson]').forEach(b=>b.onclick=()=>{
    const [e,ty]=b.dataset.addperson.split(':'); personModal(e,null,ty);});
  document.querySelectorAll('[data-editperson]').forEach(b=>b.onclick=()=>{
    const [e,p,ty]=b.dataset.editperson.split(':'); personModal(e,p,ty);});
  document.querySelectorAll('[data-payyear]').forEach(b=>b.onclick=()=>{
    const [e,ty]=b.dataset.payyear.split(':'); activePayYear[e]=ty; render();});
  document.querySelectorAll('[data-movepay]').forEach(b=>b.onclick=()=>{
    const [e,from]=b.dataset.movepay.split(':');
    const to=document.getElementById('mvPay').value;
    if(anyPayRecorded(e,to)&&!confirm(`${tyLabel(to)} already has payroll recorded. Overwrite it?`))return;
    for(const p of S.people[e]||[]){const v=payFor(p.id,from);
      if(v!=null){S.pay[ykey(p.id,to)]=v; delete S.pay[ykey(p.id,from)];}}
    activePayYear[e]=to; S.migratedYear=null; save(); render();});
  document.querySelectorAll('[data-moveprop]').forEach(b=>b.onclick=()=>{
    const [e,from]=b.dataset.moveprop.split(':');
    const to=document.getElementById('mvProp').value;
    if(anyPropRecorded(e,to)&&!confirm(`${tyLabel(to)} already has figures recorded. Overwrite them?`))return;
    for(const p of propsOf(e)){const f=(S.propFigures||{})[ykey(p.id,from)];
      if(f){S.propFigures[ykey(p.id,to)]={...f}; delete S.propFigures[ykey(p.id,from)];}}
    activePropYear[e]=to; activeYear[e]=to; S.migratedYear=null; save(); render();});
  document.querySelectorAll('[data-copypay]').forEach(b=>b.onclick=()=>{
    const [e,from,to]=b.dataset.copypay.split(':');
    for(const p of S.people[e]||[]){const v=payFor(p.id,from); if(v!=null)S.pay[ykey(p.id,to)]=v;}
    save(); render();});
  document.querySelectorAll('[data-propyear]').forEach(b=>b.onclick=()=>{
    const [e,ty]=b.dataset.propyear.split(':'); activePropYear[e]=ty; render();});
  document.querySelectorAll('[data-copyprop]').forEach(b=>b.onclick=()=>{
    const [e,from,to]=b.dataset.copyprop.split(':');
    for(const p of propsOf(e)){const f=(S.propFigures||{})[ykey(p.id,from)];
      if(f)S.propFigures[ykey(p.id,to)]={...f};}
    save(); render();});
  document.querySelectorAll('[data-pf]').forEach(i=>i.onchange=()=>{
    const [pid,ty,field]=i.dataset.pf.split('|');
    const k=ykey(pid,ty);
    S.propFigures[k]={...propFig(pid,ty),[field]:i.value};
    save(); render();});
  document.querySelectorAll('[data-addprop]').forEach(b=>b.onclick=()=>{
    const [e,ty]=b.dataset.addprop.split(':'); propertyModal(e,ty);});
  document.querySelectorAll('[data-delprop]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.delprop;
    if(!confirm('Delete this property and its figures for every year?'))return;
    S.properties=S.properties.filter(p=>p.id!==id);
    for(const t of TAX_YEARS)delete S.propFigures[ykey(id,t)];
    save(); render();});
  document.querySelectorAll('[data-inc]').forEach(i=>i.onchange=()=>{
    const j=i.dataset.inc.lastIndexOf(':');
    const key=i.dataset.inc.slice(0,j), k=i.dataset.inc.slice(j+1);
    S.income[key]=S.income[key]||{}; S.income[key][k]=i.value; save(); render();});
  document.querySelectorAll('[data-comp]').forEach(i=>i.onchange=()=>{
    const idx=i.dataset.comp.lastIndexOf(':');
    const key=i.dataset.comp.slice(0,idx), f=i.dataset.comp.slice(idx+1);
    S.computations[key]=S.computations[key]||{}; S.computations[key][f]=i.value; save(); render();});
  document.querySelectorAll('[data-gotonote]').forEach(b=>b.onclick=()=>{
    const [id,nid]=b.dataset.gotonote.split(':');
    const n=S.notesList.find(x=>x.id===nid);
    activeTab=id; activeSub[id]='notes'; activeNote[id]=nid;
    if(n&&n.periodKey)activeYear[id]=n.periodKey;
    render();});
  document.querySelectorAll('[data-resolvenote]').forEach(b=>b.onclick=()=>{
    const n=S.notesList.find(x=>x.id===b.dataset.resolvenote); if(!n)return;
    n.resolved=!n.resolved;
    n.resolvedOn=n.resolved?S.asAt:undefined;
    save(); render();});
  document.querySelectorAll('[data-opennote]').forEach(b=>b.onclick=()=>{
    const [id,nid]=b.dataset.opennote.split(':'); activeNote[id]=nid; render();});
  document.querySelectorAll('[data-backnote]').forEach(b=>b.onclick=()=>{
    delete activeNote[b.dataset.backnote]; render();});
  document.querySelectorAll('[data-allnotes]').forEach(c=>c.onchange=()=>{
    showAllNotes[c.dataset.allnotes]=c.checked; render();});
  document.querySelectorAll('[data-newnote]').forEach(b=>b.onclick=()=>{
    const i=b.dataset.newnote.indexOf(':');
    const id=b.dataset.newnote.slice(0,i), pk=b.dataset.newnote.slice(i+1);
    const n={id:NEW_ID(),entityId:id,periodKey:pk,category:'correspondence',
      title:'',date:S.asAt,body:'',createdAt:new Date().toISOString()};
    S.notesList.push(n); activeNote[id]=n.id; save(); render();});
  document.querySelectorAll('[data-delnote]').forEach(b=>b.onclick=()=>{
    const n=S.notesList.find(x=>x.id===b.dataset.delnote);
    if(!confirm('Delete this note?'))return;
    S.notesList=S.notesList.filter(x=>x.id!==b.dataset.delnote);
    if(n)delete activeNote[n.entityId];
    save(); render();});
  document.querySelectorAll('[data-nf]').forEach(f=>f.onchange=()=>{
    const i=f.dataset.nf.indexOf(':');
    const nid=f.dataset.nf.slice(0,i), k=f.dataset.nf.slice(i+1);
    const n=S.notesList.find(x=>x.id===nid); if(!n)return;
    n[k]=f.value; n.updatedAt=new Date().toISOString();
    // Re-render only where the change alters the view around the field, so
    // typing in the body does not steal focus mid-sentence.
    save(); if(k==='category'||k==='responseDue'||k==='date')render();});
  el('btnToday').onclick=dateModal;
  el('btnExport').onclick=async()=>{
    const data=JSON.stringify(S,null,2);
    const filename='tax-portal-'+S.asAt+'.json';
    // Hosted on claude.ai a plain download link is inert — the viewer mediates
    // file saves through the downloads capability. Locally there is no such
    // capability, and the blob link is the only route. Try the first, fall back.
    let saved=false;
    try{
      const dl=await window.claude?.use?.('downloads');
      if(dl){ await dl.save({filename,data}); saved=true; }
    }catch(e){ /* declined or unavailable — fall through */ }
    if(!saved){
      const blob=new Blob([data],{type:'application/json'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob); a.download=filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    }
  };
  el('btnImport').onclick=()=>el('fileImport').click();
  el('fileImport').onchange=ev=>{
    const f=ev.target.files?.[0]; if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const next=JSON.parse(rd.result);
        if(!next||!Array.isArray(next.entities))throw new Error('Not a portal export.');
        if(!confirm(`Replace everything currently in the portal with this file?\n\n${next.entities.length} entities, ${(next.payments||[]).length} payments.\n\nThis cannot be undone — export first if you want a copy of what is here now.`))return;
        S=next;
        S.properties=S.properties||[]; S.people=S.people||{}; S.notes=S.notes||{};
        S.computations=S.computations||{}; S.filings=S.filings||{};
        S.payments=S.payments||[]; S.income=S.income||{}; S.notesList=S.notesList||[];
        S.returns=S.returns||[]; S.liabilities=S.liabilities||[];
        S.ivor=S.ivor||{tasks:{},manual:[]}; S.pay=S.pay||{}; S.propFigures=S.propFigures||{};
        migrateState();
        activeTab='overview'; save(); render();
      }catch(e){ alert('Could not read that file: '+e.message); }
    };
    rd.readAsText(f); ev.target.value='';
  };
}

(async function(){
  const loaded=await initDb();
  if(!loaded||!S.entities?.length){ if(!S.entities?.length)seed(); }
  if(!S.asAt)S.asAt=iso(new Date());
  S.properties=S.properties||[]; S.people=S.people||{}; S.notes=S.notes||{};
  S.computations=S.computations||{}; S.filings=S.filings||{}; S.payments=S.payments||[];
  S.income=S.income||{}; S.returns=S.returns||[]; S.liabilities=S.liabilities||[];
  S.ivor=S.ivor||{tasks:{},manual:[]}; S.pay=S.pay||{}; S.propFigures=S.propFigures||{};
  migrateState();
  render();
})();
</script>
