// One line per tax, per entity, in the order the process actually runs:
// what the last RETURN declared, what that made payable, what has been paid
// against it, and what is left. Outstanding is arithmetic. Where nothing has
// been filed there is no liability, and any engine figure shown is flagged as
// an estimate rather than presented as a debt.
function taxLine(e,label,taxType){
  const LR=latestReturn(e,taxType);
  const A=taxAccount(e,taxType);
  const f=LR.filed,n=LR.next;

  let ret;
  if(f&&!f.amountMissing)
    ret=`${esc(f.short)}<span class="sub2">filed ${f.filedOn?fmtD(parseD(f.filedOn)):'—'}${f.reference?' · '+esc(f.reference):''}</span>`;
  else if(f&&f.amountMissing)
    ret=`${esc(f.short)}<span class="sub2 crit">filed — declared amount not recorded</span>`;
  else ret=`<span class="mini">none filed</span>`;
  if(n)ret+=`<span class="sub2">next ${esc(n.short)} due ${fmtD(n.fileBy)}${n.fileBy<asAt()?' · <b class="crit">outstanding</b>':''}</span>`;

  // Declared: what returns have charged. Before any return, the estimate.
  let dec;
  if(A.charged||f)dec=`${money(A.charged)}<span class="sub2">${A.liabs.length} ${A.liabs.length===1?'charge':'charges'}</span>`;
  else{
    const est=n?estimateFor(e,n):null;
    dec=est!=null?`<span class="mini">est. ${money(est)}</span><span class="sub2">not declared — no return filed</span>`
      :`<span class="mini">—</span>`;
  }

  const paid=A.allocated?`${money(A.allocated)}${A.credit>0.005?`<span class="sub2">plus ${money(A.credit)} unallocated</span>`:''}`
    :(A.credit>0.005?`<span class="mini">—</span><span class="sub2">${money(A.credit)} on account</span>`
      :'<span class="mini">nothing recorded</span>');

  const outAmt=A.net;
  const out=Math.abs(outAmt)<0.005?'<span class="mini">nil</span>'
    :outAmt<0?`<span class="ok2">${money(-outAmt)} in credit</span>`
    :`<span class="${A.overdueAmt>0.005?'crit':''}"><b>${money(outAmt)}</b></span>${A.overdueAmt>0.005?`<span class="sub2 crit">${money(A.overdueAmt)} overdue</span>`:''}`;

  const t=A.target;
  const d=t?daysTo(t.dueDate):null;
  const next=t?`${fmtD(t.dueDate)}<span class="sub2">${esc(t.label)}</span>`
    :(n?`${fmtD(n.fileBy)}<span class="sub2">${esc(n.label)}</span>`:'<span class="mini">—</span>');
  const dd=t?d:(n?daysTo(n.fileBy):null);
  const status=dd==null?'<span class="mini">none scheduled</span>'
    :dd<0?`<span class="pill crit">${Math.abs(dd)}d overdue</span>`
    :dd<=14?`<span class="pill warn">due in ${dd}d</span>`
    :dd<=45?`<span class="pill info">${dd}d</span>`
    :`<span class="pill mute">${dd}d</span>`;

  return `<tr class="${dd!=null&&dd<0?'od':''}">
    <td class="tx">${esc(label)}</td>
    <td>${ret}</td><td class="num">${dec}</td><td class="num">${paid}</td>
    <td class="num">${out}</td><td>${next}</td><td>${status}</td></tr>`;
}

// Companies House filings charge nothing, so they keep a filing-only line
// rather than being forced into money columns they have no figures for.
function filingLine(e,label,taxType){
  const o=nextFiling(e.id,taxType);
  const d=o?daysTo(o.dueDate):null;
  const status=d==null?'<span class="mini">none scheduled</span>'
    :d<0?`<span class="pill crit">${Math.abs(d)}d overdue</span>`
    :d<=14?`<span class="pill warn">due in ${d}d</span>`
    :d<=45?`<span class="pill info">${d}d</span>`
    :`<span class="pill mute">${d}d</span>`;
  return `<tr class="${d!=null&&d<0?'od':''}">
    <td class="tx">${esc(label)}</td>
    <td colspan="4"><span class="mini">${o?esc(o.desc):'—'}</span></td>
    <td>${o?fmtD(o.dueDate):'<span class="mini">—</span>'}</td>
    <td>${status}</td></tr>`;
}

function entityRow(e){
  const rows=[];
  if(e.type==='company'){
    if(e.status!=='dormant'){
      rows.push(taxLine(e,'Corporation Tax','CT'));
      if(e.vat)rows.push(taxLine(e,'VAT','VAT'));
      if(e.payroll)rows.push(taxLine(e,'PAYE & NIC','PAYE'));
    }
    rows.push(filingLine(e,'Confirmation statement','CS'));
    rows.push(filingLine(e,'Annual accounts','ACCOUNTS'));
  } else {
    rows.push(taxLine(e,'Self Assessment','SA'));
  }
  const mine=allObligations().filter(o=>o.entityId===e.id&&o.status==='open'&&o.dueDate<asAt());
  // Returns whose filing date has passed but which have not been filed. This
  // is the first failure in the sequence, so it is called out on its own.
  const unfiled=(e.type==='company'
    ? (e.status==='dormant'?[]:['CT'].concat(e.vat?['VAT']:[],e.payroll?['PAYE']:[]))
    : ['SA'])
    .reduce((n,t)=>n+latestReturn(e,t).outstandingCount,0);
  return `<div class="ecard">
    <div class="ehead">
      <span class="en">${esc(e.name)}</span>
      ${e.type==='company'
        ? (e.status==='trading'?'<span class="pill ok">Trading</span>'
           :`<span class="pill mute">${esc(e.status)}</span>`)
        : '<span class="pill info">Individual</span>'}
      ${unfiled?`<span class="pill crit">${unfiled} return${unfiled===1?'':'s'} not filed</span>`:''}
      ${mine.length?`<span class="pill crit">${mine.length} overdue</span>`:''}
      <span class="sp"></span>
      <button class="btn sm" data-tab="${e.id}">Open</button>
    </div>
    <div class="tw scroll" style="border:none;border-radius:0">
      <table>
      <colgroup><col class="c-tax"><col class="c-ret"><col class="c-money"><col class="c-money">
        <col class="c-money"><col class="c-next"><col class="c-stat"></colgroup>
      <thead><tr><th>Tax</th><th>Latest return</th><th class="num">Charged${Q('ledger')}</th>
      <th class="num">Paid</th><th class="num">Outstanding</th><th>Next due</th><th>Status</th></tr></thead>
      <tbody>${rows.join('')}</tbody></table></div>
  </div>`;
}

// --- Overview --------------------------------------------------------------
function viewOverview(){
  const obs=allObligations().filter(o=>o.status==='open');
  const now=asAt();
  const in90=new Date(now.getTime()+90*D);
  const overdue=obs.filter(o=>o.dueDate<now);
  const nudges=buildNudges();

  // The position is read off the ledger, not off the calendar. "Outstanding"
  // means a return declared it (or statute charged it) and it has not been
  // paid — an estimate for a return you have not filed is not money you owe.
  let outstanding=0,overdueAmt=0,due90=0,credit=0,unfiled=0,noAmount=0;
  const TAXES=e=>e.type==='company'
    ? (e.status==='dormant'?[]:['CT'].concat(e.vat?['VAT']:[],e.payroll?['PAYE']:[]))
    : ['SA'];
  for(const e of S.entities)for(const t of TAXES(e)){
    const A=taxAccount(e,t);
    outstanding+=A.outstanding; overdueAmt+=A.overdueAmt; credit+=Math.max(0,A.credit);
    due90+=A.open.filter(l=>l.dueDate>=now&&l.dueDate<=in90)
      .reduce((s,l)=>s+outstandingOf(l),0);
    const LR=latestReturn(e,t);
    unfiled+=LR.outstandingCount;
    noAmount+=LR.all.filter(r=>r.amountMissing).length;
  }
  outstanding=r2(outstanding); overdueAmt=r2(overdueAmt); due90=r2(due90); credit=r2(credit);

  const openNotes=(S.notesList||[]).filter(n=>n.responseDue&&!n.resolved
    &&!(n.periodKey&&isYearClosed(n.entityId,n.periodKey))&&daysTo(parseD(n.responseDue))<=30).length;

  let h=`<h2>Position</h2>
  <div class="pillrow">
    <span class="spill"><b>${S.entities.length}</b><span>entities</span></span>
    <span class="spill ${unfiled?'crit':'ok'}"><b>${unfiled}</b><span>returns not filed${Q('lookback')}</span></span>
    <span class="spill ${outstanding>0.005?'warn':'ok'}"><b>${money(outstanding)}</b><span>outstanding${Q('ledger')}</span></span>
    ${overdueAmt>0.005?`<span class="spill crit"><b>${money(overdueAmt)}</b><span>overdue</span></span>`:''}
    <span class="spill"><b>${money(due90)}</b><span>payable in 90 days</span></span>
    ${credit>0.005?`<span class="spill"><b>${money(credit)}</b><span>unallocated on account${Q('allocation')}</span></span>`:''}
    ${openNotes?`<span class="spill"><b>${openNotes}</b><span>awaiting response</span></span>`:''}
  </div>
  <p class="mini" style="margin:0 0 14px">Outstanding is what a filed return declared, or what statute charged in advance, less payments allocated to it. An estimate against an unfiled return is not counted.</p>
  ${noAmount?`<div class="banner warn">${noAmount} return${noAmount===1?' was':'s were'} marked filed without a declared amount, so ${noAmount===1?'it charges':'they charge'} nothing. Open the entity and enter the figure the return declared.</div>`:''}

  <h2>Entities</h2>
  <div class="elist">${S.entities.map(e=>entityRow(e)).join('')}</div>`;

  h+=`<h2>Needs attention</h2>`;
  if(!S.payments.length&&!(S.returns||[]).length)
    h+=`<div class="banner">No return has been filed and no payment recorded, so everything already due in the last ${LOOKBACK_DAYS} days shows as outstanding. File a return against a period to declare its liability, then record the payment against that liability. Obligations older than ${LOOKBACK_DAYS} days are not generated — the portal cannot know whether they were dealt with before it existed.</div>`;
  h+=nudges.length?nudges.slice(0,10).map(n=>`
    <div class="nudge p${n.p}">
      <div class="nh"><span class="pill ${n.p===1?'crit':n.p===2?'warn':'info'}">${n.p===1?'Critical':n.p===2?'High':'Medium'}</span>
      <span class="tag">${esc(n.cat)}</span>
      ${n.entity?`<span class="mini"><strong>${esc(n.entity)}</strong></span>`:''}
      ${n.when?`<span class="when">${fmtD(n.when)}</span>`:''}</div>
      <h5>${esc(n.title)}</h5><p>${esc(n.body)}</p>
      ${n.noteId?`<div style="margin-top:9px;display:flex;gap:8px">
        <button class="btn sm" data-gotonote="${n.entityId}:${n.noteId}">Open note</button>
        <button class="btn sm" data-resolvenote="${n.noteId}">Mark answered</button></div>`:''}
    </div>`).join(''):`<div class="tw"><div class="empty">Nothing needs attention in the next 30 days.</div></div>`;

  const next90=obs.filter(o=>o.dueDate>=now&&o.dueDate<=in90);
  h+=`<h2>All obligations — next 90 days</h2><div class="tw scroll"><table>
    <thead><tr><th>Due</th><th>Entity</th><th>Tax</th><th>Obligation</th>
    <th class="num">Amount</th><th>Status</th></tr></thead><tbody>`;
  const rows=[...overdue,...next90].sort((a,b)=>a.dueDate-b.dueDate);
  h+=rows.length?rows.map(o=>{const amt=obAmount(o);
    return `<tr class="${o.dueDate<now?'od':''}">
      <td class="dt">${fmtD(o.dueDate)}</td><td><strong>${esc(o.entityName)}</strong></td>
      <td><span class="tag">${o.taxType}</span></td><td>${esc(o.desc)}</td>
      <td class="num">${amt?(amt.charged?money(amt.amount)
        :`<span class="mini">est. ${money(amt.amount)}</span>`):'<span class="mini">—</span>'}</td>
      <td>${statusPill(o)}</td></tr>`;}).join('')
    :`<tr><td colspan="6"><div class="empty">No obligations in this window.</div></td></tr>`;
  h+=`</tbody></table></div>`;

  // Association position — the structural fact that drives every CT number
  const cos=S.entities.filter(e=>e.type==='company');
  if(cos.length){
    const trading=cos.filter(c=>c.status==='trading');
    h+=`<h2>Associated company position</h2><div class="card">
      <p style="margin:0 0 10px">${trading.length} of ${cos.length} ${trading.length===1?'company is':'companies are'} carrying on a trade or business, so a trading company's Corporation Tax limits divide by <strong>${trading.length||1}</strong>.${Q('association',cos[0]?.id)}</p>
      <div class="tw scroll"><table><thead><tr><th>Company</th><th>Status</th>
      <th class="num">Lower limit</th><th class="num">Upper limit</th></tr></thead><tbody>
      ${cos.map(c=>{const dv=associationDivisor(c.id);
        const t=c.status==='trading';
        return `<tr><td><strong>${esc(c.name)}</strong></td>
        <td>${t?'<span class="pill ok">Trading</span>':'<span class="pill mute">'+esc(c.status)+'</span>'}</td>
        <td class="num">${t?money(CT_RATES.lower/dv):'<span class="mini">no CT charge</span>'}</td>
        <td class="num">${t?money(CT_RATES.upper/dv):'<span class="mini">—</span>'}</td></tr>`;}).join('')}
      </tbody></table></div>
      ${cos.filter(c=>c.status!=='trading').length&&trading.length?`<div class="banner warn">If <strong>${esc(cos.find(c=>c.status!=='trading').name)}</strong> starts trading, the limits above halve for the <strong>whole</strong> accounting period in which it starts, retrospectively — so where you control the start date, starting on the first day of a new period confines the effect to a period you have planned for.</div>`:''}
      <div class="work"><strong>CTA 2010 s.18E(3)</strong> disregards a company that has not carried on a trade or business at any time in the accounting period — the test is trade-or-business, not Companies Act dormancy. Bank interest alone is not a business (<em>Jowett v O'Neill &amp; Brennan</em>). Note s.18E(1): a company associated for <strong>any part</strong> of a period counts for the <strong>whole</strong> of it, with no apportionment (CTM03956).</div>
    </div>`;
  }
  return h;
}

// --- Company view ----------------------------------------------------------
// Same shape as the personal view, but the axis is the ACCOUNTING PERIOD:
// a tab per period, pale blue while open and pale green once you tick it
// closed. Closing is your call, never inferred from a filing date.
function viewCompany(e){
  const allPeriods=periodsFor(e);
  const hiddenP=allPeriods.filter(x=>isYearClosed(e.id,x.key));
  const periods=hidesClosed(e.id)&&hiddenP.length<allPeriods.length
    ? allPeriods.filter(x=>!isYearClosed(e.id,x.key)) : allPeriods;
  let pk=activeYear[e.id];
  let P=periods.find(x=>x.key===pk)||periods[periods.length-1];
  pk=P.key;
  const closed=isYearClosed(e.id,pk);
  const meta=S.yearClosed[ykey(e.id,pk)]||{};
  const sub=activeSub[e.id]||'summary';
  const ro=closed?'disabled':'';
  // Generate across the period plus the year after it, so the obligations that
  // arise FROM the period (CT payment, CT600, accounts) are included.
  const obs=obligationsIn(e,P.start,addMonths(P.end,15)).filter(o=>inPeriod(o,P));
  const arising=obligationsIn(e,P.start,addMonths(P.end,15))
    .filter(o=>o.periodEnd&&iso(o.periodEnd)===pk);
  const pays=S.payments.filter(x=>x.entityId===e.id&&x.periodEnd===pk);
  const paidBy=t=>pays.filter(x=>x.taxType===t).reduce((a,b)=>a+(+b.amount||0),0);

  // Charge for the period, by tax
  const comp=S.computations[e.id+'|'+pk];
  const ctCharge=comp&&comp.profit!==''&&comp.profit!=null
    ? computeCT({start:P.start,end:P.end,profit:+comp.profit||0,
        distributions:+comp.distributions||0,divisor:associationDivisor(e.id),
        cihc:!!e.cihc}).due : null;
  const vatObs=obs.filter(o=>o.taxType==='VAT');
  const payeObs=obs.filter(o=>o.taxType==='PAYE');
  const payeCharge=payeObs.reduce((a,o)=>a+(amountFor(o)||0),0);

  let h=`<div class="ent-head"><div>
    <h3>${esc(e.name)}</h3>
    <div class="ent-meta">
      ${e.companyNumber?`<span>Co. no. ${esc(e.companyNumber)}</span>`:''}
      ${e.utr?`<span>UTR ${esc(e.utr)}</span>`:''}
      <span>Year end ${e.yeDay} ${MONTHS[(+e.yeMonth||3)-1]}</span>
      ${e.vat?`<span>VAT ${e.vrn?esc(e.vrn):'registered'}</span>`:'<span>Not VAT registered</span>'}
      <span>${allPeriods.filter(x=>isYearClosed(e.id,x.key)).length} of ${allPeriods.length} periods closed</span>
    </div></div>
    <div class="acts">
      ${e.status==='trading'?'<span class="pill ok">Trading</span>':`<span class="pill mute">${esc(e.status)}</span>`}
      <button class="btn sm" data-edit="${e.id}">Edit</button>
    </div></div>`;

  h+=`<div class="years">`;
  for(const x of periods){
    const c=isYearClosed(e.id,x.key);
    h+=`<button class="ytab ${c?'closed':'open'} ${x.key===pk?'on':''}" data-year="${e.id}:${x.key}">
      ${esc(x.label)}<span class="yst">${c?'Closed':x.inProgress?'In progress':'Open'}</span></button>`;
  }
  if(allPeriods.length<15)h+=`<button class="btn sm" data-moreyears="1">+ Earlier period</button>`;
  h+=hideToggle(e.id,hidesClosed(e.id)?hiddenP.length:0,'period');
  h+=`<span class="ylegend"><span><i class="o"></i>Open</span><span><i class="c"></i>Closed</span></span></div>`;
  if(hidesClosed(e.id)&&hiddenP.length===allPeriods.length)
    h+=`<div class="banner">Every period shown is closed, so nothing would be left to display — the tabs stay visible. Untick <strong>Hide closed</strong> to keep them hidden once there is an open period again.</div>`;

  h+=`<div class="yearbar ${closed?'closed':'open'}">
    <label class="chk"><input type="checkbox" data-close="${e.id}:${pk}" ${closed?'checked':''}>
      Accounting period to ${fmtD(P.end)} is closed</label>${Q('closing',e.id,pk)}
    <span class="sp"></span>
    <span class="mini">${closed
      ? 'Marked closed'+(meta.closedOn?' on '+fmtD(parseD(meta.closedOn)):'')+' — figures are locked against accidental edits.'
      : fmtD(P.start)+' to '+fmtD(P.end)+(P.inProgress?' · in progress':' · CT payable '+fmtD(ctPaymentDue(P.end))+', CT600 due '+fmtD(ct600Due(P.end)))}</span>
  </div>`;

  h+=`<div class="subtabs">
      ${[['summary','Summary'],['ct','Corporation Tax'],['vat','VAT'],['ppl','PAYE & payroll'],
         ['obs','Obligations'],['pay','Returns &amp; payments'],['notes','Notes']]
        .map(([k,l])=>`<button class="subtab ${sub===k?'on':''}" data-sub="${e.id}:${k}">${l}</button>`).join('')}
    </div>`;

  // ---- Summary: the sequence for each tax within THIS period ----
  // Report, then charge, then pay. Each card shows where the tax has got to
  // in that sequence and what the arithmetic leaves outstanding.
  if(sub==='summary'){
    const card=(title,taxType)=>{
      const slots=periodSlots(e,taxType,P);
      const rs=slots.map(s=>returnFor(e,s));
      const filed=rs.filter(r=>r.status==='filed');
      const lateUnfiled=rs.filter(r=>r.status!=='filed'&&r.fileBy<asAt());
      const keys=slots.map(s=>s.periodKey);
      const liabs=liabilitiesFor(e,taxType).filter(l=>keys.includes(l.periodKey));
      const charged=r2(liabs.reduce((a,l)=>a+l.amount,0));
      const paid=r2(liabs.reduce((a,l)=>a+allocatedTo(l.id),0));
      const out=r2(charged-paid);
      const open=liabs.filter(l=>outstandingOf(l)>0.005).sort((a,b)=>a.dueDate-b.dueDate);
      const target=open[0]||null;
      const dl=target?daysTo(target.dueDate):null;
      const pill=closed?'<span class="pill ok">Closed</span>'
        :lateUnfiled.length?`<span class="pill crit">${lateUnfiled.length} not filed</span>`
        :dl==null?(filed.length?'<span class="pill ok">Settled</span>':'<span class="pill mute">—</span>')
        :dl<0?`<span class="pill crit">${Math.abs(dl)}d overdue</span>`
        :dl<=30?`<span class="pill warn">${dl}d</span>`:`<span class="pill ok">${dl}d</span>`;
      const est=rs.filter(r=>r.status!=='filed').reduce((a,r)=>{const v=estimateFor(e,r);return v!=null?a+v:a;},0);
      const topic={CT:'ct-rates',VAT:'vat-dates',PAYE:'paye-dates'}[taxType]||'ledger';
      return `<div class="card"><div class="ch"><h4>${title}${Q(topic,e.id,pk)}</h4>${pill}</div>
        <div class="chain">
          <i class="${filed.length===rs.length&&rs.length?'on':filed.length?'on':'todo'}">Reported ${filed.length}/${rs.length||0}</i>
          <s>&rarr;</s>
          <i class="${charged?'on':''}">Charged ${charged?money2(charged):'—'}</i>
          <s>&rarr;</s>
          <i class="${paid?'on':''}">Paid ${money2(paid)}</i>
        </div>
        <div class="leg">
          <div><div class="lab">Declared by return</div>
            <div class="amt">${charged?money2(charged):'—'}</div>
            <div class="sub">${charged?`${liabs.length} charge${liabs.length===1?'':'s'}`
              :est?`Nothing declared · engine estimate ${money(est)}`:'Nothing declared yet'}</div></div>
          <div><div class="lab">Outstanding</div>
            <div class="amt ${out>0.005?'crit':''}">${charged?money2(Math.max(0,out)):'—'}</div>
            <div class="sub">${!charged?'No return filed for this period'
              :out>0.005?`Next ${target?fmtD(target.dueDate):'—'}`
              :out<-0.005?money2(-out)+' overpaid':'<strong style="color:var(--ok)">Settled</strong>'}</div></div>
        </div>
        <div class="foot">
          <button class="btn sm" data-file="${e.id}:${taxType}:${slots.length?slots[slots.length-1].periodKey:''}" ${ro}>File a return</button>
          <button class="btn sm" data-addpay="${e.id}:${taxType}:" ${ro}>Record payment</button>
        </div></div>`;
    };
    h+=`<div class="cards">`;
    if(e.status!=='dormant'){
      h+=card('Corporation Tax','CT');
      if(e.vat)h+=card('VAT','VAT');
      if(e.payroll)h+=card('PAYE & NIC','PAYE');
    }
    const csOb=obs.find(o=>o.taxType==='CS'), accOb=arising.find(o=>o.taxType==='ACCOUNTS');
    h+=`<div class="card"><div class="ch"><h4>Companies House</h4>
      ${closed?'<span class="pill ok">Closed</span>':''}</div>
      <div class="leg">
        <div><div class="lab">Accounts due</div>
          <div class="amt" style="font-size:16px">${accOb?fmtD(accOb.dueDate):fmtD(addMonths(P.end,9))}</div>
          <div class="sub">${e.status==='dormant'?'Dormant accounts (AA02)':'Annual accounts'}</div></div>
        <div><div class="lab">Confirmation stmt</div>
          <div class="amt" style="font-size:16px">${csOb?fmtD(csOb.dueDate):'—'}</div>
          <div class="sub">Required regardless of dormancy</div></div>
      </div></div>`;
    h+=`</div>`;
    if(e.status==='dormant')
      h+=`<div class="banner">A dormant company still files a confirmation statement each year within 14 days of the review period, and dormant accounts (AA02) at 9 months. No CT600 is due unless HMRC has issued a notice. If it starts trading, notify HMRC within <strong>3 months of the start of the accounting period</strong> (FA 2004 s.55) — and the trading company's CT limits halve for that entire period.</div>`;
  }

  // ---- Corporation Tax for this period ----
  if(sub==='ct'){
    const c=S.computations[e.id+'|'+pk]||{profit:'',distributions:''};
    const dv=associationDivisor(e.id);
    h+=`<div class="card"><div class="ch"><h4>Accounting period to ${fmtD(P.end)}</h4>
      ${closed?'<span class="pill ok">Locked — period closed</span>':''}</div>
      <div class="row2">
        <div class="fg"><label>Taxable total profits (N)</label>
          <input type="number" data-comp="${e.id}|${pk}:profit" value="${esc(c.profit)}" placeholder="0" ${ro}></div>
        <div class="fg"><label>Distributions received</label>
          <input type="number" data-comp="${e.id}|${pk}:distributions" value="${esc(c.distributions)}" placeholder="0" ${ro}>
          <div class="hint">Non-group distributions. A = N + this.</div></div>
      </div>`;
    if(c.profit!==''&&c.profit!=null){
      const R=computeCT({start:P.start,end:P.end,profit:+c.profit||0,
        distributions:+c.distributions||0,divisor:dv,cihc:!!e.cihc});
      h+=`<div class="leg" style="margin-top:6px">
        <div><div class="lab">Tax due${Q('ct-rates',e.id,pk)}</div><div class="amt">${money2(R.due)}</div>
          <div class="sub">Effective rate ${(R.eff*100).toFixed(2)}% · ${R.rate==='spr'?'small profits rate':R.rate==='marginal'?'marginal relief':'main rate'}</div></div>
        <div><div class="lab">Payable by</div><div class="amt" style="font-size:16px">${fmtD(ctPaymentDue(P.end))}</div>
          <div class="sub">CT600 due ${fmtD(ct600Due(P.end))}</div></div></div>
        <div class="work"><ol>${R.W.map(w=>`<li>${esc(w)}</li>`).join('')}</ol></div>`;
    } else h+=`<div class="mini">Enter the taxable total profits to compute the charge and see the workings.</div>`;
    h+=`</div>`;
  }

  // ---- VAT quarters within the period ----
  if(sub==='vat'){
    if(!e.vat)h+=`<div class="tw"><div class="empty">${esc(e.name)} is not VAT registered. Turn it on under Edit to generate quarters.</div></div>`;
    else{
      h+=`<div class="tw scroll"><table><thead><tr><th>Quarter ended</th><th>Return due</th>
        <th>Status</th><th class="act"></th></tr></thead><tbody>`;
      h+=vatObs.length?vatObs.map(o=>`<tr class="${o.status==='open'&&o.dueDate<asAt()?'od':''}">
        <td class="dt">${o.periodEnd?fmtD(o.periodEnd):'—'}</td>
        <td class="dt">${fmtD(o.dueDate)}</td><td>${statusPill(o)}</td>
        <td class="act">${closed?'<span class="mini">period closed</span>'
          :obAction(o)}</td></tr>`).join('')
        :`<tr><td colspan="4"><div class="empty">No VAT quarters fall in this period.</div></td></tr>`;
      h+=`</tbody></table></div>
        <div class="banner">Xero has no UK VAT return endpoint, so box figures are entered or derived rather than pulled. The deadline is one calendar month and 7 days after the quarter end — always the 7th of the second month.</div>`;
    }
  }

  // ---- Payroll and Employment Allowance ----
  // Scoped to a TAX YEAR, not the accounting period. The secondary threshold
  // test and the Employment Allowance run 6 April to 5 April whatever the
  // company's year end, so a payroll figure that is not tied to a tax year
  // cannot be assessed against either.
  if(sub==='ppl'){
    const tys=taxYearsInPeriod(P);
    let pty=activePayYear[e.id];
    if(!pty||!tys.includes(pty))pty=dominantTaxYear(P);
    const ppl=peopleIn(e.id,pty);
    const recorded=anyPayRecorded(e.id,pty);
    const prevTy=TAX_YEARS[TAX_YEARS.indexOf(pty)-1];
    const canCopy=prevTy&&!recorded&&anyPayRecorded(e.id,prevTy);
    const ea=assessEA(ppl);

    h+=`<div class="years" style="margin-top:0">
      ${tys.map(t=>`<button class="ytab ${t===pty?'on':''} ${anyPayRecorded(e.id,t)?'closed':'open'}"
        data-payyear="${e.id}:${t}">${tyLabel(t)}<span class="yst">${anyPayRecorded(e.id,t)?'Recorded':'Empty'}</span></button>`).join('')}
      <span class="mini">The accounting period to ${fmtD(P.end)} spans ${tys.length===1?'one tax year':tys.length+' tax years'}. Payroll is held per tax year.</span>
    </div>`;
    if(S.migratedYear===pty&&recorded)
      h+=`<div class="banner warn">Payroll used to be held against the company with no year, so one figure applied to every year. What was already entered landed in <strong>${tyLabel(pty)}</strong> — a guess, because the old record carried no year. If it belongs to another year, move it:
        <span class="movebar"><select id="mvPay">${TAX_YEARS.filter(t=>t!==pty).map(t=>`<option value="${t}">${tyLabel(t)}</option>`).join('')}</select>
        <button class="btn sm" data-movepay="${e.id}:${pty}">Move</button></span></div>`;
    if(!recorded)
      h+=`<div class="banner">Nothing recorded for ${tyLabel(pty)}.${canCopy?` <button class="btn sm" data-copypay="${e.id}:${prevTy}:${pty}">Copy ${tyLabel(prevTy)} forward</button>`:''}</div>`;

    h+=`<div class="card"><div class="ch"><h4>Employment Allowance ${tyLabel(pty)}${Q('ea',e.id,pty)}</h4>
      ${!recorded?'<span class="pill mute">No payroll</span>'
        :ea.ok?'<span class="pill ok">Eligible</span>':'<span class="pill crit">Not eligible</span>'}</div>
      <div class="leg"><div><div class="lab">Allowance</div>
        <div class="amt ${ea.ok?'':'crit'}">${recorded?money(ea.ok?ea.amount:0):'—'}</div>
        <div class="sub">${recorded?`${ea.heads} paid above the ${money(NIC.st)} secondary threshold`:'Enter the year\'s payroll to assess it'}</div></div>
      <div><div class="lab">Employer NIC</div>
        <div class="amt">${recorded?money(ppl.reduce((a,x)=>a+annualNIC(+x.pay||0).er,0)):'—'}</div>
        <div class="sub">Before allowance, annual</div></div></div>
      ${recorded?`<div class="work">${esc(ea.why)}${ea.warn.map(w=>`<br><br><strong>Note.</strong> ${esc(w)}`).join('')}</div>`:''}</div>
      <div style="margin:14px 0"><button class="btn pri" data-addperson="${e.id}:${pty}" ${ro}>Add a person</button></div>
      <div class="tw scroll"><table><thead><tr><th>Name</th><th>Director</th>
      <th class="num">Pay ${tyLabel(pty)}</th><th class="num">Employee NIC</th><th class="num">Employer NIC</th>
      <th>Above ST</th><th class="act"></th></tr></thead><tbody>`;
    h+=ppl.length?ppl.map(x=>{const n=annualNIC(+x.pay||0);
      return `<tr><td><strong>${esc(x.name)}</strong></td><td>${x.director?'Yes':'No'}</td>
      <td class="num">${x.recorded?money(+x.pay||0):'<span class="mini">not entered</span>'}</td>
      <td class="num">${x.recorded?money2(n.ee):'—'}</td>
      <td class="num">${x.recorded?money2(n.er):'—'}</td>
      <td>${x.recorded&&+x.pay>NIC.st?'<span class="pill ok">Yes</span>':'<span class="pill mute">No</span>'}</td>
      <td class="act"><button class="btn sm" data-editperson="${e.id}:${x.id}:${pty}" ${ro}>Edit</button></td></tr>`;}).join('')
      :`<tr><td colspan="7"><div class="empty">No one on the payroll.</div></td></tr>`;
    h+=`</tbody></table></div>
      <div class="mini" style="margin-top:10px">A person is held across years; their pay is held per tax year. Removing a person removes them from every year — to record that they left, leave the later years empty.</div>`;
  }

  // ---- All obligations falling in this period ----
  if(sub==='obs'){
    const seen=new Set(), rows=[...obs,...arising]
      .filter(o=>{if(seen.has(o.key))return false;seen.add(o.key);return true;})
      .sort((a,b)=>a.dueDate-b.dueDate);
    h+=`<div class="tw scroll"><table><thead><tr><th>Due</th><th>Tax</th><th>Obligation</th>
      <th>Period</th><th class="num">Amount</th><th>Status</th><th class="act"></th></tr></thead><tbody>`;
    h+=rows.length?rows.map(o=>{const amt=obAmount(o);
      return `<tr class="${o.status==='open'&&o.dueDate<asAt()?'od':''}">
      <td class="dt">${fmtD(o.dueDate)}</td><td><span class="tag">${o.taxType}</span></td>
      <td>${esc(o.desc)}</td><td class="dt">${o.periodEnd?fmtD(o.periodEnd):'—'}</td>
      <td class="num">${amt?(amt.charged?money(amt.amount)
        :`<span class="mini">est. ${money(amt.amount)}</span>`):'<span class="mini">—</span>'}</td><td>${statusPill(o)}</td>
      <td class="act">${closed?'<span class="mini">period closed</span>'
        :obAction(o)}</td></tr>`;}).join('')
      :`<tr><td colspan="7"><div class="empty">No obligations fall in this accounting period.</div></td></tr>`;
    h+=`</tbody></table></div>`;
  }

  if(sub==='pay'){
    const tt=e.status==='dormant'?['CT']:['CT'].concat(e.vat?['VAT']:[],e.payroll?['PAYE']:[]);
    const keys=tt.flatMap(t=>periodSlots(e,t,P).map(s=>s.periodKey));
    h+=`<p class="mini" style="margin:0 0 12px">Scoped to the accounting period to ${fmtD(P.end)} — the CT600 for the period, and the VAT quarters and PAYE months ending inside it.</p>`;
    h+=accountView(e,tt,keys,closed,ro);
  }

  if(sub==='notes')h+=notesView(e,pk,'period to '+fmtD(P.end),closed);
  return h;
}

// --- Account view ----------------------------------------------------------
// The ledger for one entity, in the order the process runs: what was reported,
// what that charged, and what has been paid against it. Everything shown as
// outstanding here is the difference between two of those, so there is nowhere
// for a number to come from that a return did not declare.
function accountView(e,taxTypes,keys,closed,ro){
  const inScope=pk=>!keys||keys.includes(pk);
  let h='';

  // 1. Returns
  const rs=[];
  for(const t of taxTypes)for(const s of slotsFor(e,t))if(inScope(s.periodKey))rs.push(returnFor(e,s));
  rs.sort((a,b)=>a.fileBy-b.fileBy);
  h+=`<h4 class="lh">1 · Returns${Q('ledger',e.id)}</h4>
    <p class="mini" style="margin:0 0 9px">The return declares the liability. Nothing is charged until one is filed with a figure.</p>
    <div class="tw scroll"><table><thead><tr><th>Period</th><th>Return</th><th>File by</th>
    <th>Status</th><th class="num">Declared</th><th>Filed</th><th class="act"></th></tr></thead><tbody>`;
  h+=rs.length?rs.map(r=>{
    const late=r.status!=='filed'&&r.fileBy<asAt();
    const est=r.status!=='filed'?estimateFor(e,r):null;
    return `<tr class="${late?'od':''}">
      <td class="dt">${esc(r.short)}</td>
      <td><span class="tag">${r.taxType}</span></td>
      <td class="dt">${fmtD(r.fileBy)}</td>
      <td>${r.status==='filed'?'<span class="pill ok">Filed</span>'
        :late?`<span class="pill crit">${Math.abs(daysTo(r.fileBy))}d late</span>`
        :`<span class="pill ${r.status==='ready'?'warn':'mute'}">${RET_STATUS[r.status]}</span>`}</td>
      <td class="num">${r.declared!=null?money2(r.declared)
        :r.amountMissing?'<span class="mini crit">not recorded</span>'
        :est!=null?`<span class="mini">est. ${money(est)}</span>`:'<span class="mini">—</span>'}</td>
      <td class="dt">${r.filedOn?fmtD(parseD(r.filedOn)):'<span class="mini">—</span>'}${r.reference?`<span class="sub2">${esc(r.reference)}</span>`:''}</td>
      <td class="act"><button class="btn sm ${r.status==='filed'?'':'pri'}" data-file="${e.id}:${r.taxType}:${r.periodKey}" ${ro}>${r.status==='filed'?'Edit':'File'}</button></td></tr>`;
  }).join('')
    :`<tr><td colspan="7"><div class="empty">No return periods fall in this scope.</div></td></tr>`;
  h+=`</tbody></table></div>`;

  // 2. Liabilities
  const L=[];
  for(const t of taxTypes)for(const l of liabilitiesFor(e,t))if(inScope(l.periodKey))L.push(l);
  L.sort((a,b)=>a.dueDate-b.dueDate);
  const charged=r2(L.reduce((a,l)=>a+l.amount,0));
  const alloc=r2(L.reduce((a,l)=>a+allocatedTo(l.id),0));
  h+=`<h4 class="lh">2 · Liabilities${Q('estimate',e.id)}</h4>
    <p class="mini" style="margin:0 0 9px">Charged by a filed return, or by statute in advance of one. Interest, penalties and HMRC amendments are added by hand.</p>
    <div class="tw scroll"><table><thead><tr><th>Due</th><th>Charge</th><th>Period</th>
    <th class="num">Amount</th><th class="num">Paid</th><th class="num">Outstanding</th><th class="act"></th></tr></thead><tbody>`;
  h+=L.length?L.map(l=>{
    const p=allocatedTo(l.id), o=outstandingOf(l);
    const late=o>0.005&&l.dueDate<asAt();
    return `<tr class="${late?'od':''}">
      <td class="dt">${fmtD(l.dueDate)}</td>
      <td><span class="tag">${l.taxType}</span> ${esc(l.label)}
        ${l.detail?`<span class="sub2">${esc(l.detail)}</span>`:''}
        ${l.estimated?'<span class="sub2">estimated — reconciles when the return is filed</span>':''}</td>
      <td class="dt">${esc(shortPeriod(l.taxType,l.periodKey))}</td>
      <td class="num">${money2(l.amount)}</td>
      <td class="num">${money2(p)}</td>
      <td class="num ${late?'crit':''}"><b>${money2(o)}</b></td>
      <td class="act">${l.auto?'<span class="mini">from return</span>'
        :`<button class="btn sm danger" data-delliab="${l.id}" ${ro}>Remove</button>`}</td></tr>`;
  }).join('')
    :`<tr><td colspan="7"><div class="empty">Nothing charged. File a return to declare a liability.</div></td></tr>`;
  h+=`</tbody></table></div>
    <div class="totrow"><span>Charged ${money2(charged)}</span><span>Paid ${money2(alloc)}</span>
      <span class="${charged-alloc>0.005?'crit':''}"><b>Outstanding ${money2(r2(charged-alloc))}</b></span>
      <span class="sp"></span>
      <button class="btn sm" data-addliab="${e.id}:${taxTypes[0]}:${keys&&keys.length?keys[keys.length-1]:''}" ${ro}>Add interest or penalty</button></div>`;

  // 3. Payments
  const ps=S.payments.filter(p=>p.entityId===e.id&&taxTypes.includes(p.taxType))
    .sort((a,b)=>parseD(b.paidOn)-parseD(a.paidOn));
  const credit=taxTypes.reduce((a,t)=>a+creditOnAccount(e.id,t),0);
  h+=`<h4 class="lh">3 · Payments${Q('allocation',e.id)}</h4>
    <p class="mini" style="margin:0 0 9px">Each payment is allocated to a named liability. Anything unallocated sits as money on account — real, but not settling a debt.</p>
    <div class="tw scroll"><table><thead><tr><th>Paid</th><th>Tax</th><th class="num">Amount</th>
    <th>Allocated to</th><th class="num">Unallocated</th><th>Reference</th><th class="act"></th></tr></thead><tbody>`;
  h+=ps.length?ps.map(p=>{
    const A=payAllocs(p);
    const sum=r2(A.reduce((a,b)=>a+(+b.amount||0),0));
    const un=r2((+p.amount||0)-sum);
    return `<tr>
      <td class="dt">${fmtD(parseD(p.paidOn))}${p.direction==='from_hmrc'?'<span class="sub2">repayment received</span>':''}</td>
      <td><span class="tag">${p.taxType}</span></td>
      <td class="num">${money2(+p.amount)}</td>
      <td>${A.length?A.map(a=>{const l=liabilityById(a.liabilityId);
        return `<div class="alloc">${money2(+a.amount)} &rarr; ${l?esc(l.label)+' <span class="mini">'+fmtD(l.dueDate)+'</span>':'<span class="mini">a charge that no longer exists</span>'}</div>`;}).join('')
        :'<span class="mini">unallocated</span>'}</td>
      <td class="num ${un>0.005?'warn2':''}">${un>0.005?money2(un):'—'}</td>
      <td class="mini">${esc(p.ref||'')}</td>
      <td class="act"><button class="btn sm" data-alloc="${p.id}" ${ro}>Allocate</button>
        <button class="btn sm danger" data-delpay="${p.id}" ${ro}>Delete</button></td></tr>`;
  }).join('')
    :`<tr><td colspan="7"><div class="empty">No payments recorded.</div></td></tr>`;
  h+=`</tbody></table></div>
    <div class="totrow">${credit>0.005?`<span class="warn2">${money2(credit)} on account, not allocated</span>`
      :'<span class="mini">Every payment is allocated.</span>'}
      <span class="sp"></span>
      <button class="btn pri sm" data-addpay="${e.id}:${taxTypes[0]}:" ${ro}>Record a payment</button></div>`;
  return h;
}

function taxCard(e,t){
  const lp=lastPaid(e.id,t==='CS'?'CS':t);
  const np=t==='CS'?null:nextPayable(e.id,t);
  const nf=nextFiling(e.id,t==='CS'?'CS':t);
  const npAmt=np?amountFor(np):null;
  const d=np?daysTo(np.dueDate):(nf?daysTo(nf.dueDate):null);
  const pill=d==null?'<span class="pill mute">—</span>'
    :d<0?`<span class="pill crit">${Math.abs(d)}d overdue</span>`
    :d<=14?`<span class="pill warn">Due in ${d}d</span>`:`<span class="pill ok">${d}d</span>`;
  return `<div class="card"><div class="ch"><h4>${TAX_LABEL[t]}</h4>${pill}</div>
    <div class="leg">
      <div><div class="lab">Last paid</div>
        <div class="amt">${lp?money(+lp.amount):'—'}</div>
        <div class="sub">${lp?fmtD(parseD(lp.paidOn))+(lp.period?' · '+esc(lp.period):''):'Nothing recorded'}</div></div>
      <div><div class="lab">${np?'Next payable':'Next filing'}</div>
        <div class="amt ${d!=null&&d<0?'crit':''}">${np?(npAmt!=null?money(npAmt):'—'):(nf?fmtD(nf.dueDate):'—')}</div>
        <div class="sub">${np?fmtD(np.dueDate):(nf?esc(nf.desc):'None scheduled')}</div></div>
    </div>
    <div class="foot">
      <button class="btn sm" data-addpay="${e.id}:${t}">Record payment</button>
      ${nf?`<span class="mini">Next filing ${fmtD(nf.dueDate)}</span>`:''}
    </div></div>`;
}

// --- Personal view ---------------------------------------------------------
// Self Assessment is inherently per tax year, so the year is the primary axis:
// a tab per year, pale blue while open and pale green once YOU tick it closed.
// Closing is a deliberate operator action, never inferred from a date or a
// payment — the portal has no way of knowing you are finished with a year.
function viewPerson(e){
  const allYears=yearsFor();
  const cur=tyOfDate(asAt());
  // Hiding is a display filter only — the years still exist and still compute.
  const hidden=allYears.filter(y=>isYearClosed(e.id,y));
  const years=hidesClosed(e.id)&&hidden.length<allYears.length
    ? allYears.filter(y=>!isYearClosed(e.id,y)) : allYears;
  let ty=activeYear[e.id];
  if(!ty||!years.includes(ty))ty=years.includes(cur)?cur:years[years.length-1];
  const closed=isYearClosed(e.id,ty);
  const meta=S.yearClosed[ykey(e.id,ty)]||{};
  const sub=activeSub[e.id]||'summary';
  const inc=incomeFor(e.id,ty);
  const R=computeIT(inc,ty);
  const d8=saDates(ty);

  let h=`<div class="ent-head"><div><h3>${esc(e.name)}</h3>
    <div class="ent-meta"><span>Self Assessment</span>
    ${e.poa?'<span>Payments on account due</span>':'<span>No payments on account</span>'}
    <span>${allYears.filter(y=>isYearClosed(e.id,y)).length} of ${allYears.length} years closed</span></div></div>
    <div class="acts"><button class="btn sm" data-edit="${e.id}">Edit</button></div></div>`;

  // Year tabs
  h+=`<div class="years">`;
  for(const y of years){
    const c=isYearClosed(e.id,y);
    h+=`<button class="ytab ${c?'closed':'open'} ${y===ty?'on':''}" data-year="${e.id}:${y}">
      ${tyLabel(y)}<span class="yst">${c?'Closed':'Open'}</span></button>`;
  }
  const all=TAX_YEARS.filter(t=>tyStartYear(t)<=tyStartYear(cur));
  if(allYears.length<all.length)
    h+=`<button class="btn sm" data-moreyears="1">+ Earlier year</button>`;
  h+=hideToggle(e.id,hidesClosed(e.id)?hidden.length:0,'tax year');
  h+=`<span class="ylegend"><span><i class="o"></i>Open</span><span><i class="c"></i>Closed</span></span></div>`;
  if(hidesClosed(e.id)&&hidden.length===allYears.length)
    h+=`<div class="banner">Every year shown is closed, so nothing would be left to display — the tabs stay visible. Untick <strong>Hide closed</strong> to keep them hidden once there is an open year again.</div>`;

  // The close control — the operator's tick
  h+=`<div class="yearbar ${closed?'closed':'open'}">
    <label class="chk"><input type="checkbox" data-close="${e.id}:${ty}" ${closed?'checked':''}>
      Tax year ${tyLabel(ty)} is closed</label>
    <span class="sp"></span>
    <span class="mini">${closed
      ? 'Marked closed'+(meta.closedOn?' on '+fmtD(parseD(meta.closedOn)):'')+' — figures are locked against accidental edits.'
      : '6 April '+tyStartYear(ty)+' to 5 April '+(tyStartYear(ty)+1)+' · return due '+fmtD(d8.filing)}</span>
  </div>`;

  h+=`<div class="subtabs">
      ${[['summary','Summary'],['inc','Income'],['prop','Properties'],['obs','Obligations'],['pay','Returns &amp; payments'],['notes','Notes']]
        .map(([k,l])=>`<button class="subtab ${sub===k?'on':''}" data-sub="${e.id}:${k}">${l}</button>`).join('')}
    </div>`;

  const ro=closed?'disabled':'';

  if(sub==='summary'){
    // The engine computes what the return SHOULD declare. The ledger holds
    // what it did declare and what has been paid. Both are shown, and they are
    // never conflated: R.due is a computation, A.charged is a debt.
    const slot=slotAt(e,'SA',ty);
    const Rt=slot?returnFor(e,slot):null;
    const A=taxAccount(e,'SA',ty);
    const dLeft=daysTo(d8.filing);
    const filed=Rt&&Rt.status==='filed';
    // A variance is only meaningful against a computation that had inputs.
    // With no income entered the engine returns nil, which is not a disagreement.
    const hasInc=Object.values(inc||{}).some(v=>+v>0);
    const variance=filed&&Rt.declared!=null&&hasInc?r2(Rt.declared-R.due):null;
    h+=`<div class="cards">
      <div class="card"><div class="ch"><h4>${tyLabel(ty)} liability${Q('sa-dates',e.id,ty)}</h4>
        ${closed?'<span class="pill ok">Closed</span>'
          :filed?'<span class="pill ok">Return filed</span>'
          :dLeft<0?`<span class="pill crit">Return ${Math.abs(dLeft)}d overdue</span>`
          :`<span class="pill ${dLeft<=60?'warn':'info'}">Return in ${dLeft}d</span>`}</div>
        <div class="chain">
          <i class="${filed?'on':'todo'}">${filed?'Reported':'Not reported'}</i><s>&rarr;</s>
          <i class="${A.charged?'on':''}">Charged ${A.charged?money2(A.charged):'—'}</i><s>&rarr;</s>
          <i class="${A.allocated?'on':''}">Paid ${money2(A.allocated)}</i>
        </div>
        <div class="leg">
          <div><div class="lab">${filed?'Declared by the return':'Computed — not yet declared'}</div>
            <div class="amt">${filed&&Rt.declared!=null?money2(Rt.declared):money2(R.due)}</div>
            <div class="sub">${filed
              ? `Filed ${Rt.filedOn?fmtD(parseD(Rt.filedOn)):'—'}${variance!=null&&Math.abs(variance)>1?` · ${money2(Math.abs(variance))} ${variance>0?'above':'below'} the computed ${money2(R.due)}`:(hasInc?' · agrees with the computation':' · no income entered for this year, so there is nothing to compare')}`
              : `Engine figure on income of ${money(R.total)} · ANI ${money(R.ani)}`}</div></div>
          <div><div class="lab">Outstanding</div>
            <div class="amt ${A.outstanding>0.005?'crit':''}">${A.charged?money2(Math.max(0,A.outstanding)):'—'}</div>
            <div class="sub">${A.charged?`${money2(A.allocated)} paid against ${A.liabs.length} charge${A.liabs.length===1?'':'s'}`
              :'Nothing charged — no return filed and no payments on account'}</div></div></div>
        <div class="foot"><button class="btn sm ${filed?'':'pri'}" data-file="${e.id}:SA:${ty}" ${ro}>${filed?'Edit return':'File the return'}</button>
          <button class="btn sm" data-addpay="${e.id}:SA:" ${ro}>Record payment</button>
          <span class="mini">Return due ${fmtD(d8.filing)}</span></div></div>

      <div class="card"><div class="ch"><h4>Allowances</h4></div>
        <div class="leg">
          <div><div class="lab">Personal allowance${Q('pa-taper',e.id,ty)}</div>
            <div class="amt ${R.lost>0?'crit':''}">${money(R.pa)}</div>
            <div class="sub">${R.lost>0?money(R.lost)+' lost to the £100k taper — 60% band':'Full allowance'}</div></div>
          <div><div class="lab">Marginal rate${Q('pa-taper',e.id,ty)}</div>
            <div class="amt">${R.marginal!=null?R.marginal+'%':'—'}</div>
            <div class="sub">Dividend allowance ${money(itFor(ty).divAllow)} · CGT AEA ${money(itFor(ty).aea)}</div></div></div>
        <div class="foot"><span class="mini">${R.hicbc>0?'HICBC '+money(R.hicbc):'No HICBC'}</span></div></div>

      <div class="card"><div class="ch"><h4>Tax by source</h4></div>
        <div class="tw"><table><tbody>
          <tr><td>Non-savings</td><td class="num">${money2(R.byCat.nonSavings)}</td></tr>
          <tr><td>Property</td><td class="num">${money2(R.byCat.property)}</td></tr>
          <tr><td>Savings</td><td class="num">${money2(R.byCat.savings)}</td></tr>
          <tr><td>Dividends</td><td class="num">${money2(R.byCat.dividends)}</td></tr>
          ${R.reducer?`<tr><td>s.24 finance cost reducer</td><td class="num">−${money2(R.reducer)}</td></tr>`:''}
          ${R.hicbc?`<tr><td>HICBC</td><td class="num">${money2(R.hicbc)}</td></tr>`:''}
          <tr><td><strong>Total</strong></td><td class="num"><strong>${money2(R.due)}</strong></td></tr>
        </tbody></table></div></div>
    </div>`;
    if(R.W.length)h+=`<div class="work"><ol>${R.W.map(w=>`<li>${esc(w)}</li>`).join('')}</ol></div>`;
    h+=`<div class="mini" style="margin-top:10px">Computed on ${tyLabel(ty)} rates, not today's — dividend rates, the dividend allowance, the additional-rate threshold and the CGT annual exempt amount all differ by year.</div>`;
  }

  if(sub==='inc'){
    const F=[['employment','Employment'],['selfEmployment','Self-employment'],
      ['dividends','Dividends'],['property','Property (net of expenses)'],
      ['pension','Pension'],['savings','Savings interest'],
      ['financeCosts','Residential finance costs'],['pensionContribs','Gross pension contributions'],
      ['giftAid','Gift Aid (gross)'],['childBenefit','Child Benefit received']];
    h+=`<div class="card"><div class="ch"><h4>Income for ${tyLabel(ty)}</h4>
      ${closed?'<span class="pill ok">Locked — year closed</span>':''}</div><div class="row2">`;
    for(const [k,l] of F)
      h+=`<div class="fg"><label>${l}</label>
        <input type="number" data-inc="${e.id}|${ty}:${k}" value="${esc(inc[k]??'')}" placeholder="0" ${ro}>
        ${k==='financeCosts'?'<div class="hint">Relieved as a 20% tax reducer, not deducted (s.24).</div>':''}
        ${k==='pensionContribs'?'<div class="hint">Reduces adjusted net income, so it reverses the £100k taper.</div>':''}
        </div>`;
    h+=`</div></div>`;
    if(closed)h+=`<div class="banner">This year is marked closed, so the figures are read-only. Untick it on the bar above to edit.</div>`;
    if(R.W.length)h+=`<div class="work"><ol>${R.W.map(w=>`<li>${esc(w)}</li>`).join('')}</ol></div>`;
  }

  if(sub==='prop'){
    const props=propsOf(e.id);
    const recorded=anyPropRecorded(e.id,ty);
    const prevTy=TAX_YEARS[TAX_YEARS.indexOf(ty)-1];
    const canCopy=prevTy&&!recorded&&anyPropRecorded(e.id,prevTy);
    if(S.migratedYear===ty&&recorded)
      h+=`<div class="banner warn">Property figures used to be held against the property with no year, so one set applied to every year. What was already entered landed in <strong>${tyLabel(ty)}</strong> — a guess, because the old record carried no year. If it belongs to another year, move it:
        <span class="movebar"><select id="mvProp">${TAX_YEARS.filter(t=>t!==ty).map(t=>`<option value="${t}">${tyLabel(t)}</option>`).join('')}</select>
        <button class="btn sm" data-moveprop="${e.id}:${ty}">Move</button></span></div>`;
    if(props.length&&!recorded)
      h+=`<div class="banner">No figures recorded for ${tyLabel(ty)}.${canCopy?` <button class="btn sm" data-copyprop="${e.id}:${prevTy}:${ty}">Copy ${tyLabel(prevTy)} forward</button>`:''}</div>`;
    h+=`<div style="margin-bottom:14px"><button class="btn pri" data-addprop="${e.id}:${ty}" ${ro}>Add a property</button></div>
      <div class="tw scroll"><table><thead><tr><th>Property</th><th>Ownership</th>
      <th class="num">Rent ${tyLabel(ty)}</th><th class="num">Expenses</th><th class="num">Finance costs</th>
      <th class="num">Net</th><th class="act"></th></tr></thead><tbody>`;
    h+=props.length?props.map(p=>{const f=propFig(p.id,ty);
      const net=(+f.rent||0)-(+f.expenses||0);
      const any=f.rent!==''||f.expenses!==''||f.finance!=='';
      return `<tr><td><strong>${esc(p.name)}</strong>
      ${p.joint?'<br><span class="mini">Jointly held</span>':''}</td>
      <td>${p.share||100}%</td>
      <td class="num"><input type="number" class="cell" data-pf="${p.id}|${ty}|rent" value="${esc(f.rent)}" placeholder="—" ${ro}></td>
      <td class="num"><input type="number" class="cell" data-pf="${p.id}|${ty}|expenses" value="${esc(f.expenses)}" placeholder="—" ${ro}></td>
      <td class="num"><input type="number" class="cell" data-pf="${p.id}|${ty}|finance" value="${esc(f.finance)}" placeholder="—" ${ro}></td>
      <td class="num"><strong>${any?money(net):'<span class="mini">—</span>'}</strong></td>
      <td class="act"><button class="btn sm danger" data-delprop="${p.id}" ${ro}>Delete</button></td></tr>`;}).join('')
      :`<tr><td colspan="7"><div class="empty">No properties recorded.</div></td></tr>`;
    h+=`</tbody></table></div>`;
    if(props.some(p=>p.joint))h+=`<div class="banner warn">${Q('form17',e.id,ty)} Jointly held property between spouses is taxed <strong>50/50 regardless of actual beneficial ownership</strong> (ITA 2007 s.836) unless a Form 17 declaration is in force. Form 17 requires genuinely unequal beneficial interests, must state the true position, and <strong>must reach HMRC within 60 days of its date — there is no power to extend</strong> (TSEM9862).</div>`;
    h+=`<div class="banner">The property is held across years; its figures are per tax year, and the totals still have to be entered as property income on the Income tab. The furnished holiday lettings regime was abolished from 6 April 2025, so former FHLs fold into the ordinary property business.</div>`;
  }

  if(sub==='obs'){
    // Driven by the ledger, in sequence: the return for the year, then every
    // liability the year carries — payments on account charged from last
    // year's declared figure, then the balance once this year's return is in.
    const slot=slotAt(e,'SA',ty);
    const r=slot?returnFor(e,slot):null;
    const L=liabilitiesFor(e,'SA',ty).sort((a,b)=>a.dueDate-b.dueDate);
    const rowFor=(due,label,note,amt,st,act)=>{
      const dl=daysTo(due);
      const pill=st==='done'?'<span class="pill ok">Filed</span>'
        :st==='paid'?'<span class="pill ok">Paid</span>'
        :dl<0?`<span class="pill crit">${Math.abs(dl)}d overdue</span>`
        :dl<=30?`<span class="pill warn">${dl}d</span>`:`<span class="pill mute">${dl}d</span>`;
      return `<tr class="${st==='open'&&due<asAt()?'od':''}">
        <td class="dt">${fmtD(due)}</td>
        <td>${esc(label)}${/payment on account/i.test(label)?Q('poa',e.id,ty):/[Bb]alancing/.test(label)?Q('poa',e.id,ty):''}<br><span class="mini">${esc(note)}</span></td>
        <td class="num">${amt!=null?money2(amt):'<span class="mini">—</span>'}</td>
        <td>${pill}</td><td class="act">${closed?'<span class="mini">year closed</span>':act}</td></tr>`;
    };
    const rows=[];
    if(r){
      const est=r.status!=='filed'?estimateFor(e,r):null;
      rows.push({due:r.fileBy,html:rowFor(r.fileBy,`Self Assessment return ${tyLabel(ty)}`,
        r.status==='filed'?`Filed ${r.filedOn?fmtD(parseD(r.filedOn)):'—'}${r.reference?' · '+r.reference:''}`
          :est!=null?`Not filed — engine estimate ${money(est)}, which declares nothing`
          :'Not filed. 31 January following the end of the tax year.',
        r.declared,r.status==='filed'?'done':'open',
        `<button class="btn sm ${r.status==='filed'?'':'pri'}" data-file="${e.id}:SA:${ty}" ${ro}>${r.status==='filed'?'Return':'File return'}</button>`)});
    }
    for(const l of L){
      const o=outstandingOf(l);
      rows.push({due:l.dueDate,html:rowFor(l.dueDate,l.label,
        (l.detail||'')+(allocatedTo(l.id)?` · ${money2(allocatedTo(l.id))} paid`:''),
        l.amount,o<=0.005?'paid':'open',
        `<button class="btn sm ${o>0.005?'pri':''}" data-addpay="${e.id}:SA:" ${ro}>${o>0.005?'Pay '+money(o):'Paid'}</button>`)});
    }
    rows.sort((a,b)=>a.due-b.due);
    h+=`<div class="tw scroll"><table><thead><tr><th>Due</th><th>Obligation</th>
      <th class="num">Amount</th><th>Status</th><th class="act"></th></tr></thead><tbody>`;
    h+=rows.length?rows.map(x=>x.html).join('')
      :`<tr><td colspan="5"><div class="empty">Nothing charged for ${tyLabel(ty)}.</div></td></tr>`;
    h+=`</tbody></table></div>`;
    if(!L.length)h+=`<div class="banner">No liability is charged for ${tyLabel(ty)}. ${e.poa
      ? `Payments on account are charged from the previous year's <strong>declared</strong> figure, so they will appear once ${tyLabel(TAX_YEARS[Math.max(0,TAX_YEARS.indexOf(ty)-1)])} is filed.`
      : 'File the return to declare the year\'s liability.'}</div>`;
  }

  if(sub==='pay'){
    h+=`<p class="mini" style="margin:0 0 12px">Scoped to ${tyLabel(ty)}. Payments on account for a year are charged from the preceding year's declared liability, so they appear before this year's return does.</p>`;
    h+=accountView(e,['SA'],[ty],closed,ro);
  }

  if(sub==='notes')h+=notesView(e,ty,tyLabel(ty),closed);
  return h;
}

// ===========================================================================
// NOTES
// ===========================================================================
// Notes are records, not a scratch textarea: a category, a date, a title and a
// body, listed by category and opened into their own detail view. Correspondence
// carries who it was with and any response deadline, because that is the field
// that turns a letter into an obligation.
const NOTE_CATS=[
  ['correspondence','Correspondence','HMRC letters, calls and emails, and what they require'],
  ['workings','Workings','How a figure was arrived at, and the basis for it'],
  ['planning','Planning','Decisions taken, options considered, and what to revisit']
];
const catLabel=c=>(NOTE_CATS.find(x=>x[0]===c)||[,'Other'])[1];

function notesFor(entityId,periodKey,all){
  return S.notesList
    .filter(n=>n.entityId===entityId&&(all||!periodKey||n.periodKey===periodKey))
    .sort((a,b)=>(b.date||'').localeCompare(a.date||''));
}

function notesView(e,periodKey,periodLabel,closed){
  const ro=closed?'disabled':'';
  const openId=activeNote[e.id];
  const note=openId?S.notesList.find(n=>n.id===openId):null;

  // ---- Detail view ----
  if(note){
    const isCorr=note.category==='correspondence';
    const due=note.responseDue?parseD(note.responseDue):null;
    const dl=due?daysTo(due):null;
    return `<div style="display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
        <button class="btn" data-backnote="${e.id}">← All notes</button>
        <span class="tag">${esc(catLabel(note.category))}</span>
        ${note.periodKey?`<span class="mini">${esc(periodLabel)}</span>`:''}
        ${due&&!note.resolved?`<span class="pill ${dl<0?'crit':dl<=14?'warn':'info'}">
          ${dl<0?Math.abs(dl)+'d overdue':'Response due in '+dl+'d'}</span>`:''}
        ${note.resolved?'<span class="pill ok">Answered</span>':''}
        <span style="flex:1"></span>
        ${closed?'<span class="mini">period closed — read only</span>'
          :`${note.responseDue?`<button class="btn sm" data-resolvenote="${note.id}">${note.resolved?'Reopen':'Mark answered'}</button>`:''}
            <button class="btn sm danger" data-delnote="${note.id}">Delete note</button>`}
      </div>
      <div class="card">
        <div class="row2">
          <div class="fg"><label>Title</label>
            <input data-nf="${note.id}:title" value="${esc(note.title||'')}" ${ro}></div>
          <div class="fg"><label>Category</label>
            <select data-nf="${note.id}:category" ${ro}>
              ${NOTE_CATS.map(([v,l])=>`<option value="${v}" ${note.category===v?'selected':''}>${l}</option>`).join('')}
            </select></div>
        </div>
        <div class="row3">
          <div class="fg"><label>Date</label>
            <input type="date" data-nf="${note.id}:date" value="${esc(note.date||'')}" ${ro}></div>
          ${isCorr?`<div class="fg"><label>With</label>
            <input data-nf="${note.id}:counterparty" value="${esc(note.counterparty||'')}"
              placeholder="HMRC, Companies House…" ${ro}></div>
          <div class="fg"><label>Response due</label>
            <input type="date" data-nf="${note.id}:responseDue" value="${esc(note.responseDue||'')}" ${ro}>
            <div class="hint">A letter with a deadline is an obligation.</div></div>`
          :`<div class="fg"><label>Review on</label>
            <input type="date" data-nf="${note.id}:responseDue" value="${esc(note.responseDue||'')}" ${ro}></div>
           <div class="fg"><label>Reference</label>
            <input data-nf="${note.id}:ref" value="${esc(note.ref||'')}" placeholder="Document or file reference" ${ro}></div>`}
        </div>
        <div class="fg"><label>Detail</label>
          <textarea rows="16" data-nf="${note.id}:body" ${ro}
            placeholder="${isCorr?'What was said, what it requires, and what you did about it…'
              :note.category==='workings'?'The computation, its inputs, and the authority relied on…'
              :'The decision, the options weighed, and what would change it…'}">${esc(note.body||'')}</textarea></div>
        <div class="mini">Saved automatically. Created ${note.createdAt?fmtD(new Date(note.createdAt)):'—'}.</div>
      </div>`;
  }

  // ---- List view, grouped by category ----
  const all=!!showAllNotes[e.id];
  const list=notesFor(e.id,periodKey,all);
  const otherCount=notesFor(e.id,periodKey,true).length-notesFor(e.id,periodKey,false).length;
  let h=`<div style="display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
      <button class="btn pri" data-newnote="${e.id}:${periodKey}" ${ro}>New note</button>
      ${otherCount>0?`<label class="chk hidetog"><input type="checkbox" data-allnotes="${e.id}" ${all?'checked':''}>
        Show all periods</label><span class="mini">${otherCount} in other periods</span>`:''}
      <span style="flex:1"></span>
      <span class="mini">${list.length} note${list.length===1?'':'s'}${all?' across all periods':' in '+esc(periodLabel)}</span>
    </div>`;

  for(const [cat,label,blurb] of NOTE_CATS){
    const rows=list.filter(n=>n.category===cat);
    h+=`<h2 style="margin-top:22px">${label} <span style="text-transform:none;letter-spacing:0;font-weight:500">· ${rows.length}</span></h2>`;
    if(!rows.length){
      h+=`<div class="tw"><div class="empty">No ${label.toLowerCase()} notes${all?'':' in '+esc(periodLabel)}. ${esc(blurb)}.</div></div>`;
      continue;
    }
    h+=`<div class="tw scroll"><table><thead><tr><th>Date</th><th>Title</th>
      ${cat==='correspondence'?'<th>With</th>':''}
      ${all?'<th>Period</th>':''}<th>Follow-up</th><th class="act"></th></tr></thead><tbody>`;
    h+=rows.map(n=>{
      const due=n.responseDue?parseD(n.responseDue):null;
      const dl=due?daysTo(due):null;
      const snippet=(n.body||'').replace(/\s+/g,' ').slice(0,90);
      return `<tr class="${due&&dl<0&&!n.resolved?'od':''}">
        <td class="dt">${n.date?fmtD(parseD(n.date)):'—'}</td>
        <td><strong>${esc(n.title||'Untitled')}</strong>
          ${snippet?`<br><span class="mini">${esc(snippet)}${(n.body||'').length>90?'…':''}</span>`:''}</td>
        ${cat==='correspondence'?`<td>${esc(n.counterparty||'—')}</td>`:''}
        ${all?`<td class="dt">${esc(n.periodKey||'—')}</td>`:''}
        <td>${n.resolved?'<span class="pill ok">Answered</span>'
          :due?(dl<0?`<span class="pill crit">${Math.abs(dl)}d overdue</span>`
          :dl<=14?`<span class="pill warn">${dl}d</span>`:`<span class="mini">${fmtD(due)}</span>`):'<span class="mini">—</span>'}</td>
        <td class="act"><button class="btn sm" data-opennote="${e.id}:${n.id}">Open</button></td></tr>`;
    }).join('');
    h+=`</tbody></table></div>`;
  }
  return h;
}

// ===========================================================================
// MODALS
// ===========================================================================
// ===========================================================================
// IVOR — the panel
// ===========================================================================

let IV={open:false,tab:'ask',busy:false,sample:undefined,log:[]};

// A question handle. Dropped next to any figure that has an explanation, so
// "what does this mean?" is a click on the thing itself rather than a question
// you have to compose.
const Q=(topic,entityId,periodKey)=>
  `<button class="iv-q" data-q="${topic}|${entityId||''}|${periodKey||''}" title="What does this mean?">?</button>`;

function ivorInit(){
  if(document.getElementById('ivor'))return;
  const d=document.createElement('div');
  d.id='ivor'; d.className='iv';
  d.innerHTML=`
    <div class="iv-head">
      <strong>Ivor</strong>
      <span class="iv-sub">process and technical · build ${BUILD}</span>
      <span class="sp"></span>
      <button class="btn sm" id="ivClose">Close</button>
    </div>
    <div class="iv-tabs">
      <button class="iv-tab on" data-ivtab="ask">Ask</button>
      <button class="iv-tab" data-ivtab="todo">To-do <span class="iv-badge" id="ivCount"></span></button>
    </div>
    <div class="iv-body" id="ivBody"></div>
    <div class="iv-foot" id="ivFoot">
      <textarea id="ivInput" rows="1" placeholder="Ask about the portal, a figure on screen, or the tax"></textarea>
      <button class="btn pri sm" id="ivSend">Ask</button>
    </div>`;
  document.body.appendChild(d);
  document.getElementById('ivClose').onclick=()=>ivorToggle(false);
  d.querySelectorAll('[data-ivtab]').forEach(b=>b.onclick=()=>{
    IV.tab=b.dataset.ivtab;
    d.querySelectorAll('[data-ivtab]').forEach(x=>x.classList.toggle('on',x===b));
    ivorRender();
  });
  const inp=document.getElementById('ivInput');
  inp.onkeydown=ev=>{if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();ivorSubmit();}};
  document.getElementById('ivSend').onclick=ivorSubmit;
  // Resolve the model capability once. Absent is a normal state, not an error:
  // everything Ivor says is composed from the ledger and the authority table,
  // and the model only rephrases.
  (async()=>{ try{IV.sample=await window.claude?.use?.('sample')||null;}catch(e){IV.sample=null;}
    if(IV.open)ivorRender(); })();
  if(!IV.log.length)IV.log.push({role:'ivor',html:ivorWelcome()});
}

function ivorWelcome(){
  const ctx=ivorContext();
  let unf=0,od=0;
  for(const e of ctx.entities)for(const t of e.taxes){unf+=t.returnsNotFiled;od+=t.overdue;}
  return `<p>I hold the portal's own ledger and a dated authority table. Every figure and citation I give comes from one of those two — I do not compute rates from memory, and where a position is a judgement I will set out both sides rather than pick one.</p>
  <p>${unf||od>0.005
    ? `Right now: ${unf?`${unf} return${unf===1?'':'s'} past the filing date and not filed`:''}${unf&&od>0.005?', and ':''}${od>0.005?`${money2(od)} overdue`:''}.`
    : 'Nothing is overdue and every return inside the lookback is filed.'}</p>
  <div class="iv-sugg">${['What do I owe?','What is marginal relief?',
    'Why is the second company not associated?','How do payments on account work?',
    'What does the Employment Allowance need?','How does the portal decide what is outstanding?']
    .map(s=>`<button class="iv-s" data-ivask="${esc(s)}">${esc(s)}</button>`).join('')}</div>`;
}

function ivorToggle(on){
  IV.open=on===undefined?!IV.open:on;
  ivorInit();
  document.getElementById('ivor').classList.toggle('on',IV.open);
  document.body.classList.toggle('iv-open',IV.open);
  if(IV.open)ivorRender();
}

// --- Rendering -------------------------------------------------------------
function ivorRender(){
  const b=document.getElementById('ivBody'); if(!b)return;
  document.getElementById('ivFoot').style.display=IV.tab==='ask'?'':'none';
  if(IV.tab==='ask'){
    b.innerHTML=IV.log.map((m,i)=>m.role==='you'
      ? `<div class="iv-you">${esc(m.text)}</div>`
      : `<div class="iv-msg">${m.html}${m.flags?.length
          ? `<div class="iv-flag"><strong>Not in the grounding facts:</strong> ${m.flags.map(f=>`<code>${esc(f)}</code>`).join(', ')}. I did not take these from the ledger or the authority table — check them before relying on them.</div>`:''}</div>`
    ).join('');
    b.scrollTop=b.scrollHeight;
  } else {
    b.innerHTML=ivorTodo();
    b.querySelectorAll('[data-ivtask]').forEach(x=>x.onclick=()=>{
      const [key,act]=x.dataset.ivtask.split('~~');
      S.ivor.tasks=S.ivor.tasks||{};
      if(act==='open')delete S.ivor.tasks[key];
      else if(act==='snooze')S.ivor.tasks[key]={state:'snoozed',until:iso(new Date(asAt().getTime()+14*D))};
      else S.ivor.tasks[key]={state:act,at:S.asAt};
      save(); ivorRender(); ivorCount();
    });
    b.querySelectorAll('[data-ivgo]').forEach(x=>x.onclick=()=>{
      activeTab=x.dataset.ivgo; render(); ivorToggle(false);});
    const add=b.querySelector('#ivAdd');
    if(add)add.onclick=()=>{
      const t=b.querySelector('#ivNew').value.trim(); if(!t)return;
      S.ivor.manual=S.ivor.manual||[];
      S.ivor.manual.push({id:NEW_ID(),title:t,due:b.querySelector('#ivDue').value||'',done:false});
      save(); ivorRender(); ivorCount();
    };
    b.querySelectorAll('[data-ivman]').forEach(x=>x.onclick=()=>{
      const [id,act]=x.dataset.ivman.split('~~');
      if(act==='del')S.ivor.manual=(S.ivor.manual||[]).filter(m=>m.id!==id);
      else{const m=(S.ivor.manual||[]).find(m=>m.id===id); if(m)m.done=!m.done;}
      save(); ivorRender(); ivorCount();
    });
  }
  document.querySelectorAll('[data-ivask]').forEach(x=>x.onclick=()=>{
    document.getElementById('ivInput').value=x.dataset.ivask; ivorSubmit();});
}

// --- The to-do list --------------------------------------------------------
// Nudges are re-evaluated every render, so the state has to live on a stable
// key rather than on the nudge object. Re-evaluation updates a task; it never
// duplicates one, and a nudge you have dealt with stays dealt with.
const nudgeKey=n=>`${n.cat}|${n.entity||''}|${(n.title||'').slice(0,60)}`;

function ivorTodo(){
  S.ivor.tasks=S.ivor.tasks||{};
  const now=asAt();
  const all=buildNudges().map(n=>({...n,key:nudgeKey(n)}));
  const live=[],done=[];
  for(const n of all){
    const st=S.ivor.tasks[n.key];
    if(!st){live.push(n);continue;}
    if(st.state==='snoozed'&&st.until&&parseD(st.until)<=now){live.push({...n,wasSnoozed:true});continue;}
    done.push({...n,st});
  }
  const man=(S.ivor.manual||[]);
  let h=`<div class="iv-tsec">From the ledger — ${live.length} open</div>`;
  h+=live.length?live.map(n=>{
    const e=S.entities.find(x=>x.name===n.entity);
    return `<div class="iv-task p${n.p}">
      <div class="iv-tt">
        <span class="pill ${n.p===1?'crit':n.p===2?'warn':'info'}">${n.p===1?'Critical':n.p===2?'High':'Medium'}</span>
        <span class="tag">${esc(n.cat)}</span>
        ${n.entity?`<span class="mini"><strong>${esc(n.entity)}</strong></span>`:''}
        ${n.when?`<span class="mini">${fmtD(n.when)}</span>`:''}
        ${n.wasSnoozed?'<span class="mini">snooze expired</span>':''}</div>
      <div class="iv-th">${esc(n.title)}</div>
      <div class="iv-tb">${esc(n.body)}</div>
      <div class="iv-ta">
        <button class="btn sm" data-ivtask="${esc(n.key)}~~done">Done</button>
        <button class="btn sm" data-ivtask="${esc(n.key)}~~snooze">Snooze 14d</button>
        <button class="btn sm" data-ivtask="${esc(n.key)}~~dismissed">Not applicable</button>
        ${e?`<button class="btn sm" data-ivgo="${e.id}">Open ${esc(e.name)}</button>`:''}
      </div></div>`;}).join('')
    :`<div class="empty">Nothing outstanding in the next 30 days.</div>`;

  h+=`<div class="iv-tsec">Mine</div>
    <div class="iv-add"><input id="ivNew" placeholder="Add a task"><input type="date" id="ivDue">
      <button class="btn sm pri" id="ivAdd">Add</button></div>`;
  h+=man.length?man.map(m=>`<div class="iv-task ${m.done?'is-done':''}">
    <div class="iv-th">${m.done?'<s>'+esc(m.title)+'</s>':esc(m.title)}</div>
    ${m.due?`<div class="iv-tb">Due ${fmtD(parseD(m.due))}</div>`:''}
    <div class="iv-ta"><button class="btn sm" data-ivman="${m.id}~~toggle">${m.done?'Reopen':'Done'}</button>
      <button class="btn sm danger" data-ivman="${m.id}~~del">Remove</button></div></div>`).join(''):'';

  if(done.length)h+=`<div class="iv-tsec">Cleared — ${done.length}</div>`+

function ivorCount(){

// --- Asking ----------------------------------------------------------------
function ivorSubmit(){
  const inp=document.getElementById('ivInput');
  const q=inp.value.trim(); if(!q||IV.busy)return;
  inp.value=''; ivorAsk(q);
}

async function ivorAsk(q,seed){
  IV.tab='ask';
  document.querySelectorAll('[data-ivtab]').forEach(x=>x.classList.toggle('on',x.dataset.ivtab==='ask'));
  IV.log.push({role:'you',text:q});
  ivorRender();

  // 1. Questions the ledger answers itself never go near a model.
  const st=ivorStateAnswer(q);
  if(st&&!seed){ IV.log.push({role:'ivor',html:st.html}); ivorRender(); return; }

  // 2. The glossary first. "What does LEL mean?" is a different question from
  // "how does PAYE work?", and it is answered from the term index or not at all.
  const gl=seed?[]:glossaryHits(q);
  const defQ=isDefinitional(q);
  let html='';
  // The glossary leads only when the question asks what something MEANS.
  // "How do payments on account work?" is a question about the mechanism, and
  // answering it with the one-line definition of "on account" is a worse answer
  // than the topic — so there the term goes underneath, if at all.
  const glLeads=defQ&&gl.length;
  if(glLeads)html+=glossaryHtml(gl,q);

  // 3. Then the authority table.
  const hits=seed?[{k:kbById(seed.topic),s:99}].filter(x=>x.k):ivorMatch(q);
  const topics=hits.map(h=>h.k);
  const strong=hits.length&&hits[0].s>=4;

  // A definitional question that found no term and no strong topic has not been
  // understood. Saying so beats answering with whatever shared a word with it.
  if(defQ&&!gl.length&&(!hits.length||hits[0].s<7)){
    IV.log.push({role:'ivor',html:`<p>I do not hold that term. I will not answer it from the nearest topic that happens to share a word — that is how a question about the NIC thresholds gets answered with the PAYE payment dates.</p>
      <p>The glossary covers:</p>
      <div class="iv-sugg">${GLOSSARY.map(g=>`<button class="iv-s" data-ivask="What does ${esc(g.t)} mean?">${esc(g.t)}</button>`).join('')}</div>`});
    ivorRender(); return;
  }

  if(topics.length){
    const live=seed?ivorLive(seed.topic,seed.entityId,seed.periodKey):'';
    // With a glossary answer above it, the topic is supporting detail.
    html+=ivorTopicHtml(topics[0],live);
    if(!glLeads&&gl.length&&!topics.some(k=>gl.some(g=>g.see===k.id)))html+=glossaryHtml(gl,q);
    if(strong&&topics.length>1)
      html+=`<div class="iv-also">Related: ${topics.slice(1).map(k=>
        `<button class="iv-s" data-ivask="${esc(k.t)}">${esc(k.t)}</button>`).join('')}</div>`;
  }

  const ctx=ivorContext();
  const facts=ivorFacts(topics,ctx,gl);

  if(!topics.length&&!gl.length&&!IV.sample){
    IV.log.push({role:'ivor',html:`<p>I do not hold anything on that, and no model is available in this view to reason about it.</p>
      <p>I hold these, and the live ledger behind them:</p>
      <div class="iv-sugg">${KB.map(k=>`<button class="iv-s" data-ivask="${esc(k.t)}">${esc(k.t)}</button>`).join('')}</div>`});
    ivorRender(); return;
  }

  const idx=IV.log.push({role:'ivor',html:html||'<p class="iv-think">Thinking…</p>'})-1;
  ivorRender();
  if(!IV.sample){ if(!html)IV.log[idx].html='<p>No model is available in this view.</p>'; ivorRender(); return; }

  // 3. The model, given the facts and barred from adding to them.
  IV.busy=true;
  const turns=IV.log.filter(m=>m.role==='you').slice(-4).map(m=>({role:'user',content:m.text}));
  const input=[{role:'user',content:`${IVOR_RULES}\n\n=== FACTS ===\n${facts}\n=== END FACTS ===\n\nQuestion: ${q}`}];
  const head=html?'<div class="iv-reading"></div>'+html:'<div class="iv-reading"></div>';
  IV.log[idx].html=head;
  try{
    const res=await IV.sample(input,{modelTier:'default',onText:({text})=>{
      IV.log[idx].html=`<div class="iv-reading">${text.split(/\n{2,}/).map(p=>`<p>${esc(p)}</p>`).join('')}</div>`+(html||'');
      const b=document.getElementById('ivBody');
      if(b&&IV.tab==='ask'){const n=b.children[idx]; if(n)n.innerHTML=IV.log[idx].html;}
    }});
    const flags=ivorVerify(res.text,facts);
    IV.log[idx].html=`<div class="iv-reading">${res.text.split(/\n{2,}/).map(p=>`<p>${esc(p)}</p>`).join('')}${res.truncated?'<p class="iv-note">Cut off at the length limit.</p>':''}</div>`+(html||'');
    IV.log[idx].flags=flags;
  }catch(err){
    const code=err?.code||'';
    IV.log[idx].html=(html||'')+(html
      ? `<p class="iv-note">${code==='not_granted'?'You declined the model, so this is the authority table alone — which is where the figures come from in any case.'
          :code==='rate_limited'?'The model is rate limited; this is the authority table alone.'
          :'The model was unavailable; this is the authority table alone.'}</p>`
      : `<p>I could not reach the model${code?' ('+esc(code)+')':''}, and I hold nothing on that in the authority table.</p>`);
  }
  IV.busy=false; ivorRender();
}

}

// --- File a return ---------------------------------------------------------
// The declared amount is the point of this form. A return filed without one
// charges nothing, so the field is required before the status can reach Filed.
function returnModal(entityId,taxType,periodKey){
  const e=ent(entityId); if(!e)return;
  const slots=slotsFor(e,taxType);
  if(!slots.length){alert('There are no '+(TAX_LABEL[taxType]||taxType)+' return periods for '+e.name+'.');return;}
  const pk=slots.some(s=>s.periodKey===periodKey)?periodKey:slots[slots.length-1].periodKey;
  const draw=()=>{
    const slot=slotAt(e,taxType,pk);
    const r=returnFor(e,slot);
    const est=estimateFor(e,slot);
    const poas=taxType==='SA'?saPOAs(e,slot.periodKey):[];
    const poaSum=poas.reduce((a,p)=>a+p.amount,0);
    return `<h3>${r.status==='filed'?'Edit a filed return':'File a return'}</h3>
    <p class="mh-sub">${esc(e.name)} — ${esc(slot.label)}</p>
    <div class="row2">
      <div class="fg"><label>Period</label><select id="r_pk">
        ${slots.map(s=>`<option value="${s.periodKey}" ${s.periodKey===pk?'selected':''}>${esc(s.short)} — file by ${fmtD(s.fileBy)}</option>`).join('')}
      </select></div>
      <div class="fg"><label>Status</label><select id="r_status">
        ${Object.entries(RET_STATUS).map(([v,l])=>`<option value="${v}" ${r.status===v?'selected':''}>${l}</option>`).join('')}
      </select></div>
    </div>
    <div class="row2">
      <div class="fg"><label>Declared liability</label>
        <input type="number" step="0.01" id="r_dec" value="${r.declared!=null?r.declared:''}" placeholder="0.00">
        <div class="hint">${taxType==='VAT'?'Box 5 on the return.'
          :taxType==='SA'?'Total tax and Class 4 NIC for the year, before payments on account.'
          :taxType==='CT'?'Tax payable per the CT600.'
          :'Total PAYE, NIC and levies for the month, after Employment Allowance.'}
          ${est!=null?` The engine estimates ${money2(est)}.`:''}</div></div>
      <div class="fg"><label>Filed on</label>
        <input type="date" id="r_filed" value="${r.filedOn||S.asAt}">
        <div class="hint">Due ${fmtD(slot.fileBy)}.</div></div>
    </div>
    <div class="fg"><label>Submission reference</label>
      <input id="r_ref" value="${esc(r.reference)}" placeholder="HMRC receipt or submission ID"></div>
    ${est!=null&&est>0&&r.declared!=null&&Math.abs(est-r.declared)>1
      ? `<div class="banner warn">Declared ${money2(r.declared)} against an engine figure of ${money2(est)} — a difference of ${money2(Math.abs(r.declared-est))}. The declared figure governs; the difference is worth a note.</div>`:''}
    ${poaSum?`<div class="banner">Payments on account of ${money2(poaSum)} are already charged for ${tyLabel(pk)}. Filing this return charges the balance: declared less ${money2(poaSum)}.</div>`:''}
    <div class="banner">Money falls due ${fmtD(slot.payBy)}. Filing creates that liability; record the payment against it afterwards.</div>
    <div class="macts">
      ${r.rid?'<button class="btn danger" id="r_del">Delete record</button>':''}
      <button class="btn" id="r_cancel">Cancel</button>
      <button class="btn pri" id="r_save">Save</button></div>`;
  };
  const m=modal(draw());
  const bind=()=>{
    m.querySelector('#r_pk').onchange=ev=>{returnModal(entityId,taxType,ev.target.value);m.remove();};
    m.querySelector('#r_cancel').onclick=()=>m.remove();
    const del=m.querySelector('#r_del');
    if(del)del.onclick=()=>{
      const r=returnFor(e,slotAt(e,taxType,pk));
      S.returns=S.returns.filter(x=>x.id!==r.rid);
      m.remove(); save(); render();
    };
    m.querySelector('#r_save').onclick=()=>{
      const status=m.querySelector('#r_status').value;
      const raw=m.querySelector('#r_dec').value;
      const dec=raw===''?null:+raw;
      if(status==='filed'&&dec==null){
        alert('A filed return has to declare an amount. Enter the figure the return declared — enter 0 if it declared nil.');
        return;
      }
      const rec={entityId,taxType,periodKey:pk,status,declared:dec,
        filedOn:status==='filed'?m.querySelector('#r_filed').value:null,
        reference:m.querySelector('#r_ref').value};
      const ex=storedReturn(entityId,taxType,pk);
      if(ex)Object.assign(ex,rec,{migrated:false});
      else S.returns.push({id:NEW_ID(),...rec});
      ledgerInvalidate();
      // Anything already sitting on account is applied to the debt this return
      // has just created, oldest first — which is what HMRC would do with it.
      if(status==='filed')sweepCredit(entityId,taxType);
      m.remove(); save(); render();
    };
  };
  bind();
}

// Apply unallocated money to open liabilities, oldest first.
function sweepCredit(entityId,taxType){
  ledgerInvalidate();
  for(const p of S.payments.filter(p=>p.entityId===entityId&&p.taxType===taxType
      &&p.direction!=='from_hmrc')){
    const used=payAllocs(p).reduce((a,b)=>a+(+b.amount||0),0);
    const spare=r2((+p.amount||0)-used);
    if(spare<=0.005)continue;
    const add=autoAllocate(entityId,taxType,spare,null);
    if(add.length){p.allocs=payAllocs(p).concat(add);ledgerInvalidate();}
  }
}
