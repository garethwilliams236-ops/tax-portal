// Exact term lookup. Acronyms match case-insensitively as whole words; longer
// terms match as a phrase. No fuzzy matching — a near miss here should fall
// through to the topics, not guess.
function glossaryHits(q){
  const l=' '+q.toLowerCase().replace(/[^a-z0-9.\s]/g,' ').replace(/\s+/g,' ')+' ';
  const out=[];
  for(const g of GLOSSARY){
    const t=g.t.toLowerCase();
    if(l.includes(' '+t+' ')||l.includes(' '+t+'s ')||
       l.includes(' '+g.full.toLowerCase()+' '))out.push(g);
  }
  return out;
}
// Is this a question about what something MEANS, rather than how it works?
const isDefinitional=q=>/\b(what (do|does|is|are)|meaning|means?\b|stand for|abbreviat|acronym|define|definition|terminology|jargon)\b/i.test(q);

function glossaryHtml(hits,q){
  let h=`<h4 class="iv-h">${hits.length===1?esc(hits[0].full):'Terms'}</h4>`;
  h+=`<dl class="iv-gl">${hits.map(g=>
    `<dt>${esc(g.t)}${g.full.toLowerCase()!==g.t.toLowerCase()?` <span>${esc(g.full)}</span>`:''}</dt>
     <dd>${esc(kbField(g,'d'))}${g.see?` <button class="iv-s sm" data-ivask="${esc((kbById(g.see)||{}).t||'')}">More on ${esc((kbById(g.see)||{}).t||'this')}</button>`:''}</dd>`).join('')}</dl>`;
  return h;
}


// ===========================================================================
// IVOR — grounding, retrieval and composition
// ===========================================================================
// The rule Ivor is built around: every figure, date and citation in an answer
// comes from the live ledger or from the authority table. The language model,
// where one is available, is used for PHRASING and ROUTING only — it is given
// the facts and told it may not introduce any others, and whatever it writes
// is checked against those facts before it is shown. An unsupported number in
// an answer to a chartered accountant is worse than no answer at all.

const TAXES_OF=e=>e.type==='company'
  ? (e.status==='dormant'?[]:['CT'].concat(e.vat?['VAT']:[],e.payroll?['PAYE']:[]))
  : ['SA'];

// --- Live state, compactly -------------------------------------------------
function ivorContext(){
  const now=asAt(), out={asAt:fmtD(now),taxYear:tyLabel(tyOfDate(now)),entities:[]};
  for(const e of S.entities){
    const row={name:e.name,type:e.type,
      status:e.type==='company'?e.status:(e.poa?'payments on account due':'no payments on account'),
      yearEnd:e.type==='company'?`${e.yeDay} ${MONTHS[(+e.yeMonth||3)-1]}`:null,
      taxes:[]};
    for(const t of TAXES_OF(e)){
      const A=taxAccount(e,t), LR=latestReturn(e,t);
      row.taxes.push({tax:TAX_LABEL[t]||t,code:t,
        lastFiled:LR.filed?`${LR.filed.short}, filed ${LR.filed.filedOn?fmtD(parseD(LR.filed.filedOn)):'date not recorded'}${LR.filed.declared!=null?', declared '+money2(LR.filed.declared):', declared amount NOT recorded'}`:'none filed',
        nextReturn:LR.next?`${LR.next.short}, file by ${fmtD(LR.next.fileBy)}`:null,
        returnsNotFiled:LR.outstandingCount,
        charged:A.charged,paid:A.allocated,outstanding:A.outstanding,
        overdue:A.overdueAmt,credit:A.credit,
        next:A.target?`${money2(outstandingOf(A.target))} — ${A.target.label} — due ${fmtD(A.target.dueDate)}`:null,
        openCharges:A.open.map(l=>`${money2(outstandingOf(l))} ${l.label} due ${fmtD(l.dueDate)}${l.dueDate<now?' (OVERDUE)':''}`)});
    }
    if(e.type==='company'){
      const dv=associationDivisor(e.id);
      row.association=`CT limits divided by ${dv} (${money(CT_RATES.lower/dv)} / ${money(CT_RATES.upper/dv)})`;
      const cty=tyOfDate(now);
      const ppl=peopleIn(e.id,cty);
      if(e.payroll&&ppl.length&&anyPayRecorded(e.id,cty)){const ea=assessEA(ppl);
        row.employmentAllowance=`${tyLabel(cty)}: ${ea.ok?'on track to claim':'NOT on track: '+ea.why}`;}
      else if(e.payroll)row.employmentAllowance='no payroll recorded for '+tyLabel(cty);
    } else {
      const ty=tyOfDate(now), inc=S.income[ykey(e.id,ty)];
      if(inc&&Object.values(inc).some(v=>+v>0)){
        const R=computeIT(inc,ty);
        row.computed=`${tyLabel(ty)} engine figure ${money2(R.due)} on income ${money(R.total)}, ANI ${money(R.ani)}, personal allowance ${money(R.pa)}${R.lost>0?` (${money(R.lost)} lost to the taper)`:''}${R.marginal!=null?`, marginal rate on the next £100 of salary ${R.marginal}%`:''} — an ESTIMATE, not declared`;
      }
    }
    out.entities.push(row);
  }
  return out;
}

function ivorContextText(ctx){
  const L=[`As at ${ctx.asAt}. Current tax year ${ctx.taxYear}.`];
  for(const e of ctx.entities){
    L.push(`\nENTITY: ${e.name} (${e.type}${e.status?', '+e.status:''}${e.yearEnd?', year end '+e.yearEnd:''})`);
    if(e.association)L.push(`  ${e.association}`);
    if(e.employmentAllowance)L.push(`  Employment Allowance: ${e.employmentAllowance}`);
    if(e.computed)L.push(`  ${e.computed}`);
    if(!e.taxes.length)L.push('  No taxes generating obligations (dormant).');
    for(const t of e.taxes){
      L.push(`  ${t.tax}: last return ${t.lastFiled}.${t.nextReturn?` Next return ${t.nextReturn}.`:''}${t.returnsNotFiled?` ${t.returnsNotFiled} return(s) past the filing date and not filed.`:''}`);
      L.push(`    charged ${money2(t.charged)}, paid ${money2(t.paid)}, outstanding ${money2(t.outstanding)}${t.overdue>0.005?`, of which ${money2(t.overdue)} overdue`:''}${t.credit>0.005?`, plus ${money2(t.credit)} unallocated on account`:''}.`);
      for(const c of t.openCharges.slice(0,6))L.push(`    open: ${c}`);
    }
  }
  return L.join('\n');
}

// --- Retrieval -------------------------------------------------------------
// Navigational words plus words that carry no discriminating information in a
// UK tax knowledge base. "HMRC" and "tax" appear in almost every real question
// and identify nothing; leaving them in let a PAYE question be pulled to the
// Corporation Tax notification topic purely because that topic's tags happened
// to spell "HMRC" and PAYE's did not.
const STOP=new Set(['what','does','this','mean','the','a','an','is','are','do','i','my','of',
  'for','on','in','to','and','how','why','when','it','that','with','be','can','should','me',
  'you','we','us','have','has','if','so','at','by','or','not','was','were','from','about',
  'hmrc','tax','taxes','uk','need','know','tell','please','get','got','there','their','over']);
const words=s=>String(s).toLowerCase().replace(/[^a-z0-9£%\s.-]/g,' ').split(/\s+/).filter(w=>w&&!STOP.has(w));

// A weak keyword collision must not produce a confident answer about the
// wrong tax. MIN_SCORE is the floor below which Ivor says it holds nothing
// rather than reaching for the nearest topic; related entries additionally
// have to be within striking distance of the best match.
const MIN_SCORE=4;
// How many topics mention a word. A word in one topic identifies it; a word in
// half the table ("paye", "tax", "return") identifies nothing, and letting it
// score is how a question about the NIC thresholds got answered with the PAYE
// payment dates.
let _df=null;
function docFreq(w){
  if(!_df){
    _df={};
    for(const k of KB){
      const seen=new Set((k.id+' '+k.t+' '+k.tags).toLowerCase().split(/[^a-z0-9£%]+/).filter(Boolean));
      for(const t of seen)_df[t]=(_df[t]||0)+1;
    }
  }
  return _df[w]||0;
}
const rarity=w=>{const n=docFreq(w);return n===0?0:n===1?2.2:n<=2?1.6:n<=4?1.1:n<=7?.6:.25;};

function ivorMatch(q,limit=3){
  const qs=words(q); if(!qs.length)return [];
  const scored=KB.map(k=>{
    const hay=' '+(k.id+' '+k.t+' '+k.tags).toLowerCase().replace(/[^a-z0-9£%]+/g,' ')+' ';
    let s=0,hits=0;
    for(const w of qs){
      let base=0;
      if(hay.includes(' '+w+' '))base=w.length>=5?3:2;          // whole word
      else if(w.length>4&&hay.includes(' '+w.slice(0,-1)))base=2; // simple plural
      else if(w.length>5&&hay.includes(w))base=1;                // inside a longer word
      if(base){s+=base*rarity(w);hits++;}
    }
    // A question whose distinctive words are all unknown to the table has not
    // been understood, whatever its common words happened to hit.
    const distinctive=qs.filter(w=>docFreq(w)===0||docFreq(w)<=2);
    if(distinctive.length&&!distinctive.some(w=>hay.includes(w)))s*=0.35;
    // A phrase bonus, but only for a phrase. Matching a bare fragment against
    // a title is how "ANI" scored against "associated compANIes".
    const phrase=qs.join(' ');
    if(phrase.length>=6&&(' '+k.t.toLowerCase()+' ').includes(' '+phrase))s+=6;
    return {k,s,hits};
  }).filter(x=>x.s>=MIN_SCORE).sort((a,b)=>b.s-a.s);
  if(!scored.length)return [];
  const floor=Math.max(MIN_SCORE,scored[0].s*0.55);
  return [scored[0]].concat(scored.slice(1).filter(x=>x.s>=floor)).slice(0,limit);
}
const kbById=id=>KB.find(k=>k.id===id)||null;

// --- Questions the ledger answers on its own -------------------------------
// These are answered from state, deterministically, and never sent to a model.
function ivorStateAnswer(q){
  const l=q.toLowerCase(), now=asAt();
  const wantsOwe=/\b(owe|owing|outstanding|payable|balance|left to pay)\b/.test(l);
  const wantsOverdue=/\b(overdue|behind|in arrears)\b/.test(l);
  if(!wantsOwe&&!wantsOverdue)return null;
  // "When is the VAT return due?" and "how does outstanding work?" are
  // questions about the rule. Only a question about the POSITION is answered
  // from the ledger, and a strong topic match always wins.
  // But "what is overdue?" is a position question that happens to open with
  // "what is": if nothing is left of the question once the position vocabulary
  // is removed, it is asking about the ledger.
  const POSW=new Set(['owe','owing','outstanding','overdue','payable','balance','left','behind',
    'arrears','due','total','still','now','currently','anything','everything','across','all']);
  const rest=words(q).filter(w=>!POSW.has(w));
  const bare=!rest.length||rest.every(w=>S.entities.some(e=>e.name.toLowerCase().includes(w)));
  if(!bare&&/\b(when|deadline|due date|how does|how do|what is|what are|explain|mean|means|work|works|why)\b/.test(l))return null;
  const top=ivorMatch(q,1)[0];
  if(top&&top.s>=8)return null;

  // Scope to one entity if named.
  const named=S.entities.find(e=>l.includes(e.name.toLowerCase().replace(/[«»]/g,'').trim().slice(0,12)));
  const ents=named?[named]:S.entities;
  const rows=[];
  let tot=0,od=0,unf=0;
  for(const e of ents)for(const t of TAXES_OF(e)){
    const A=taxAccount(e,t), LR=latestReturn(e,t);
    unf+=LR.outstandingCount;
    if(A.outstanding>0.005||A.overdueAmt>0.005){
      tot+=A.outstanding; od+=A.overdueAmt;
      for(const li of A.open)rows.push({e,t,li,out:outstandingOf(li)});
    }
  }
  rows.sort((a,b)=>a.li.dueDate-b.li.dueDate);
  const shown=wantsOverdue?rows.filter(r=>r.li.dueDate<now):rows;

  let h=`<p>${shown.length
    ? `${money2(shown.reduce((a,r)=>a+r.out,0))} ${wantsOverdue?'overdue':'outstanding'}${named?' for '+esc(named.name):' across '+ents.length+' entities'}, across ${shown.length} charge${shown.length===1?'':'s'}.`
    : `Nothing ${wantsOverdue?'overdue':'outstanding'}${named?' for '+esc(named.name):''}.`}</p>`;
  if(shown.length){
    h+=`<table class="iv-t"><thead><tr><th>Due</th><th>Entity</th><th>Charge</th><th class="num">Outstanding</th></tr></thead><tbody>`;
    h+=shown.slice(0,12).map(r=>`<tr class="${r.li.dueDate<now?'od':''}">
      <td>${fmtD(r.li.dueDate)}</td><td>${esc(r.e.name)}</td>
      <td><span class="tag">${r.t}</span> ${esc(r.li.label)}</td>
      <td class="num">${money2(r.out)}</td></tr>`).join('');
    h+=`</tbody></table>`;
  }
  if(unf)h+=`<p class="iv-warn">${unf} return${unf===1?'':'s'} past the filing date and not filed. Until a return is filed it declares nothing, so any tax those periods carry is <em>not</em> in the figure above.</p>`;
  h+=`<p class="iv-note">Outstanding means a filed return declared it, or statute charged it in advance, less payments allocated to it. Engine estimates against unfiled returns are excluded.</p>`;
  return {html:h,topics:['ledger'],kind:'state'};
}

// --- Composing a deterministic answer --------------------------------------
function ivorTopicHtml(k,liveNote){
  let h=`<h4 class="iv-h">${esc(k.t)}</h4>`;
  if(liveNote)h+=`<div class="iv-live">${liveNote}</div>`;
  h+=`<p>${esc(kbField(k,'what'))}</p>`;
  const det=kbField(k,'detail')||[];
  if(det.length)h+=`<ul class="iv-ul">${det.map(d=>`<li>${esc(d)}</li>`).join('')}</ul>`;
  if(k.judgement)h+=`<div class="iv-judge"><strong>This one is a judgement.</strong> ${esc(k.judgement)}</div>`;
  if(k.cites?.length)h+=`<div class="iv-cites">${k.cites.map(([ref,note])=>
    `<span class="iv-cite"><b>${esc(ref)}</b>${note?' — '+esc(note):''}</span>`).join('')}</div>`;
  return h;
}

// The live figure behind a contextual question. This is what turns "what does
// this mean" from an essay into an answer about YOUR number.
function ivorLive(topicId,entityId,periodKey){
  const e=entityId?ent(entityId):null;
  if(!e)return '';
  const P=periodKey;
  try{
    if(topicId==='ct-rates'||topicId==='association'||topicId==='trade-start'){
      const dv=associationDivisor(e.id);
      const c=P?S.computations[e.id+'|'+P]:null;
      let s=`<strong>${esc(e.name)}</strong>: limits divided by ${dv} — lower ${money(CT_RATES.lower/dv)}, upper ${money(CT_RATES.upper/dv)}.`;
      if(c&&c.profit!==''&&c.profit!=null){
        const slot=slotAt(e,'CT',P);
        const R=computeCT({start:slot?.periodStart,end:slot?.periodEnd,profit:+c.profit||0,
          distributions:+c.distributions||0,divisor:dv,cihc:!!e.cihc});
        s+=` On taxable profits of ${money(R.N)}, tax is ${money2(R.due)} at an effective ${(R.eff*100).toFixed(2)}% — ${R.rate==='spr'?'the small profits rate':R.rate==='marginal'?'marginal relief':'the main rate'}.`;
      }
      return s;
    }
    if(topicId==='ea'){
      const ty=(P&&TAX_YEARS.includes(P))?P:tyOfDate(asAt());
      if(!anyPayRecorded(e.id,ty))
        return `<strong>${esc(e.name)}</strong>: no payroll recorded for ${tyLabel(ty)}, so there is nothing to assess.`;
      const ppl=peopleIn(e.id,ty); if(!ppl.length)return '';
      const ea=assessEA(ppl);
      return `<strong>${esc(e.name)}</strong>, ${tyLabel(ty)}: ${ea.ok?`on track — the allowance of ${money(NIC.ea)} is available.`:ea.why}`;
    }
    if(topicId==='poa'||topicId==='sa-dates'){
      const ty=P||tyOfDate(asAt());
      const L=liabilitiesFor(e,'SA',ty).filter(x=>x.kind==='poa');
      if(!L.length)return `<strong>${esc(e.name)}</strong>: no payments on account are charged for ${tyLabel(ty)} — they arise from the previous year's <em>declared</em> figure, so they appear once that return is filed.`;
      return `<strong>${esc(e.name)}</strong>: ${L.map(x=>`${money2(x.amount)} due ${fmtD(x.dueDate)}${outstandingOf(x)<=0.005?' (paid)':` (${money2(outstandingOf(x))} outstanding)`}`).join(' and ')}. ${esc(L[0].detail||'')}`;
    }
    if(topicId==='vat-dates'){
      const LR=latestReturn(e,'VAT');
      if(LR.next)return `<strong>${esc(e.name)}</strong>: next VAT return ${esc(LR.next.short)}, due ${fmtD(LR.next.fileBy)}.`;
      return '';
    }
    if(topicId==='ct-dates'&&P){
      const d=parseD(P);
      return `<strong>${esc(e.name)}</strong>: for the period to ${fmtD(d)}, tax is payable ${fmtD(ctPaymentDue(d))} and the CT600 is due ${fmtD(ct600Due(d))}.`;
    }
    if(topicId==='pa-taper'||topicId==='hicbc'||topicId==='s24'){
      const ty=P||tyOfDate(asAt()), inc=S.income[ykey(e.id,ty)];
      if(!inc||!Object.values(inc).some(v=>+v>0))return '';
      const R=computeIT(inc,ty);
      if(topicId==='pa-taper')return `<strong>${esc(e.name)}</strong>, ${tyLabel(ty)}: adjusted net income ${money(R.ani)}, personal allowance ${money(R.pa)}${R.lost>0?` — ${money(R.lost)} lost to the taper`:' — full allowance'}.`;
      if(topicId==='hicbc')return R.hicbc?`<strong>${esc(e.name)}</strong>, ${tyLabel(ty)}: the charge is ${money2(R.hicbc)}.`:'';
      if(topicId==='s24')return R.reducer?`<strong>${esc(e.name)}</strong>, ${tyLabel(ty)}: the reducer is ${money2(R.reducer)}.`:'';
    }
    if(topicId==='ledger'||topicId==='estimate'||topicId==='allocation'){
      const t=TAXES_OF(e)[0];
      if(!t)return '';
      const A=taxAccount(e,t);
      return `<strong>${esc(e.name)}</strong>, ${TAX_LABEL[t]}: charged ${money2(A.charged)}, paid ${money2(A.allocated)}, outstanding ${money2(A.outstanding)}${A.credit>0.005?`, plus ${money2(A.credit)} unallocated on account`:''}.`;
    }
  }catch(err){ return ''; }
  return '';
}

// --- The grounding block handed to the model -------------------------------
function ivorFacts(topics,ctx,terms){
  const L=['=== LIVE POSITION (the only source for any figure about this user) ===',
    ivorContextText(ctx),'','=== AUTHORITY (the only source for any rate, threshold, deadline or citation) ==='];
  for(const k of topics){
    L.push(`\n[${k.id}] ${k.t}`);
    L.push(kbField(k,'what'));
    for(const d of (kbField(k,'detail')||[]))L.push('- '+d);
    if(k.judgement)L.push('JUDGEMENT: '+k.judgement);
    if(k.cites?.length)L.push('Authority: '+k.cites.map(([r,n])=>r+(n?' ('+n+')':'')).join('; '));
  }
  if(terms&&terms.length){
    L.push('','=== TERMS ===');
    for(const g of terms)L.push(`${g.t} (${g.full}): ${kbField(g,'d')}`);
  }
  return L.join('\n');
}

const IVOR_RULES=`You are Ivor, the process assistant inside a UK tax management portal.

The person you are talking to is a chartered accountant who files his own returns for his own companies and his own household. Write to that level: professional register, statutory and manual references rather than plain-English paraphrase, no "consult an accountant" and no disclaimers about seeking advice. He is the adviser.

ABSOLUTE RULES — these are not style preferences:
1. Every figure, rate, threshold, date, deadline, percentage and statutory or manual reference in your answer MUST appear in the FACTS block below. You may quote, rearrange, and explain them. You may NOT introduce any that are not there, and you may NOT compute new ones from memory.
2. If the FACTS block does not answer the question, say exactly what is missing and stop. Do not fill the gap from general knowledge. A short answer that says "the portal does not hold that" is correct; a plausible invented threshold is a serious failure.
3. Arithmetic on figures that ARE in the FACTS block is allowed, but show it.
4. Where the FACTS block marks something JUDGEMENT, set out the test, name the competing authority on both sides, and say plainly that the call is his. Do not recommend a position.
5. Distinguish an ESTIMATE from a DECLARED amount every time. An engine figure against an unfiled return is not money owed.

Answer in 2-5 short paragraphs of plain prose. No headings, no bullet lists, no markdown emphasis. Do not restate the question. Do not close with an offer of further help.`;

// --- Checking what the model wrote against what it was given ---------------
// Cheap, and worth it. Anything numeric or citation-shaped in the reply that
// is absent from the grounding facts is surfaced rather than trusted.
const NUMPAT=/£\s?[\d,]+(?:\.\d+)?|\b\d+(?:\.\d+)?\s?%|\b(?:s\.|section\s)\d+[A-Z]{0,3}\b|\b(?:CTM|NIM|TSEM|IHTM|SAM|CG|VAT)\d{3,}\b|\b\d{1,2}\s+(?:January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{4}\b/gi;
const norm=s=>s.toLowerCase().replace(/[£,\s]/g,'');
function ivorVerify(text,facts){
  const fset=new Set((facts.match(NUMPAT)||[]).map(norm));
  // Also index bare digit runs from the facts, so "£8,400" matches "8400.00".
  for(const m of facts.match(/[\d][\d,]*(?:\.\d+)?/g)||[]){
    const n=norm(m); fset.add(n); fset.add(n.replace(/\.00$/,''));
  }
  const bad=[];
  for(const m of text.match(NUMPAT)||[]){
    const n=norm(m);
    if(fset.has(n)||fset.has(n.replace(/\.00$/,''))||fset.has(n+'.00'))continue;
    // A percentage stated as a rounded form of something present is allowed.
    if(!bad.includes(m))bad.push(m);
  }
  return bad;
}

const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const el=id=>document.getElementById(id);
const TAX_LABEL={CT:'Corporation Tax',VAT:'VAT',PAYE:'PAYE & NIC',CS:'Companies House',
  ACCOUNTS:'Companies House',SA:'Self Assessment',CT_NOTIF:'HMRC notification'};

// The action against an obligation. Anything that DECLARES an amount is
// actioned by filing the return, and anything that charges money is actioned
// by recording a payment — neither is a tick. Only filings that charge nothing
// (Companies House) keep a plain mark-as-done.
// What an obligation is worth. A charged liability if one exists; otherwise
// the engine's figure, marked as an estimate so it is never read as a debt.
function obAmount(o){
  const e=ent(o.entityId); if(!e)return null;
  const L=liabilitiesFor(e,o.taxType).filter(l=>iso(l.dueDate)===iso(o.dueDate));
  if(L.length)return {amount:r2(L.reduce((a,l)=>a+outstandingOf(l),0)),charged:true};
  const v=amountFor(o);
  return v==null?null:{amount:v,charged:false};
}

function obAction(o,ro){
  const e=ent(o.entityId);
  if(e&&DECLARING[o.taxType]===o.kind)
    return `<button class="btn sm ${o.status==='filed'?'':'pri'}" data-file="${o.entityId}:${o.taxType}:${obPeriodKey(o)}" ${ro||''}>${o.status==='filed'?'Return':'File return'}</button>`;
  if(e&&o.kind==='payment'&&liabilitiesFor(e,o.taxType).some(l=>iso(l.dueDate)===iso(o.dueDate)))
    return `<button class="btn sm ${o.status==='paid'?'':'pri'}" data-addpay="${o.entityId}:${o.taxType}:" ${ro||''}>${o.status==='paid'?'Paid':'Pay'}</button>`;
  if(o.kind==='payment')
    return `<span class="mini">no liability — file the return first</span>`;
  return o.status==='open'
    ? `<button class="btn sm" data-mark="${o.key}:filed" ${ro||''}>Mark filed</button>`
    : `<button class="btn sm" data-mark="${o.key}:open" ${ro||''}>Undo</button>`;
}

function statusPill(o){
  if(o.status==='paid')return '<span class="pill ok">Paid</span>';
  if(o.status==='filed')return '<span class="pill ok">Filed</span>';
  const d=daysTo(o.dueDate);
  if(d<0)return `<span class="pill crit">${Math.abs(d)}d overdue</span>`;
  if(d<=14)return `<span class="pill warn">${d}d</span>`;
  return `<span class="pill mute">${d}d</span>`;
}

function renderTabs(){

  let h=`<button class="tab ${activeTab==='overview'?'on':''}" data-tab="overview">Overview${od.length?'<span class="dot"></span>':''}</button>`;
