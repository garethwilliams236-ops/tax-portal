<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>Tax Portal</title><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128203;</text></svg>"></head>
<body>
<title>Tax Portal</title>
<style>
:root{
  --bg:#f7f6f3; --panel:#fff; --panel2:#fbfaf8; --ink:#191c20; --muted:#5f656d;
  --line:#e3e1dc; --line2:#efede8; --accent:#1f3a5f; --accent-ink:#fff; --accent-bg:#eef3fa;
  --ok:#0f7b47; --ok-bg:#eaf6ef; --warn:#a35a07; --warn-bg:#fdf5e8;
  --crit:#a92720; --crit-bg:#fdeeed; --info:#1b5ec2; --info-bg:#eaf2fd;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 1px 3px rgba(0,0,0,.04);
  --yr-open:#e8f0fb; --yr-open-line:#c3d8f3; --yr-open-ink:#1a4a88;
  --yr-closed:#e7f4ec; --yr-closed-line:#bcdcc8; --yr-closed-ink:#1b5a38;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141619; --panel:#1c1f24; --panel2:#22262c; --ink:#e9eaec; --muted:#9ba1a9;
  --line:#2c3037; --line2:#262a30; --accent:#7ea6d8; --accent-ink:#0f1418; --accent-bg:#1a2531;
  --ok:#5bc48c; --ok-bg:#152a1f; --warn:#e0a648; --warn-bg:#2a2317;
  --crit:#f08c85; --crit-bg:#2c1a19; --info:#7cb2f0; --info-bg:#16232f;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --yr-open:#182634; --yr-open-line:#2b4360; --yr-open-ink:#9cc5f2;
  --yr-closed:#16281e; --yr-closed-line:#2a4634; --yr-closed-ink:#84cfa4;
}}
:root[data-theme="dark"]{
  --bg:#141619; --panel:#1c1f24; --panel2:#22262c; --ink:#e9eaec; --muted:#9ba1a9;
  --line:#2c3037; --line2:#262a30; --accent:#7ea6d8; --accent-ink:#0f1418; --accent-bg:#1a2531;
  --ok:#5bc48c; --ok-bg:#152a1f; --warn:#e0a648; --warn-bg:#2a2317;
  --crit:#f08c85; --crit-bg:#2c1a19; --info:#7cb2f0; --info-bg:#16232f;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --yr-open:#182634; --yr-open-line:#2b4360; --yr-open-ink:#9cc5f2;
  --yr-closed:#16281e; --yr-closed-line:#2a4634; --yr-closed-ink:#84cfa4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14.5px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:1800px;margin:0 auto;padding:0 18px 70px}
header.top{padding:20px 0 0}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:19px;margin:0;letter-spacing:-.01em}
.brand .as-at{color:var(--muted);font-size:13px}
.brand .build{font-size:11.5px;opacity:.6;font-variant-numeric:tabular-nums}
.brand .spacer{flex:1}
.tabs{display:flex;gap:2px;margin-top:16px;border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:thin}
.tab{padding:9px 14px;border:none;background:none;color:var(--muted);cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap;font-size:14px;font-weight:500;
  border-radius:5px 5px 0 0}
.tab:hover{color:var(--ink);background:var(--panel2)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--crit);margin-left:6px;vertical-align:middle}
.tab.add{color:var(--accent);font-weight:600}
main{padding-top:22px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
  margin:30px 0 12px;font-weight:650}
h2:first-child{margin-top:4px}
.ent-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;
  padding-bottom:16px;border-bottom:1px solid var(--line)}
.ent-head h3{margin:0 0 4px;font-size:21px;letter-spacing:-.015em}
.ent-meta{color:var(--muted);font-size:13px;display:flex;gap:14px;flex-wrap:wrap}
.ent-head .acts{margin-left:auto;display:flex;gap:8px}
.pill{display:inline-block;font-size:11px;font-weight:650;padding:2.5px 8px;border-radius:20px;
  letter-spacing:.03em;text-transform:uppercase}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.mute{background:var(--line2);color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:16px 17px;box-shadow:var(--shadow)}
.card .ch{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.card .ch h4{margin:0;font-size:14.5px;font-weight:650;letter-spacing:-.005em}
.card .ch .pill{margin-left:auto}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.leg .lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  font-weight:600;margin-bottom:3px}
.leg .amt{font-size:20px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.leg .sub{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.leg .amt.crit{color:var(--crit)}
.card .foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--line2);
  display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{padding:6px 12px;border:1px solid var(--line);background:var(--panel);
  border-radius:7px;cursor:pointer;font-size:13px;font-weight:550}
.btn:hover{background:var(--panel2);border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{opacity:.9;background:var(--accent)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.subtabs{display:flex;gap:4px;margin:24px 0 16px;flex-wrap:wrap}
.subtab{padding:6px 13px;border:1px solid var(--line);background:var(--panel);
  border-radius:20px;cursor:pointer;font-size:13px;color:var(--muted);font-weight:550}
.subtab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tw{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.tw.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);font-weight:650;padding:9px 14px;background:var(--panel2);
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 14px;border-top:1px solid var(--line2);vertical-align:middle}
tr:first-child td{border-top:none}
th.num,td.num{text-align:right}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
th.act,td.act{text-align:right}
td.dt{white-space:nowrap;color:var(--muted)}
td.act{text-align:right;white-space:nowrap}
tr.od td{background:var(--crit-bg)}
.empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:13.5px}
.nudge{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--muted);
  border-radius:9px;padding:13px 15px;margin-bottom:9px;box-shadow:var(--shadow)}
.nudge.p1{border-left-color:var(--crit)} .nudge.p2{border-left-color:var(--warn)}
.nudge.p3{border-left-color:var(--info)}
.nudge h5{margin:7px 0 5px;font-size:14.5px;font-weight:620}
.nudge p{margin:0;color:var(--muted);font-size:13px}
.nudge .nh{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.nudge .nh .when{margin-left:auto;font-size:12px;color:var(--muted)}
.work{background:var(--panel2);border:1px solid var(--line);border-radius:9px;
  padding:14px 16px;font-size:13px;color:var(--muted);margin-top:12px}
.work ol{margin:0;padding-left:19px} .work li{margin-bottom:6px}
.work strong{color:var(--ink)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:flex-start;
  justify-content:center;padding:36px 16px;overflow-y:auto;z-index:60}
.modal{background:var(--panel);border-radius:13px;padding:22px 24px;width:100%;max-width:540px;
  border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.22)}
.modal h3{margin:0 0 4px;font-size:17px}
.modal .mh-sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.fg{margin-bottom:13px}
.fg label{display:block;font-size:12px;font-weight:620;margin-bottom:4px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.05em}
.fg input,.fg select,.fg textarea{width:100%;padding:8px 10px;border:1px solid var(--line);
  border-radius:7px;background:var(--panel2)}
.fg input:focus,.fg select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.fg .hint{font-size:11.5px;color:var(--muted);margin-top:4px;text-transform:none;letter-spacing:0;font-weight:400}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.macts{display:flex;gap:9px;justify-content:flex-end;margin-top:20px;
  padding-top:16px;border-top:1px solid var(--line2)}
.banner{padding:11px 14px;border:1px solid var(--line);border-left:3px solid var(--info);
  background:var(--info-bg);border-radius:8px;font-size:13px;margin:14px 0}
.banner.warn{border-left-color:var(--warn);background:var(--warn-bg)}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat .n{font-size:24px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:12.5px;margin-top:2px}
.stat.crit .n{color:var(--crit)}
.save{position:fixed;bottom:16px;right:16px;background:var(--accent);color:var(--accent-ink);
  padding:8px 14px;border-radius:20px;font-size:12.5px;font-weight:600;opacity:0;
  transition:opacity .25s;pointer-events:none;z-index:80}
.save.on{opacity:.95}
.mini{font-size:12px;color:var(--muted)}
.years{display:flex;gap:7px;margin:18px 0 4px;flex-wrap:wrap;align-items:center}
.ytab{padding:7px 14px;border:1px solid var(--line);border-radius:8px;cursor:pointer;
  font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px;
  background:var(--panel);color:var(--muted)}
.ytab .yst{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.85}
.ytab.open{background:var(--yr-open);border-color:var(--yr-open-line);color:var(--yr-open-ink)}
.ytab.closed{background:var(--yr-closed);border-color:var(--yr-closed-line);color:var(--yr-closed-ink)}
.ytab.on{outline:2px solid var(--accent);outline-offset:1px}
.ylegend{font-size:12px;color:var(--muted);margin-left:6px;display:flex;gap:12px;align-items:center}
.ylegend i{display:inline-block;width:11px;height:11px;border-radius:3px;
  vertical-align:-1px;margin-right:5px;border:1px solid var(--line)}
.ylegend i.o{background:var(--yr-open);border-color:var(--yr-open-line)}
.ylegend i.c{background:var(--yr-closed);border-color:var(--yr-closed-line)}
.yearbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px 15px;border:1px solid var(--line);border-radius:9px;margin-bottom:16px}
.yearbar.open{background:var(--yr-open);border-color:var(--yr-open-line)}
.yearbar.closed{background:var(--yr-closed);border-color:var(--yr-closed-line)}
.yearbar .yb-t{font-weight:650;font-size:15px}
.yearbar .sp{flex:1}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;font-weight:600}
.chk input{width:17px;height:17px;cursor:pointer;accent-color:var(--ok)}
.pillrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:2px 0 6px}
.spill{display:inline-flex;align-items:baseline;gap:6px;padding:4px 11px;border-radius:20px;
  border:1px solid var(--line);background:var(--panel);font-size:12.5px;line-height:1.35}
.spill b{font-size:13.5px;font-weight:680;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.spill span{color:var(--muted)}
.spill.crit{background:var(--crit-bg);border-color:var(--crit);color:var(--crit)}
.spill.crit span{color:var(--crit)}
.spill.warn{background:var(--warn-bg);border-color:var(--warn-bg);color:var(--warn)}
.spill.warn span{color:var(--warn)}
.spill.ok{background:var(--ok-bg);border-color:var(--ok-bg);color:var(--ok)}
.spill.ok span{color:var(--ok)}
.elist{display:flex;flex-direction:column;gap:12px}
.ecard table{table-layout:fixed}
.ecard col.c-tax{width:15%}
.ecard col.c-ret{width:25%}
.ecard col.c-money{width:11%}
.ecard col.c-next{width:19%}
.ecard col.c-stat{width:8%}
.ecard td:last-child{white-space:nowrap}
.ecard td,.ecard th{padding-left:12px;padding-right:12px}
.ecard td:not(.num){overflow-wrap:anywhere}
.ecard{border:1px solid var(--line);border-radius:10px;background:var(--panel);
  overflow:hidden;box-shadow:var(--shadow)}
.ehead{display:flex;align-items:center;gap:10px;padding:11px 15px;
  background:var(--panel2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.ehead .en{font-weight:650;font-size:15px;letter-spacing:-.01em}
.ehead .sp{flex:1}
.ecard table{font-size:13px}
.ecard th{background:transparent;padding:7px 15px;font-size:10.5px}
.ecard td{padding:8px 15px}
.ecard td.tx{white-space:nowrap;font-weight:600}
.movebar{display:inline-flex;gap:6px;align-items:center;margin-left:6px}
.movebar select{padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:12.5px}
input.cell{width:104px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;
  background:var(--panel2);text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
input.cell:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--panel)}

/* --- Ivor ------------------------------------------------------------- */
.iv-dot{display:none;min-width:17px;height:17px;padding:0 4px;margin-left:5px;border-radius:9px;
  background:var(--crit);color:#fff;font-size:10.5px;line-height:17px;font-weight:700;text-align:center}
.iv-q{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;margin-left:5px;
  padding:0;border:1px solid var(--line);border-radius:50%;background:var(--panel2);color:var(--muted);
  font-size:10px;font-weight:700;cursor:pointer;vertical-align:middle;line-height:1}
.iv-q:hover{border-color:var(--accent);color:var(--accent);background:var(--panel)}
.iv{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);transform:translateX(102%);
  transition:transform .18s ease;background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;z-index:60;box-shadow:-8px 0 28px rgba(0,0,0,.10)}
.iv.on{transform:none}
body.iv-open .app{padding-right:min(456px,100vw)}
.iv-head{display:flex;align-items:center;gap:9px;padding:12px 15px;border-bottom:1px solid var(--line);background:var(--panel2)}
.iv-head .sp{flex:1}
.iv-sub{font-size:11.5px;color:var(--muted)}
.iv-tabs{display:flex;gap:2px;padding:8px 12px 0;border-bottom:1px solid var(--line)}
.iv-tab{padding:7px 13px;border:1px solid transparent;border-bottom:none;border-radius:7px 7px 0 0;
  background:none;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer}
.iv-tab.on{background:var(--panel);border-color:var(--line);color:var(--ink);margin-bottom:-1px}
.iv-badge{display:none;min-width:16px;padding:0 4px;margin-left:4px;border-radius:8px;
  background:var(--crit);color:#fff;font-size:10px;line-height:16px;font-weight:700;text-align:center}
.iv-body{flex:1;overflow-y:auto;padding:14px 15px;font-size:13px;line-height:1.55}
.iv-body p{margin:0 0 9px}
.iv-you{margin:12px 0 8px;padding:8px 12px;border-radius:12px 12px 3px 12px;background:var(--accent-bg);
  color:var(--accent);font-weight:560;align-self:flex-end;max-width:88%;margin-left:auto}
.iv-msg{margin:0 0 16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.iv-msg:last-child{border-bottom:none}
.iv-h{margin:0 0 7px;font-size:13.5px}
.iv-live{margin:0 0 10px;padding:9px 11px;border-radius:8px;background:var(--accent-bg);
  border:1px solid var(--accent-bg);font-size:12.5px;line-height:1.5}
.iv-ul{margin:0 0 9px;padding-left:17px}
.iv-ul li{margin:0 0 5px}
.iv-judge{margin:10px 0;padding:9px 11px;border-radius:8px;background:var(--warn-bg);
  border-left:3px solid var(--warn);font-size:12.5px;line-height:1.5}
.iv-cites{display:flex;flex-direction:column;gap:3px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}
.iv-cite{font-size:11.5px;color:var(--muted)}
.iv-cite b{color:var(--ink);font-weight:640}
.iv-reading{margin-bottom:12px}
.iv-reading+.iv-h{padding-top:11px;border-top:1px dashed var(--line)}
.iv-think{color:var(--muted);font-style:italic}
.iv-flag{margin-top:9px;padding:9px 11px;border-radius:8px;background:var(--crit-bg);
  border-left:3px solid var(--crit);font-size:12px;line-height:1.5}
.iv-flag code{padding:1px 4px;border-radius:3px;background:var(--panel);font-size:11.5px}
.iv-note{font-size:11.5px;color:var(--muted)}
.iv-warn{padding:8px 10px;border-radius:7px;background:var(--warn-bg);color:var(--warn);font-size:12.5px}
.iv-sugg,.iv-also{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.iv-s{padding:5px 10px;border:1px solid var(--line);border-radius:15px;background:var(--panel2);
  color:var(--ink);font-size:11.5px;cursor:pointer;text-align:left}
.iv-s:hover{border-color:var(--accent);color:var(--accent)}
.iv-gl{margin:0 0 10px}
.iv-gl dt{margin-top:9px;font-weight:660;font-size:13px}
.iv-gl dt span{font-weight:400;color:var(--muted);font-size:12px}
.iv-gl dd{margin:3px 0 0;padding-left:0;font-size:12.5px;line-height:1.55}
.iv-s.sm{padding:2px 8px;font-size:11px;margin-left:4px}
.iv-t{width:100%;border-collapse:collapse;margin:8px 0;font-size:12px}
.iv-t th{text-align:left;padding:5px 7px;border-bottom:1px solid var(--line);color:var(--muted);font-weight:600}
.iv-t td{padding:5px 7px;border-bottom:1px solid var(--line)}
.iv-t .num{text-align:right;font-variant-numeric:tabular-nums}
.iv-t tr.od td{background:var(--crit-bg)}
.iv-foot{display:flex;gap:8px;padding:11px 14px;border-top:1px solid var(--line);background:var(--panel2)}
.iv-foot textarea{flex:1;resize:none;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);color:var(--ink);font:inherit;font-size:12.5px;max-height:110px}
.iv-tsec{margin:14px 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.iv-tsec:first-child{margin-top:0}
.iv-task{margin-bottom:9px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.iv-task.p1{border-left:3px solid var(--crit)}
.iv-task.p2{border-left:3px solid var(--warn)}
.iv-task.is-done{opacity:.55}
.iv-tt{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:5px}
.iv-th{font-weight:620;font-size:12.5px;line-height:1.4}
.iv-tb{margin-top:4px;font-size:11.5px;color:var(--muted);line-height:1.5}
.iv-ta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.iv-add{display:flex;gap:6px;margin-bottom:10px}
.iv-add input{flex:1;min-width:0;padding:6px 9px;border:1px solid var(--line);border-radius:7px;
  background:var(--panel);color:var(--ink);font:inherit;font-size:12px}
.iv-add input[type=date]{flex:0 0 128px}
@media(max-width:900px){body.iv-open .app{padding-right:0}.iv{width:100vw}}

<script>
// ===========================================================================
// TAX ENGINE — ported from src/lib/tax. Rates are dated rows, never constants.
// ===========================================================================
const CT_RATES={sprRate:.19,mainRate:.25,lower:5e4,upper:25e4,frac:3/200,qip:15e5};
const NIC={lel:6708,pt:12570,st:5000,uel:50270,eeMain:.08,eeUpper:.02,erRate:.15,ea:10500};
// Income tax by TAX YEAR. A prior-year summary must compute on that year's
// rates — dividend rates rose 2pp on 6 April 2026, the additional-rate
// threshold fell to £125,140 in 2023-24, the dividend allowance stepped
// £2,000 → £1,000 → £500, the CGT annual exempt amount £12,300 → £6,000 →
// £3,000, and HICBC moved from £50k/1% per £100 to £60k/1% per £200.
const B=(a,b)=>[[37700,a],[b,.40],[null,.45]];
const IT_YEARS={
  '2022-23':{pa:12570,paTaperFrom:1e5,brLimit:37700,hrLimit:150000,
    nonSavings:[[37700,.20],[150000,.40],[null,.45]],
    property:[[37700,.20],[150000,.40],[null,.45]],
    savings:[[37700,.20],[150000,.40],[null,.45]],
    dividend:[[37700,.0875],[150000,.3375],[null,.3935]],
    divAllow:2000,psaBasic:1000,psaHigher:500,srSavings:5000,s24:.20,
    hicbcLo:5e4,hicbcStep:100,isa:2e4,aea:12300},
  '2023-24':{pa:12570,paTaperFrom:1e5,brLimit:37700,hrLimit:125140,
    nonSavings:B(.20,125140),property:B(.20,125140),savings:B(.20,125140),
    dividend:[[37700,.0875],[125140,.3375],[null,.3935]],
    divAllow:1000,psaBasic:1000,psaHigher:500,srSavings:5000,s24:.20,
    hicbcLo:5e4,hicbcStep:100,isa:2e4,aea:6000},
  '2024-25':{pa:12570,paTaperFrom:1e5,brLimit:37700,hrLimit:125140,
    nonSavings:B(.20,125140),property:B(.20,125140),savings:B(.20,125140),
    dividend:[[37700,.0875],[125140,.3375],[null,.3935]],
    divAllow:500,psaBasic:1000,psaHigher:500,srSavings:5000,s24:.20,
    hicbcLo:6e4,hicbcStep:200,isa:2e4,aea:3000},
  '2025-26':{pa:12570,paTaperFrom:1e5,brLimit:37700,hrLimit:125140,
    nonSavings:B(.20,125140),property:B(.20,125140),savings:B(.20,125140),
    dividend:[[37700,.0875],[125140,.3375],[null,.3935]],
    divAllow:500,psaBasic:1000,psaHigher:500,srSavings:5000,s24:.20,
    hicbcLo:6e4,hicbcStep:200,isa:2e4,aea:3000},
  '2026-27':{pa:12570,paTaperFrom:1e5,brLimit:37700,hrLimit:125140,
    nonSavings:B(.20,125140),property:B(.20,125140),savings:B(.20,125140),
    dividend:[[37700,.1075],[125140,.3575],[null,.3935]],
    divAllow:500,psaBasic:1000,psaHigher:500,srSavings:5000,s24:.20,
    hicbcLo:6e4,hicbcStep:200,isa:2e4,aea:3000},
  // Announced: property and savings income +2pp from 6 April 2027. The s.24
  // reducer stays at the BASIC rate, so the gap widens — deliberate, not a bug.
  '2027-28':{pa:12570,paTaperFrom:1e5,brLimit:37700,hrLimit:125140,
    nonSavings:B(.20,125140),
    property:[[37700,.22],[125140,.42],[null,.47]],
    savings:[[37700,.22],[125140,.42],[null,.47]],
    dividend:[[37700,.1075],[125140,.3575],[null,.3935]],
    divAllow:500,psaBasic:1000,psaHigher:500,srSavings:5000,s24:.20,
    hicbcLo:6e4,hicbcStep:200,isa:2e4,aea:3000}
};
const TAX_YEARS=Object.keys(IT_YEARS);
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const itFor=ty=>IT_YEARS[ty]||IT_YEARS['2026-27'];

// --- Tax year helpers ------------------------------------------------------
const tyStartYear=ty=>+String(ty).slice(0,4);
const tyStart=ty=>new Date(Date.UTC(tyStartYear(ty),3,6));
const tyEnd=ty=>new Date(Date.UTC(tyStartYear(ty)+1,3,5));
const tyLabel=ty=>String(ty).replace('-','/');
function tyOfDate(d){const y=d.getUTCFullYear();
  return d.getTime()>=Date.UTC(y,3,6)
    ? `${y}-${String((y+1)%100).padStart(2,'0')}`
    : `${y-1}-${String(y%100).padStart(2,'0')}`;}
// The Self Assessment cycle for a tax year ending 5 April Y:
//   POA 1  31 January Y   (during the tax year)
//   POA 2  31 July Y      (after it ends)
//   Return + balancing payment  31 January Y+1
function saDates(ty){const Y=tyStartYear(ty)+1;
  return{poa1:new Date(Date.UTC(Y,0,31)),poa2:new Date(Date.UTC(Y,6,31)),
    filing:new Date(Date.UTC(Y+1,0,31)),balancing:new Date(Date.UTC(Y+1,0,31))};}

// --- Accounting periods ----------------------------------------------------
// A company's axis is its accounting period, not the tax year. The most recent
// entry is the period currently in progress — it has started but not ended.
function periodsFor(e,count){
  const n=count||S.yearsShown||5, now=asAt(), out=[];
  for(let y=now.getUTCFullYear()+1;out.length<n&&y>now.getUTCFullYear()-20;y--){
    const end=new Date(Date.UTC(y,(+e.yeMonth||3)-1,+e.yeDay||31));
    const start=addMonths(end,-12); start.setUTCDate(start.getUTCDate()+1);
    if(start<=now)out.push({start,end,key:iso(end),
      label:'Y/E '+fmtD(end),inProgress:end>now});
  }
  return out.reverse();
}
// Which accounting period an obligation belongs to. Dated obligations go by
// their period end; undated ones (the confirmation statement) by due date.
// The toggle plus a count of what it is hiding — a filter that silently
// swallowed everything would be worse than no filter.
function hideToggle(id,hiddenCount,noun){
  return `<label class="chk hidetog" title="Hide ${noun}s you have ticked closed">
    <input type="checkbox" data-hideclosed="${id}" ${hidesClosed(id)?'checked':''}>
    Hide closed</label>${hiddenCount?`<span class="mini">${hiddenCount} hidden</span>`:''}`;
}
const inPeriod=(o,p)=>o.periodEnd
  ? (o.periodEnd>=p.start&&o.periodEnd<=p.end)
  : (o.dueDate>=p.start&&o.dueDate<=p.end);
const VAT_THRESHOLD=90000, VAT_DEREG=88000;

const r2=n=>Math.round(n*100)/100;
const D=86400000;
const iso=d=>d.toISOString().slice(0,10);
const parseD=s=>{const [y,m,dd]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,dd));};
const fmtD=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
const money=n=>'£'+Math.round(n).toLocaleString('en-GB');
const money2=n=>'£'+n.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const addMonths=(d,m)=>{const x=new Date(d.getTime());x.setUTCMonth(x.getUTCMonth()+m);return x;};

// --- Corporation tax: MR = F x (U - A) x (N / A) ---------------------------
function computeCT({start,end,profit,distributions=0,divisor=1,cihc=false}){
  const N=profit, A=profit+distributions, W=[];
  const days=Math.round((end-start)/D)+1;
  const pro=days>=365?1:days/365;
  const lower=r2(CT_RATES.lower/divisor*pro), upper=r2(CT_RATES.upper/divisor*pro);
  const qip=r2(CT_RATES.qip/divisor*pro);
  W.push(`Taxable total profits (N) ${money(N)}; augmented profits (A) ${money(A)}.`);
  W.push(`Limits divided by ${divisor} for associated companies (CTM03935)${pro<1?`, prorated ${days}/365`:''}: lower ${money(lower)}, upper ${money(upper)}.`);
  let rate,mainTax=r2(N*CT_RATES.mainRate),mr=0,due;
  if(cihc){rate='main';due=mainTax;
    W.push(`Close investment-holding company (CTA 2010 s.34): small profits rate denied, main rate on all profits.`);}
  else if(A<=lower){rate='spr';due=r2(N*CT_RATES.sprRate);
    W.push(`Augmented profits do not exceed the lower limit, so the small profits rate of 19% applies: ${money(due)}.`);}
  else if(A>=upper){rate='main';due=mainTax;
    W.push(`Augmented profits reach the upper limit, so the main rate of 25% applies with no marginal relief: ${money(due)}.`);}
  else{rate='marginal';mr=r2(CT_RATES.frac*(upper-A)*(N/A));due=r2(mainTax-mr);
    W.push(`Marginal relief = F x (U - A) x (N / A) = (3/200) x (${money(upper)} - ${money(A)}) x (${N.toLocaleString()} / ${A.toLocaleString()}) = ${money2(mr)}.`);
    W.push(`Tax at main rate ${money(mainTax)} less marginal relief ${money2(mr)} = ${money2(due)}.`);}
  const qipApplies=A>qip;
  if(qipApplies)W.push(`Quarterly instalments apply: augmented profits exceed the divided threshold of ${money(qip)}.`);
  return{N,A,lower,upper,days,rate,mainTax,mr,due,eff:N?r2(due/N*10000)/10000:0,qip,qipApplies,W};
}
const ctPaymentDue=e=>{const d=addMonths(e,9);d.setUTCDate(d.getUTCDate()+1);return d;};
const ct600Due=e=>{const d=new Date(e.getTime());d.setUTCFullYear(d.getUTCFullYear()+1);return d;};
// VAT: periods end on a month end, so "1 month and 7 days" is the 7th of the SECOND month.
const vatDue=pe=>new Date(Date.UTC(pe.getUTCFullYear(),pe.getUTCMonth()+2,7));

// --- Employment Allowance: heads above the ST, not directorships -----------
function assessEA(people){
  const above=people.filter(p=>+p.pay>NIC.st);
  const paidBelow=people.filter(p=>+p.pay>0&&+p.pay<=NIC.st);
  const warn=[];
  if(above.length===1&&paidBelow.length)
    warn.push(`A second person is paid but below the £${NIC.st.toLocaleString()} secondary threshold. HMRC (NIM06545) treat this as ineligible. Pay them above it and the question disappears.`);
  if(!above.length)return{ok:false,heads:0,amount:0,warn,
    why:'Nobody is paid above the secondary threshold, so there is no secondary Class 1 liability.'};
  if(above.length===1){
    const only=above[0];
    if(only.director)return{ok:false,heads:1,amount:0,warn,
      why:`Excluded: the only person paid above the secondary threshold (${only.name}) is a director — NICA 2014 s.2(4A), NIM06545. HMRC's test counts heads paid above the threshold, not directorships.`};
    return{ok:true,heads:1,amount:NIC.ea,warn,
      why:`Eligible: the only person above the threshold (${only.name}) is not a director, so s.2(4A) does not apply.`};
  }
  return{ok:true,heads:above.length,amount:NIC.ea,warn,
    why:`Eligible: ${above.length} people are paid above the annual secondary threshold of £${NIC.st.toLocaleString()}.`};
}
function annualNIC(pay){
  const main=Math.max(0,Math.min(pay,NIC.uel)-NIC.pt), up=Math.max(0,pay-NIC.uel);
  return{ee:r2(main*NIC.eeMain+up*NIC.eeUpper),er:r2(Math.max(0,pay-NIC.st)*NIC.erRate)};
}

// --- Income tax: four rate sets ordered non-savings, property, savings, div -
function taxSlice(amount,used,bands){let rem=amount,pos=used,tax=0;const det=[];
  for(const [cap,rate] of bands){if(rem<=0)break;const ceil=cap===null?Infinity:cap;
    if(pos>=ceil)continue;const room=ceil-pos,inB=Math.min(rem,room);
    if(inB>0){tax+=inB*rate;det.push(`${money(inB)} at ${(rate*100).toFixed(2)}%`);pos+=inB;rem-=inB;}}
  return{tax:r2(tax),used:pos,det};}

function computeIT(inc,ty){
  const IT=itFor(ty||'2026-27');
  const W=[];
  const emp=+inc.employment||0, se=+inc.selfEmployment||0, pen=+inc.pension||0;
  const prop=+inc.property||0, sav=+inc.savings||0, div=+inc.dividends||0;
  const fin=+inc.financeCosts||0, pc=+inc.pensionContribs||0, ga=+inc.giftAid||0;
  const nonSav=emp+se+pen, total=nonSav+prop+sav+div;
  const ani=Math.max(0,total-pc-ga);
  const excess=Math.max(0,ani-IT.paTaperFrom);
  const lost=Math.min(IT.pa,excess/2), pa=r2(IT.pa-lost);
  if(lost>0)W.push(`Personal allowance tapered: adjusted net income ${money(ani)} exceeds £100,000 by ${money(excess)}, so ${money(lost)} of allowance is lost, leaving ${money(pa)}. This is the 60% effective band.`);
  let rem=pa; const use=a=>{const u=Math.min(a,rem);rem-=u;return a-u;};
  const tNon=use(nonSav), tProp=use(prop), tSavG=use(sav), tDivG=use(div);
  let used=0;
  const a=taxSlice(tNon,used,IT.nonSavings);used=a.used;
  if(tNon>0)W.push(`Non-savings income: ${a.det.join(', ')}.`);
  const b=taxSlice(tProp,used,IT.property);used=b.used;
  if(tProp>0)W.push(`Property income: ${b.det.join(', ')}.`);
  const psa=used>IT.hrLimit?0:used>IT.brLimit?IT.psaHigher:IT.psaBasic;
  const srRoom=Math.max(0,IT.srSavings-Math.max(0,tNon+tProp));
  const sav0=Math.min(tSavG,srRoom+psa); used+=sav0;
  const c=taxSlice(Math.max(0,tSavG-sav0),used,IT.savings);used=c.used;
  if(tSavG>0)W.push(`Savings: ${money(sav0)} at 0% (starting-rate room ${money(srRoom)} plus PSA ${money(psa)})${c.det.length?', then '+c.det.join(', '):''}.`);
  const dAll=Math.min(tDivG,IT.divAllow); used+=dAll;
  const d=taxSlice(tDivG-dAll,used,IT.dividend);
  if(tDivG>0)W.push(`Dividends: ${money(dAll)} covered by the dividend allowance${d.det.length?', then '+d.det.join(', '):''}. ${IT.dividend[0][1]===.1075?' Ordinary and upper rates rose 2pp on 6 April 2026.':''}`);
  const ati=Math.max(0,total-pa-sav-div);
  const reducer=r2(Math.min(fin,Math.max(0,prop),ati)*IT.s24);
  if(fin>0)W.push(`Finance cost reducer (s.24): 20% of the lowest of finance costs ${money(fin)}, property profits ${money(prop)} and adjusted total income ${money(ati)} = ${money(reducer)}. Reduces tax, not income.`);
  const gross=a.tax+b.tax+c.tax+d.tax;
  const totalTax=r2(Math.max(0,gross-reducer));
  let hicbc=0;
  if(inc.childBenefit>0&&ani>IT.hicbcLo){
    const pct=Math.min(1,Math.floor((ani-IT.hicbcLo)/IT.hicbcStep)/100);
    hicbc=r2(+inc.childBenefit*pct);
    W.push(`High Income Child Benefit Charge: ${(pct*100).toFixed(0)}% of ${money(+inc.childBenefit)} = ${money(hicbc)}.`);
  }
  const out={total:r2(total),ani:r2(ani),pa,lost:r2(lost),
    byCat:{nonSavings:a.tax,property:b.tax,savings:c.tax,dividends:d.tax},
    reducer,tax:totalTax,hicbc,due:r2(totalTax+hicbc),W};
  // Effective marginal rate on the next £100 of employment income. Recursion is
  // bounded by the _bare flag, so the bumped run never bumps again.
  if(!inc._bare){
    const bumped=computeIT({...inc,employment:(+inc.employment||0)+100,_bare:1},ty);
    out.marginal=Math.round((bumped.due-out.due));
  }
  return out;
}

// --- Obligation generation -------------------------------------------------
function genObligations(e,from,to){
  const out=[],within=d=>d>=from&&d<=to;
  const push=o=>{if(within(o.dueDate))out.push({...o,entityId:e.id,entityName:e.name});};
  if(e.type==='company'){
    const dormant=e.status==='dormant';
    for(let y=from.getUTCFullYear()-1;y<=to.getUTCFullYear()+1;y++){
      const pe=new Date(Date.UTC(y,(+e.yeMonth||3)-1,+e.yeDay||31));
      const ps=addMonths(pe,-12); ps.setUTCDate(ps.getUTCDate()+1);
      push({taxType:'ACCOUNTS',kind:'filing',periodStart:ps,periodEnd:pe,dueDate:addMonths(pe,9),
        desc:dormant?'Dormant accounts (AA02) to Companies House':'Annual accounts to Companies House',
        cite:'CA 2006 s.442'});
      if(!dormant){
        push({taxType:'CT',kind:'payment',periodStart:ps,periodEnd:pe,dueDate:ctPaymentDue(pe),
          desc:'Corporation Tax payment',cite:'9 months and 1 day after the period end'});
        push({taxType:'CT',kind:'filing',periodStart:ps,periodEnd:pe,dueDate:ct600Due(pe),
          desc:'CT600 Company Tax Return',cite:'FA 1998 Sch 18'});
      }
    }
    if(e.csDue){let due=parseD(e.csDue);
      for(let i=0;i<3;i++){push({taxType:'CS',kind:'filing',dueDate:new Date(due.getTime()),
        desc:'Confirmation statement to Companies House',
        cite:'CA 2006 s.853A — 14 days. Required regardless of dormancy; missing it is a criminal offence and the most common trigger for strike-off.'});
        due=addMonths(due,12);}}
    if(e.vat&&e.vatStagger){
      for(let y=from.getUTCFullYear();y<=to.getUTCFullYear()+1;y++)
        for(let q=0;q<4;q++){
          const idx=(+e.vatStagger-1+q*3), m=(idx%12)+1, yo=Math.floor(idx/12);
          const qe=new Date(Date.UTC(y+yo,m,0));
          const qs=addMonths(qe,-3); qs.setUTCDate(qs.getUTCDate()+1);
          push({taxType:'VAT',kind:'filing',periodStart:qs,periodEnd:qe,dueDate:vatDue(qe),
            desc:'VAT return and payment',cite:'One calendar month and 7 days after the period end'});
        }
    }
    if(e.payroll&&!dormant){
      for(let y=from.getUTCFullYear();y<=to.getUTCFullYear()+1;y++)
        for(let m=1;m<=12;m++){
          const pm=new Date(Date.UTC(y,m-1,5)), due=new Date(Date.UTC(y,m-1,22));
          push({taxType:'PAYE',kind:'payment',periodEnd:pm,dueDate:due,
            desc:'PAYE/NIC monthly payment',cite:'22nd of the following tax month, electronically'});
        }
    }
    if(e.withinChargeOn) push({taxType:'CT_NOTIF',kind:'submission',dueDate:addMonths(parseD(e.withinChargeOn),3),
      desc:'Notify HMRC the company is within the charge to Corporation Tax',
      cite:'FA 2004 s.55 — 3 months from the START of the accounting period, not the year end'});
  } else {
    if(e.selfAssessment!==false){
      for(let y=from.getUTCFullYear()-1;y<=to.getUTCFullYear()+1;y++){
        const filing=new Date(Date.UTC(y,0,31));
        const tys=new Date(Date.UTC(y-2,3,6)), tye=new Date(Date.UTC(y-1,3,5));
        push({taxType:'SA',kind:'filing',periodStart:tys,periodEnd:tye,dueDate:filing,
          desc:`Self Assessment return ${y-2}/${String((y-1)%100).padStart(2,'0')}`,
          cite:'31 January following the end of the tax year'});
        push({taxType:'SA',kind:'payment',periodStart:tys,periodEnd:tye,dueDate:filing,
          desc:e.poa?'Balancing payment and first payment on account':'Balancing payment'});
        if(e.poa)push({taxType:'SA',kind:'payment',dueDate:new Date(Date.UTC(y,6,31)),
          desc:'Second payment on account',
          cite:'50% of the prior year liability unless under £1,000 or 80%+ taxed at source'});
      }
    }
  }
  return out.sort((a,b)=>a.dueDate-b.dueDate);
}

// ===========================================================================
// STATE
// ===========================================================================
const NEW_ID=()=>'x'+Math.random().toString(36).slice(2,10);
let S={asAt:iso(new Date()),entities:[],payments:[],returns:[],liabilities:[],
  filings:{},computations:{},ivor:{tasks:{},manual:[]},pay:{},propFigures:{},
  income:{},properties:[],people:{},notes:{},yearClosed:{},yearsShown:5};
let db=null,activeTab='overview',activeSub={},activeYear={},activePayYear={},activePropYear={},activeNote={},showAllNotes={},dirty=false;

// Income is keyed entityId|taxYear. Earlier builds keyed it on entityId alone;
// migrate those into the tax year that was current when they were entered.
function migrateState(){
  S.yearClosed=S.yearClosed||{};
  S.returns=S.returns||[];
  S.liabilities=S.liabilities||[];
  S.ivor=S.ivor||{};
  S.ivor.tasks=S.ivor.tasks||{};
  S.ivor.manual=S.ivor.manual||[];
  S.pay=S.pay||{};
  S.propFigures=S.propFigures||{};
  // Payroll and property figures used to sit on the durable record, so a single
  // entry applied to every year. Move what is already there into the CURRENT
  // tax year — the year it was almost certainly entered for — and flag it on
  // screen rather than silently relocating someone's data.
  const curTy=tyOfDate(S.asAt?parseD(S.asAt):new Date());
  for(const eid of Object.keys(S.people||{})){
    for(const p of S.people[eid]||[]){
      if(p.pay!==undefined&&p.pay!==null&&p.pay!==''){
        if(S.pay[ykey(p.id,curTy)]===undefined){
          S.pay[ykey(p.id,curTy)]=+p.pay;
          S.migratedYear=curTy;
        }
        delete p.pay;
      }
    }
  }
  for(const pr of (S.properties||[])){
    if(pr.rent!==undefined||pr.expenses!==undefined||pr.finance!==undefined){
      const k=ykey(pr.id,curTy);
      if(S.propFigures[k]===undefined){
        S.propFigures[k]={rent:pr.rent??'',expenses:pr.expenses??'',finance:pr.finance??''};
        S.migratedYear=curTy;
      }
      delete pr.rent; delete pr.expenses; delete pr.finance;
    }
  }
  // Payments predating the ledger carry no allocation. They are real money and
  // are kept as such — they sit as credit on account until you allocate them,
  // which is honest: nothing here knows which debt they were meant to settle.
  for(const p of (S.payments||[])){
    if(!Array.isArray(p.allocs))p.allocs=[];
    if(!p.direction)p.direction='to_hmrc';
  }
  // "Marked filed" was a tick carrying no amount. Carry each one into a real
  // return record, flagged as declaring nothing, so it prompts for the figure
  // rather than silently charging zero.
  ledgerInvalidate();
  for(const [key,st] of Object.entries(S.filings||{})){
    if(st!=='filed'&&st!=='paid')continue;
    const [entityId,taxType,kind,due]=key.split('|');
    if(DECLARING[taxType]!==kind)continue;
    const e=S.entities.find(x=>x.id===entityId); if(!e)continue;
    const slot=returnSlots(e).find(x=>x.taxType===taxType&&iso(x.fileBy)===due);
    if(!slot)continue;
    if(storedReturn(entityId,taxType,slot.periodKey))continue;
    S.returns.push({id:NEW_ID(),entityId,taxType,periodKey:slot.periodKey,
      status:'filed',declared:null,filedOn:due,reference:'',migrated:true});
  }
  ledgerInvalidate();
  S.hideClosed=S.hideClosed||{};
  S.yearsShown=S.yearsShown||5;
  // Notes were a single free-text box per entity/period. Carry anything already
  // typed into a real note record rather than dropping it.
  S.notesList=S.notesList||[];
  for(const k of Object.keys(S.notes||{})){
    const txt=(S.notes[k]||'').trim(); if(!txt)continue;
    const [entityId,periodKey]=k.split('|');
    if(S.notesList.some(n=>n.migratedFrom===k))continue;
    S.notesList.push({id:NEW_ID(),entityId,periodKey:periodKey||'',category:'workings',
      title:'Imported note',date:S.asAt,body:txt,migratedFrom:k,
      createdAt:new Date().toISOString()});
  }
  S.notes={};
  const cur=tyOfDate(S.asAt?parseD(S.asAt):new Date());
  for(const k of Object.keys(S.income||{})){
    if(k.includes('|'))continue;
    S.income[k+'|'+cur]=S.income[k];
    delete S.income[k];
  }
}
const ykey=(id,ty)=>id+'|'+ty;

// --- Per-year figures ------------------------------------------------------
// A person and a property are DURABLE; what they were paid, or earned, in a
// given year is not. Holding the figure on the durable record meant one entry
// applied to every year at once — which is wrong in the same way a rate table
// without dates is wrong, and wrong in a way you only notice after you have
// entered a year of data.
//
// Payroll keys on the TAX YEAR, not the accounting period: the NIC thresholds,
// the secondary threshold test and the Employment Allowance all run 6 April to
// 5 April regardless of when the company's year ends.
const payFor=(personId,ty)=>{
  const v=(S.pay||{})[ykey(personId,ty)];
  return v==null||v===''?null:+v;
};
// The roster for a year, with the year's pay attached. `recorded` distinguishes
// "paid nothing" from "nothing entered yet" — they mean different things for
// the Employment Allowance.
function peopleIn(entityId,ty){
  return (S.people[entityId]||[]).map(p=>{
    const v=payFor(p.id,ty);
    return {...p,pay:v==null?0:v,recorded:v!=null};
  });
}
const anyPayRecorded=(entityId,ty)=>(S.people[entityId]||[]).some(p=>payFor(p.id,ty)!=null);
function propFig(propId,ty){
  return (S.propFigures||{})[ykey(propId,ty)]||{rent:'',expenses:'',finance:''};
}
const propsOf=entityId=>(S.properties||[]).filter(p=>p.entityId===entityId);
const anyPropRecorded=(entityId,ty)=>propsOf(entityId)
  .some(p=>{const f=propFig(p.id,ty);return f.rent!==''||f.expenses!==''||f.finance!=='';});

// Which tax years an accounting period touches, and which one holds most of it.
// A 31 December year end straddles two tax years fairly evenly, so the PAYE tab
// offers both rather than guessing.
function taxYearsInPeriod(P){
  return TAX_YEARS.filter(ty=>tyEnd(ty)>=P.start&&tyStart(ty)<=P.end);
}
function dominantTaxYear(P){
  let best=null,bestDays=-1;
  for(const ty of taxYearsInPeriod(P)){
    const days=(Math.min(tyEnd(ty),P.end)-Math.max(tyStart(ty),P.start))/D;
    if(days>bestDays){bestDays=days;best=ty;}
  }
  return best||tyOfDate(asAt());
}
const isYearClosed=(id,ty)=>!!S.yearClosed[ykey(id,ty)]?.closed;
// Per-entity: hide closed periods from the tab strip. Kept per entity because
// one company may be years behind while another is fully tidied up.
const hidesClosed=id=>!!(S.hideClosed||{})[id];
function incomeFor(id,ty){return S.income[ykey(id,ty)]||{};}
// Tax years offered for an individual: the current one and the previous N.
function yearsFor(){
  const cur=tyOfDate(asAt());
  const all=TAX_YEARS.filter(t=>tyStartYear(t)<=tyStartYear(cur));
  return all.slice(-Math.max(1,Math.min(S.yearsShown,all.length)));
}

// --- Persistence -----------------------------------------------------------

// ===========================================================================
// DERIVED
// ===========================================================================
const asAt=()=>parseD(S.asAt);
const ent=id=>S.entities.find(e=>e.id===id);
const daysTo=d=>Math.ceil((d-asAt())/D);

// Lookback is deliberately short. Obligations from before the portal existed
// cannot be known to be unpaid, and surfacing a year of them as "overdue" on a
// fresh install is noise that trains you to ignore the flags.
const LOOKBACK_DAYS=90;
function obligationsFor(e,months=24){
  const from=new Date(asAt().getTime()-LOOKBACK_DAYS*D);
  const to=addMonths(asAt(),months);
  return genObligations(e,from,to).map(o=>{
    const key=`${o.entityId}|${o.taxType}|${o.kind}|${iso(o.dueDate)}`;
    return {...o,key,status:obStatus(o,key)};
  });
}
function allObligations(){return S.entities.flatMap(e=>obligationsFor(e));}
// Unclamped generation for a specific window — used by the period views, where
// the 90-day dashboard lookback would silently drop the earlier months of a
// period and make "12 months of PAYE" read as 10.
function obligationsIn(e,from,to){
  return genObligations(e,from,to).map(o=>{
    const key=`${o.entityId}|${o.taxType}|${o.kind}|${iso(o.dueDate)}`;
    return {...o,key,status:obStatus(o,key)};
  });
}


function nextPayable(entityId,taxType){
  const e=ent(entityId); if(!e)return null;
  const now=asAt();
  const list=obligationsFor(e).filter(o=>o.taxType===taxType&&o.kind!=='filing'&&
    o.status!=='paid'&&o.status!=='filed');
  const overdue=list.filter(o=>o.dueDate<now).sort((a,b)=>a.dueDate-b.dueDate);
  if(overdue.length)return overdue[0];
  return list.filter(o=>o.dueDate>=now).sort((a,b)=>a.dueDate-b.dueDate)[0]||null;
}
function nextFiling(entityId,taxType){
  const e=ent(entityId); if(!e)return null;
  const now=asAt();
  const list=obligationsFor(e).filter(o=>o.taxType===taxType&&o.kind==='filing'&&o.status!=='filed');
  const overdue=list.filter(o=>o.dueDate<now).sort((a,b)=>a.dueDate-b.dueDate);
  if(overdue.length)return overdue[0];
  return list.filter(o=>o.dueDate>=now).sort((a,b)=>a.dueDate-b.dueDate)[0]||null;
}

// Amount owing for an obligation, where the portal can compute it.
function amountFor(o){
  if(o.taxType==='CT'&&o.periodEnd){
    const c=S.computations[o.entityId+'|'+iso(o.periodEnd)];
    if(c) return computeCT({start:o.periodStart,end:o.periodEnd,profit:+c.profit||0,
      distributions:+c.distributions||0,divisor:associationDivisor(o.entityId),
      cihc:!!ent(o.entityId)?.cihc}).due;
  }
  if(o.taxType==='PAYE'){
    // The tax month this obligation covers decides which year's payroll applies.
    const ty=tyOfDate(o.periodEnd||o.dueDate);
    const ppl=peopleIn(o.entityId,ty);
    if(ppl.length&&anyPayRecorded(o.entityId,ty)){
      const ea=assessEA(ppl);
      const yr=ppl.reduce((s,p)=>{const n=annualNIC(+p.pay||0);return s+n.ee+n.er;},0);
      const gross=Math.max(0,yr-(ea.ok?ea.amount:0));
      return r2(gross/12);
    }
  }
  if(o.taxType==='SA'&&o.periodEnd){
    const e=ent(o.entityId);
    const ty=tyOfDate(o.periodEnd);
    const inc=S.income[ykey(o.entityId,ty)];
    if(e&&inc){const r=computeIT(inc,ty);
      return o.desc.includes('Second payment')?r2(r.due/2):r.due;}
  }
  return null;
}

// ===========================================================================
// LEDGER — return, then liability, then payment
// ===========================================================================
// This models the real sequence. You REPORT first, and the report DECLARES the
// amount. A liability exists because a return declared it, or because statute
// charged it in advance of one (payments on account, quarterly instalments).
// Payments are then ALLOCATED to a named liability, and what is outstanding is
// arithmetic — liability less allocations — never a status somebody ticked.
// Until a return is filed the engine's figure is an ESTIMATE and is labelled
// as one: it informs, it is not a debt.

const RET_STATUS={not_started:'Not started',in_progress:'In progress',
  ready:'Ready to file',filed:'Filed'};
// Which taxes declare their liability by return, and on which obligation.
// PAYE declares monthly through RTI, so each tax month is its own return.
const DECLARING={CT:'filing',VAT:'filing',SA:'filing',PAYE:'payment'};

// Per-render caches. Liability derivation walks the obligation calendar, and
// obligation status reads back from the liabilities, so both get memoised or
// the dashboard rebuilds the same tables dozens of times.
let _slotCache=null,_liabCache=null;
function ledgerInvalidate(){_slotCache=null;_liabCache=null;}

const LEDGER_BACK=36, LEDGER_FWD=24;
function ledgerWindow(){return [addMonths(asAt(),-LEDGER_BACK),addMonths(asAt(),LEDGER_FWD)];}

function obPeriodKey(o){
  if(o.taxType==='SA')return o.periodEnd?tyOfDate(o.periodEnd):tyOfDate(o.dueDate);
  return iso(o.periodEnd||o.dueDate);
}
function slotLabel(t,o){
  if(t==='CT')return 'CT600 — period to '+fmtD(o.periodEnd);
  if(t==='VAT')return 'VAT return — quarter to '+fmtD(o.periodEnd);
  if(t==='PAYE')return 'RTI — tax month to '+fmtD(o.periodEnd);
  if(t==='SA')return 'Self Assessment return — '+tyLabel(obPeriodKey(o));
  return o.desc;
}
function shortPeriod(t,pk){
  if(t==='SA')return tyLabel(pk);
  const d=parseD(pk);
  if(t==='VAT')return 'Q/E '+fmtD(d);
  if(t==='PAYE')return 'Month to '+fmtD(d);
  return 'Y/E '+fmtD(d);
}

// Return slots are derived FROM the obligation calendar rather than restated,
// so a change to a statutory deadline cannot leave the two disagreeing.
function returnSlots(e){
  _slotCache=_slotCache||{};
  if(_slotCache[e.id])return _slotCache[e.id];
  const [from,to]=ledgerWindow();
  const out=[];
  for(const o of genObligations(e,from,to)){
    if(DECLARING[o.taxType]!==o.kind)continue;
    const pk=obPeriodKey(o);
    if(out.some(x=>x.taxType===o.taxType&&x.periodKey===pk))continue;
    const payBy=o.taxType==='CT'&&o.periodEnd?ctPaymentDue(o.periodEnd):o.dueDate;
    out.push({taxType:o.taxType,periodKey:pk,periodStart:o.periodStart,periodEnd:o.periodEnd,
      label:slotLabel(o.taxType,o),short:shortPeriod(o.taxType,pk),
      fileBy:o.taxType==='CT'&&o.periodEnd?ct600Due(o.periodEnd):o.dueDate,payBy});
  }
  out.sort((a,b)=>a.fileBy-b.fileBy);
  _slotCache[e.id]=out;
  return out;
}
function slotsFor(e,taxType){return returnSlots(e).filter(s=>s.taxType===taxType);}
// Slots whose period ENDS inside an accounting period. One rule covers all
// three shapes: CT's single period, VAT's four quarters, PAYE's twelve months.
function periodSlots(e,taxType,P){
  return slotsFor(e,taxType).filter(s=>s.periodEnd&&s.periodEnd>=P.start&&s.periodEnd<=P.end);
}
function slotAt(e,taxType,periodKey){
  return returnSlots(e).find(s=>s.taxType===taxType&&s.periodKey===periodKey)||null;
}

const storedReturn=(id,t,pk)=>(S.returns||[])
  .find(r=>r.entityId===id&&r.taxType===t&&r.periodKey===pk)||null;

// A slot plus whatever has been recorded against it. Stored records hold no
// dates of their own beyond filedOn, so nothing here can clobber the slot.
function returnFor(e,slot){
  const st=storedReturn(e.id,slot.taxType,slot.periodKey);
  const dec=st&&st.declared!=null&&st.declared!==''?+st.declared:null;
  return {...slot,rid:st?st.id:null,status:st?st.status:'not_started',
    declared:dec,filedOn:st?st.filedOn:null,reference:st?st.reference||'':'',
    note:st?st.note||'':'',
    // A return migrated from the old "mark filed" tick was never given an
    // amount. It is filed, but it declares nothing, so it charges nothing.
    amountMissing:!!(st&&st.status==='filed'&&dec==null)};
}
function returnsFor(e,taxType){return slotsFor(e,taxType).map(s=>returnFor(e,s));}
function latestReturn(e,taxType){
  const rs=returnsFor(e,taxType);
  const filed=rs.filter(r=>r.status==='filed');
  const open=rs.filter(r=>r.status!=='filed');
  // Slots run back three years so a historic return can still be filed, but a
  // deadline that passed before the portal existed cannot be known to have
  // been missed. Only the same 90-day lookback the calendar uses is counted.
  const floor=new Date(asAt().getTime()-LOOKBACK_DAYS*D);
  const live=open.filter(r=>r.fileBy>=floor);
  return {all:rs,filed:filed[filed.length-1]||null,
    next:live[0]||open.filter(r=>r.fileBy>=asAt())[0]||null,
    stale:open.filter(r=>r.fileBy<floor).length,
    outstandingCount:live.filter(r=>r.fileBy<asAt()).length};
}

// The engine's figure for a slot — an estimate until the return is filed.
function estimateFor(e,slot){
  if(slot.taxType==='CT'){
    const c=S.computations[e.id+'|'+slot.periodKey];
    if(!c||c.profit===''||c.profit==null)return null;
    return computeCT({start:slot.periodStart,end:slot.periodEnd,profit:+c.profit||0,
      distributions:+c.distributions||0,divisor:associationDivisor(e.id),cihc:!!e.cihc}).due;
  }
  if(slot.taxType==='PAYE'){
    const ty=tyOfDate(slot.periodEnd||slot.payBy);
    if(!anyPayRecorded(e.id,ty))return null;
    const ppl=peopleIn(e.id,ty); if(!ppl.length)return null;
    const ea=assessEA(ppl);
    const yr=ppl.reduce((s,p)=>{const n=annualNIC(+p.pay||0);return s+n.ee+n.er;},0);
    return r2(Math.max(0,yr-(ea.ok?ea.amount:0))/12);
  }
  if(slot.taxType==='SA'){
    const inc=S.income[ykey(e.id,slot.periodKey)];
    if(!inc)return null;
    return computeIT(inc,slot.periodKey).due;
  }
  return null; // VAT comes from the books, not from an engine here.
}

// --- Liabilities -----------------------------------------------------------
// Ids are deterministic, so re-derivation after a figure changes keeps every
// payment allocation pointing at the same debt.
const LID=(e,t,pk,k)=>'L:'+e+'|'+t+'|'+pk+'|'+k;

// Payments on account: TMA 1970 s.59A. Each is 50% of the PRECEDING year's
// declared liability and is due whether or not this year's return exists.
// Not required where the prior year was under £1,000 (the 80%-deducted-at-
// source test is the operator's call, carried on the entity's POA flag).
function saPOAs(e,ty){
  if(e.type!=='individual'||!e.poa)return [];
  const i=TAX_YEARS.indexOf(ty); if(i<1)return [];
  const prev=TAX_YEARS[i-1];
  const pr=storedReturn(e.id,'SA',prev);
  if(!pr||pr.status!=='filed'||pr.declared==null||pr.declared==='')return [];
  const base=+pr.declared;
  if(base<1000)return [];
  const half=r2(base/2), d=saDates(ty);
  const why=`50% of the ${tyLabel(prev)} liability of ${money(base)}`;
  return [
    {id:LID(e.id,'SA',ty,'poa1'),entityId:e.id,taxType:'SA',periodKey:ty,kind:'poa',
     label:'First payment on account '+tyLabel(ty),detail:why,amount:half,dueDate:d.poa1,auto:true},
    {id:LID(e.id,'SA',ty,'poa2'),entityId:e.id,taxType:'SA',periodKey:ty,kind:'poa',
     label:'Second payment on account '+tyLabel(ty),detail:why,amount:half,dueDate:d.poa2,auto:true}];
}

// Quarterly instalments: SI 1998/3175. Due 6 months and 13 days after the
// START of the period, then at 3-month intervals. These are charged on an
// ESTIMATE by design — the return comes long after the money.
function ctQIPs(e,slot){
  if(!slot.periodStart)return [];
  const c=S.computations[e.id+'|'+slot.periodKey];
  if(!c||c.profit===''||c.profit==null)return [];
  const R=computeCT({start:slot.periodStart,end:slot.periodEnd,profit:+c.profit||0,
    distributions:+c.distributions||0,divisor:associationDivisor(e.id),cihc:!!e.cihc});
  if(!R.qipApplies)return [];
  const q=r2(R.due/4),out=[];
  for(let i=0;i<4;i++){
    const d=addMonths(slot.periodStart,6+3*i); d.setUTCDate(d.getUTCDate()+13);
    out.push({id:LID(e.id,'CT',slot.periodKey,'qip'+(i+1)),entityId:e.id,taxType:'CT',
      periodKey:slot.periodKey,kind:'qip',
      label:`Corporation Tax instalment ${i+1} of 4`,
      detail:'Estimated — a quarter of '+money(R.due)+' on current figures',
      amount:q,dueDate:d,auto:true,estimated:true});
  }
  return out;
}

function buildLiabilities(e){
  const L=[];
  const poaSeen=new Set();
  for(const slot of returnSlots(e)){
    if(slot.taxType==='SA'&&!poaSeen.has(slot.periodKey)){
      poaSeen.add(slot.periodKey);
      L.push(...saPOAs(e,slot.periodKey));
    }
    const qips=slot.taxType==='CT'?ctQIPs(e,slot):[];
    L.push(...qips);
    const r=returnFor(e,slot);
    if(r.status!=='filed'||r.declared==null)continue;
    let amt=r.declared, label=TAX_LABEL[slot.taxType]+' declared', detail='';
    if(slot.taxType==='SA'){
      const poas=saPOAs(e,slot.periodKey).reduce((a,p)=>a+p.amount,0);
      amt=r2(r.declared-poas);
      label=poas?(amt>=0?'Balancing payment':'Overpaid — repayment due'):'Self Assessment declared';
      detail=poas?`Declared ${money(r.declared)} less payments on account ${money(poas)}`:'';
    }
    if(slot.taxType==='CT'&&qips.length){
      const q=qips.reduce((a,p)=>a+p.amount,0);
      amt=r2(r.declared-q);
      label=amt>=0?'Balance of Corporation Tax after instalments':'Instalments exceeded the declared liability';
      detail=`Declared ${money(r.declared)} less instalments ${money(q)}`;
    }
    if(Math.abs(amt)<0.005)continue;
    L.push({id:LID(e.id,slot.taxType,slot.periodKey,'charge'),entityId:e.id,
      taxType:slot.taxType,periodKey:slot.periodKey,kind:'charge',label,detail,
      amount:amt,dueDate:slot.payBy,auto:true,reference:r.reference});
  }
  // Interest, penalties, HMRC amendments and anything else charged outside a
  // return are entered by hand and live in state.
  for(const x of (S.liabilities||[]).filter(x=>x.entityId===e.id)){
    L.push({...x,amount:+x.amount||0,dueDate:parseD(x.dueDate),auto:false});
  }
  return L.sort((a,b)=>a.dueDate-b.dueDate);
}
function liabilitiesFor(e,taxType,periodKey){
  _liabCache=_liabCache||{};
  if(!_liabCache[e.id])_liabCache[e.id]=buildLiabilities(e);
  let L=_liabCache[e.id];
  if(taxType)L=L.filter(x=>x.taxType===taxType);
  if(periodKey)L=L.filter(x=>x.periodKey===periodKey);
  return L;
}
function liabilityById(id){
  for(const e of S.entities){const l=liabilitiesFor(e).find(x=>x.id===id);if(l)return l;}
  return null;
}

// --- Payments and allocation ----------------------------------------------
const payAllocs=p=>Array.isArray(p.allocs)?p.allocs:[];
const paySign=p=>p.direction==='from_hmrc'?-1:1;
function allocatedTo(liabId){
  let t=0;
  for(const p of S.payments)for(const a of payAllocs(p))
    if(a.liabilityId===liabId)t+=paySign(p)*(+a.amount||0);
  return r2(t);
}
const outstandingOf=l=>r2(l.amount-allocatedTo(l.id));
// Money paid over and above any named debt. HMRC holds it; it is real, and it
// is not the same thing as having nothing to pay.
function creditOnAccount(entityId,taxType){
  let t=0;
  for(const p of S.payments){
    if(p.entityId!==entityId)continue;
    if(taxType&&p.taxType!==taxType)continue;
    const alloc=payAllocs(p).reduce((a,b)=>a+(+b.amount||0),0);
    t+=paySign(p)*(r2((+p.amount||0)-alloc));
  }
  return r2(t);
}
function paymentsFor(entityId,taxType){
  return S.payments.filter(p=>p.entityId===entityId&&(!taxType||p.taxType===taxType))
    .sort((a,b)=>parseD(b.paidOn)-parseD(a.paidOn));
}
function lastPaid(entityId,taxType){
  return paymentsFor(entityId,taxType).filter(p=>p.direction!=='from_hmrc')[0]||null;
}

function taxAccount(e,taxType,periodKey){
  const L=liabilitiesFor(e,taxType,periodKey);
  const now=asAt();
  const charged=r2(L.reduce((a,l)=>a+l.amount,0));
  const allocated=r2(L.reduce((a,l)=>a+allocatedTo(l.id),0));
  const outstanding=r2(charged-allocated);
  const credit=periodKey?0:creditOnAccount(e.id,taxType);
  const open=L.filter(l=>outstandingOf(l)>0.005);
  const overdue=open.filter(l=>l.dueDate<now).sort((a,b)=>a.dueDate-b.dueDate);
  const upcoming=open.filter(l=>l.dueDate>=now).sort((a,b)=>a.dueDate-b.dueDate);
  return {liabs:L,charged,allocated,outstanding,credit,net:r2(outstanding-credit),
    open,overdue,upcoming,
    overdueAmt:r2(overdue.reduce((a,l)=>a+outstandingOf(l),0)),
    target:overdue[0]||upcoming[0]||null};
}

// Oldest debt first, which is how a payment with no instruction is applied.
function autoAllocate(entityId,taxType,amount,excludeId){
  const e=ent(entityId); if(!e)return [];
  const L=liabilitiesFor(e,taxType)
    .map(l=>({l,out:r2(l.amount-(()=>{let t=0;
      for(const p of S.payments){if(p.id===excludeId)continue;
        for(const a of payAllocs(p))if(a.liabilityId===l.id)t+=paySign(p)*(+a.amount||0);}
      return t;})())}))
    .filter(x=>x.out>0.005).sort((a,b)=>a.l.dueDate-b.l.dueDate);
  let rem=r2(+amount||0); const out=[];
  for(const x of L){
    if(rem<=0.005)break;
    const take=r2(Math.min(x.out,rem));
    out.push({liabilityId:x.l.id,amount:take});
    rem=r2(rem-take);
  }
  return out;
}

// --- Obligation status, read back from the ledger --------------------------
// A declaring obligation is filed when its RETURN says so. A payment
// obligation is paid when the liabilities falling due that day are cleared —
// not when somebody ticked a box next to it.
function obStatus(o,key){
  const e=ent(o.entityId);
  if(e&&DECLARING[o.taxType]===o.kind){
    const r=storedReturn(o.entityId,o.taxType,obPeriodKey(o));
    if(r)return r.status==='filed'?'filed':'open';
  }
  if(e&&o.kind==='payment'){
    const same=liabilitiesFor(e,o.taxType).filter(l=>iso(l.dueDate)===iso(o.dueDate));
    if(same.length)return same.every(l=>outstandingOf(l)<=0.005)?'paid':'open';
  }
  return S.filings[key]||'open';
}

// Association: the second company is disregarded under s.18E(3) unless it trades.
function associationDivisor(entityId){
  const e=ent(entityId); if(!e||e.type!=='company')return 1;
  const others=S.entities.filter(x=>x.type==='company'&&x.id!==entityId&&x.status==='trading');
  return 1+others.length;
}

// --- Nudges ----------------------------------------------------------------
function buildNudges(){
  const N=[],now=asAt();
  for(const o of allObligations()){
    if(o.status==='paid'||o.status==='filed')continue;
    const d=daysTo(o.dueDate);
    if(d>30)continue;
    const pr=d<0?1:d<=7?2:d<=14?3:4;
    N.push({p:pr,cat:o.kind==='payment'?'payment':'filing',entity:o.entityName,
      when:o.dueDate,
      title:`${o.desc} — ${d<0?Math.abs(d)+' days OVERDUE':d===0?'due today':'due in '+d+' days'}`,
      body:`${o.entityName}: due ${fmtD(o.dueDate)}.${o.cite?' '+o.cite:''}`});
  }
  // Employment Allowance, while the year is still open
  for(const e of S.entities.filter(x=>x.type==='company'&&x.payroll)){
    const nty=tyOfDate(now);
    const ppl=peopleIn(e.id,nty); if(!ppl.length||!anyPayRecorded(e.id,nty))continue;
    const ea=assessEA(ppl); if(ea.ok)continue;
    const tyEnd=new Date(Date.UTC(now.getUTCMonth()>=3?now.getUTCFullYear()+1:now.getUTCFullYear(),3,5));
    const left=daysTo(tyEnd);
    N.push({p:left<=60?1:left<=120?2:3,cat:'planning',entity:e.name,when:tyEnd,
      title:`${e.name} is not on track to claim the ${money(NIC.ea)} Employment Allowance`,
      body:`${ea.why} Paying a second person above ${money(NIC.st)} before ${fmtD(tyEnd)} secures the allowance for the whole tax year — ${left} days remain. Connected companies share ONE allowance (NICA 2014 s.3).`});
  }
  // Any activity in a company recorded as dormant
  for(const e of S.entities.filter(x=>x.type==='company'&&x.status==='dormant')){
    if(paymentsFor(e.id).length||S.computations[e.id+'|activity']){
      N.push({p:2,cat:'structural',entity:e.name,
        title:`Activity recorded in ${e.name} — check the s.18E position`,
        body:`If this amounts to carrying on a trade or business, the CTA 2010 s.18E(3) disregard is lost and the trading company's limits halve for the WHOLE accounting period — no apportionment (CTM03956). Bank interest alone is not a business (Jowett).`});
    }
  }
  // Correspondence with a response deadline, and planning items due review.
  // A letter that requires an answer is an obligation, so it belongs on the
  // dashboard next to the filing deadlines rather than buried in an entity.
  for(const n of S.notesList||[]){
    if(!n.responseDue||n.resolved)continue;
    const e=ent(n.entityId); if(!e)continue;
    // A closed period is finished business — it must not keep nudging.
    if(n.periodKey&&isYearClosed(n.entityId,n.periodKey))continue;
    const due=parseD(n.responseDue), d=daysTo(due);
    if(d>30)continue;
    const corr=n.category==='correspondence';
    N.push({
      p:d<0?1:d<=7?(corr?1:2):d<=14?2:3,
      cat:corr?'correspondence':n.category,
      entity:e.name,when:due,noteId:n.id,entityId:n.entityId,
      title:corr
        ? `${n.counterparty||'Response'} — ${n.title||'untitled note'}: ${d<0?Math.abs(d)+' days OVERDUE':d===0?'due today':'due in '+d+' days'}`
        : `Review "${n.title||'untitled note'}" — ${d<0?Math.abs(d)+' days past':'in '+d+' days'}`,
      body:corr
        ? `${e.name}: a response to ${n.counterparty||'this correspondence'} is due ${fmtD(due)}.`
          +(n.body?' '+n.body.replace(/\s+/g,' ').slice(0,160)+((n.body.length>160)?'…':''):'')
        : `${e.name}: ${catLabel(n.category).toLowerCase()} note flagged for review on ${fmtD(due)}.`
          +(n.body?' '+n.body.replace(/\s+/g,' ').slice(0,160)+((n.body.length>160)?'…':''):'')
    });
  }
  // VAT registration threshold
  for(const e of S.entities.filter(x=>x.type==='company'&&!x.vat&&x.turnover)){
    const t=+e.turnover;
    if(t>=VAT_THRESHOLD*.8) N.push({p:t>=VAT_THRESHOLD?1:3,cat:'planning',entity:e.name,
      title:`${e.name} is at ${Math.round(t/VAT_THRESHOLD*100)}% of the VAT registration threshold`,
      body:`Rolling 12-month turnover ${money(t)} against a ${money(VAT_THRESHOLD)} threshold. Registration is also triggered if turnover is expected to exceed it in the next 30 days alone.`});
  }
  const seen=new Set();
  return N.filter(n=>{const k=(n.noteId||'')+n.p+n.title;if(seen.has(k))return false;seen.add(k);return true;})
    .sort((a,b)=>a.p-b.p||((a.when?.getTime()??1e15)-(b.when?.getTime()??1e15)));
}

{id:'ledger',t:'Return, then liability, then payment',

 what:'Each payment on account is 50% of the PRECEDING year’s liability, and is due whether or not this year’s return exists. That is why the portal charges them before you file.',
 detail:['Not required where the preceding year’s liability was under £1,000, or where 80% or more of that liability was met by deduction at source.',
   'The base is income tax and Class 4 NIC. It excludes capital gains tax and Class 2 NIC, so a year with a large gain does not inflate next year’s instalments.',
   'The balancing payment is then this year’s declared liability less the two payments on account. Where they overshot, it is negative and a repayment is due.'],
 cites:[['TMA 1970 s.59A','Payments on account.'],['SAM1010','HMRC on the de minimis tests.']]},

{id:'pa-taper',t:'The personal allowance taper and the 60% band',
 tags:'personal allowance taper 100000 100k 60 percent band lost adjusted net income marginal',
 what:()=>`The personal allowance of ${money(itFor(tyOfDate(asAt())).pa)} is withdrawn by £1 for every £2 of adjusted net income above ${money(itFor(tyOfDate(asAt())).paTaperFrom)}, producing an effective marginal rate of 60% across the band.`,
 detail:['The taper is on adjusted net income, so a pension contribution or Gift Aid payment reduces it pound for pound and can recover allowance at an effective 60% relief.',
   'The band is where the largest single planning gain usually sits, and it is invisible on a rate table.'],
 cites:[['ITA 2007 s.35 / s.58','Personal allowance and adjusted net income.']]},

{id:'s24',t:'The finance cost reducer',
 tags:'finance cost reducer section 24 mortgage interest property landlord 20 basic rate',
 what:'Finance costs on residential property are not deductible from property income. Instead a basic-rate reducer of 20% is given against the tax, limited to the lowest of finance costs, property profits and adjusted total income.',
 detail:['Because the reducer stays at the basic rate while property income rates are announced to rise 2pp from 6 April 2027, the gap widens. That is deliberate, not a rounding problem in the computation.',
   'The restriction does not apply to commercial property or to companies.'],
 cites:[['ITTOIA 2005 s.272A / ITA 2007 s.274A','The restriction and the reducer.']]},

{id:'form17',t:'Form 17 and jointly held property',
 tags:'form 17 joint property spouse 50 50 beneficial split 60 days declaration unequal',
 what:'Property held jointly by spouses is taxed 50/50 regardless of actual beneficial ownership, unless a Form 17 declaration is in force. The declaration must reach HMRC within 60 days of its date, and there is no power to extend.',
 detail:['Form 17 requires genuinely unequal beneficial interests and must state the true position. It cannot be used to allocate income away from the beneficial owner.',
   'The 60 days runs from the DATE OF THE DECLARATION, not from the deed of trust and not from the start of the tax year. A late declaration is simply void and you start again.',
   'Close company shares are Exception D: actual entitlement always applies and no Form 17 is possible or needed.'],
 judgement:'The 60-day limit is unextendable — TSEM9862 is explicit and there is no discretion to appeal to. The portal treats it as an unextendable deadline and flags it differently from everything else for that reason.',
 cites:[['ITA 2007 s.836','The 50/50 rule.'],['ITA 2007 s.837','The declaration.'],
   ['TSEM9862','60 days, no power to extend.']]},

{id:'settlements',t:'Dividends to a spouse and the settlements legislation',
 tags:'settlement settlements spouse dividend jones garnett 626 outright gift shares alphabet',
 what:'A gift of shares between spouses escapes the settlements legislation under the outright gift exception, provided the shares are ordinary shares carrying full rights and the gift is unconditional.',
 detail:['The shares must carry votes, full dividend rights AND capital on a winding up. A share stripped of capital rights is not an outright gift of property.',
   'The gift must be unconditional with no reversion to the donor.',
   'Jones v Garnett settled this for ordinary shares gifted between spouses. It did not bless every alphabet share arrangement.'],
 judgement:'Where the shares are a separate class with restricted rights, or the arrangement includes any understanding about how dividends will be applied, the exception is at risk. HMRC’s view and the decided cases diverge on how far the exception stretches, and this is a facts-and-circumstances judgement.',
 cites:[['ITTOIA 2005 s.624','The settlements charge.'],['ITTOIA 2005 s.626','The outright gift exception.'],
   ['Jones v Garnett [2007] UKHL 35','']]},

{id:'hicbc',t:'High Income Child Benefit Charge',
 tags:'hicbc child benefit charge 60000 60k adjusted net income clawback',
 what:()=>{const y=itFor(tyOfDate(asAt()));return `The charge claws back Child Benefit at 1% for every £${y.hicbcStep} of adjusted net income above ${money(y.hicbcLo)}, so it is fully withdrawn at ${money(y.hicbcLo+100*y.hicbcStep)}.`},
 detail:['It falls on the higher earner of the couple, which is not necessarily the claimant.',
   'It is charged through Self Assessment, so it forms part of the liability that drives next year’s payments on account.'],
 cites:[['ITEPA 2003 Part 10 Ch 8','The charge.']]},

// --- Capital gains --------------------------------------------------------
{id:'badr',t:'Business Asset Disposal Relief',
 tags:'badr entrepreneurs relief cgt 2 years lifetime limit 5 percent shares disposal',
 what:'BADR requires the conditions to be met throughout the two years ending with the disposal: 5% of ordinary share capital and votes, entitlement to 5% of distributable profits and of assets on a winding up, employee or officer, and the company a trading company.',
 detail:['All of the conditions must be satisfied continuously. A share reorganisation or a change of employment status restarts the clock.',
   'The lifetime limit is £1m of qualifying gains.',
   'The portal records the date from which all conditions have been continuously met, because that date — not the acquisition date — is what the two years run from.'],
 judgement:'"Trading company" is a facts test with a substantial non-trading activities gloss. A company holding significant surplus cash or investment property may fail it, and HMRC’s 20% rule of thumb is guidance rather than statute.',
 cites:[['TCGA 1992 s.169I','The disposal conditions.'],['TCGA 1992 s.169S','Personal company and trading company.']]},

{id:'cgt-60day',t:'The 60-day residential property return',
 tags:'60 day cgt residential property report disposal separate return uk',
 what:'A disposal of UK residential property giving rise to a gain must be reported and the tax paid within 60 days of completion, on a separate return from Self Assessment.',
 detail:['It runs alongside the Self Assessment return, not instead of it. The gain goes on both.',
   'No return is required where no tax is due — for example where the gain is fully covered by private residence relief.'],
 cites:[['TCGA 1992 Sch 2 para 3','The 60-day return.'],['CG-APP18','HMRC guidance.']]},

{id:'spouse-transfer',t:'Transfers between spouses',
 tags:'spouse transfer no gain no loss 58 cgt inter spousal base cost',
 what:'Transfers between spouses living together are on a no-gain-no-loss basis: the transferee takes over the transferor’s base cost, and no gain arises on the transfer itself.',
 detail:['This is the mechanism behind equalising a gain across two annual exempt amounts and two sets of rate bands.',
   'It applies for the whole of the tax year of separation, then stops.'],
 cites:[['TCGA 1992 s.58','No gain no loss.']]},

// --- Estate ---------------------------------------------------------------
{id:'iht-basics',t:'Inheritance tax on the estate',
 tags:'iht inheritance tax nil rate band nrb rnrb residence transferable spouse exemption 40',
 what:'The nil rate band is £325,000 and the residence nil rate band £175,000, both transferable between spouses. Transfers between spouses are exempt without limit. The rate above the bands is 40%.',
 detail:['The RNRB requires a qualifying residence closely inherited by a LINEAL descendant. Nieces, nephews and siblings do not qualify.',
   'The RNRB tapers away by £1 for every £2 of estate above £2m.',
   'A transferable band is claimed as a percentage of the band unused on the first death, applied to the band in force at the second — so it is not a fixed cash amount.'],
 cites:[['IHTA 1984 s.7','Rates.'],['IHTA 1984 s.18','Spouse exemption.'],['IHTA 1984 s.8A–8M','Transferable bands and RNRB.']]},

{id:'taper',t:'Taper relief on lifetime gifts',
 tags:'taper relief seven year 7 pet gift lifetime death 3 years misunderstanding',
 what:'Taper relief reduces the TAX on a failed potentially exempt transfer made between 3 and 7 years before death. It does not reduce the value of the gift, and it does nothing at all where the gift falls within the nil rate band.',
 detail:['This is the most commonly misunderstood relief in the code. A £200,000 gift made 5 years before death, with the nil rate band otherwise unused, attracts no tax — so there is no tax for taper to reduce, and the "60% relief" is worth nothing.',
   'The gift still uses the nil rate band first, which is where the real cost falls.'],
 judgement:'Taper is routinely presented as a reason to make gifts early. It is a reason, but not for the stated arithmetic — the seven-year clock on the nil rate band matters far more than the taper percentages.',
 cites:[['IHTA 1984 s.7(4)','Taper.'],['IHTM14611','HMRC on how taper applies to the tax, not the transfer.']]},

{id:'bpr',t:'Business and agricultural property relief',
 tags:'bpr apr business property relief agricultural 100 50 excepted assets allowance 1 million 2026',
 what:'BPR and APR relieve qualifying business and agricultural property at 100% or 50%. From April 2026 the 100% rate is capped by an allowance, with the excess relieved at 50%.',
 detail:['Excepted assets — assets not used wholly or mainly for the business and not required for future business use — are stripped out of the relieved value proportionately.',
   'Two years’ ownership is required, with replacement property rules.'],
 judgement:'The allowance itself is unresolved in the published guidance. Two GOV.UK policy papers describe a £1m allowance that is NOT transferable between spouses; IHTM25520 describes a £2.5m transferable figure. These cannot both be right, and the difference is worth up to £300,000 of tax on a second death. Do not rely on either until Finance Act 2026 Sch 12 has been read directly. The portal records this as an open point rather than picking a number.',
 cites:[['IHTA 1984 s.105','Relevant business property.'],['IHTA 1984 s.106','Two-year ownership.'],
   ['IHTA 1984 s.112','Excepted assets.'],['IHTM25520','Conflicts with the policy papers — see above.']]},

{id:'normal-exp',t:'Normal expenditure out of income',
 tags:'normal expenditure out of income exemption gifts regular surplus iht403 evidence',
 what:'Gifts made as part of normal expenditure out of income are exempt without limit and without a seven-year clock, provided they are habitual, made out of income rather than capital, and leave you able to maintain your usual standard of living.',
 detail:['The claim is made on IHT403 AFTER death, by your executors, from records kept contemporaneously. That is the whole difficulty: nobody is left to explain the pattern.',
   'A year-by-year schedule of net income, usual expenditure and gifts made is the evidence. The portal keeps one because it cannot be reconstructed later.'],
 cites:[['IHTA 1984 s.21','The exemption.'],['IHT403','The claim form.']]},

{id:'pensions-iht',t:'Pensions coming into the estate',
 tags:'pension iht 2027 april unused funds death benefits estate change',
 what:'Unused pension funds and death benefits come into the estate for inheritance tax for deaths on or after 6 April 2027.',
 detail:['This reverses the position that made pensions the most efficient asset to leave untouched, and it changes the order in which assets should be drawn down in retirement.',
   'The portal holds this as a dated rule rather than a boolean, so a projection for a death before that date still computes on the old basis.'],
 cites:[['Autumn Budget 2024','Announced.'],['Finance Act 2025','Legislation.']]},

// --- Companies House ------------------------------------------------------
{id:'confirmation',t:'The confirmation statement',
 tags:'confirmation statement cs01 companies house 14 days dormant strike off criminal',
 what:'A confirmation statement is due each year within 14 days of the end of the review period. It is required regardless of dormancy.',
 detail:['Missing it is a criminal offence and the most common trigger for compulsory strike-off. It is the cheapest filing to make and the most expensive to forget.',
   'It confirms the information on the register; it is not a set of accounts and carries no figures.'],
 cites:[['CA 2006 s.853A','Duty to deliver.']]},

{id:'dormant-accounts',t:'Dormant company filings',
 tags:'dormant aa02 accounts companies house nine months no ct600',
 what:'A dormant company files dormant accounts (AA02) at Companies House within 9 months of the period end, and a confirmation statement each year. No CT600 is due unless HMRC has issued a notice to file.',
 detail:['Companies Act dormancy and the Corporation Tax trade-or-business test are different tests. A company can be dormant for filing purposes and still count for association, or the reverse.'],
 cites:[['CA 2006 s.442','Accounts filing period.'],['CA 2006 s.1169','Dormant.']]}

// Topics whose content depends on the rate tables are written as functions so
// the explanation is generated from the same constants the engine computes
// with. A stale sentence in a knowledge base is worse than no sentence.
const kbField=(topic,f)=>{const v=topic[f];return typeof v==='function'?v():v;};

// --- Glossary --------------------------------------------------------------
// "What does LEL mean?" is a different question from "how does PAYE work?",
// and answering the first with the second is how this layer came to exist:
// the topic matcher scored a threshold question against the PAYE DATES topic
// on the strength of the words "PAYE" and "NIC" alone, and answered
// confidently about the wrong thing.
//
// A term index is checked BEFORE topic matching. Terms are exact — an acronym
// or a term of art — so a hit here is a hit, and a miss falls through to the
// topics rather than being smeared across them.
//
// `see` links to the fuller topic where there is one. Values are functions

const GLOSSARY=[

{t:'PT',full:'Primary Threshold',see:'nic-thresholds',

{t:'ST',full:'Secondary Threshold',see:'nic-thresholds',

{t:'EA',full:'Employment Allowance',see:'ea',
